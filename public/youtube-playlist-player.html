<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playlist Player</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      overflow: hidden;
    }

    /* ── Layout ─────────────────────────────────────────── */
    #app {
      display: grid;
      grid-template-columns: 260px 1fr 220px;
      height: 100vh;
    }

    /* ── Panel toggle buttons ────────────────────────────── */
    .panel-toggle {
      background: none;
      border: none;
      color: #666;
      cursor: pointer;
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 3px;
      flex-shrink: 0;
      line-height: 1;
      transition: color .15s, background .15s;
    }
    .panel-toggle:hover { color: #c9a84c; background: rgba(255,255,255,0.07); }

    /* ── Sidebar ─────────────────────────────────────────── */
    #sidebar {
      background: #12122a;
      border-right: 1px solid rgba(201, 168, 76, 0.15);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: min-width .2s, max-width .2s;
      min-width: 260px;
      max-width: 260px;
    }

    #sidebar-header {
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .08em;
      color: #c9a84c;
      text-transform: uppercase;
      border-bottom: 1px solid rgba(201, 168, 76, 0.15);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
    }

    #sidebar-list {
      flex: 1;
      overflow-y: auto;
      padding: 6px 0 20px;
    }

    /* Desktop collapsed state */
    #sidebar.collapsed {
      min-width: 36px;
      max-width: 36px;
    }
    #sidebar.collapsed #sidebar-list { display: none; }
    #sidebar.collapsed #sidebar-header-title { display: none; }
    #sidebar.collapsed #sidebar-header { justify-content: center; padding: 10px 4px; }

    /* genre group */
    details.genre-group {
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }
    details.genre-group summary {
      list-style: none;
      padding: 8px 14px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: #81C784;
      cursor: pointer;
      user-select: none;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    details.genre-group summary::-webkit-details-marker { display: none; }
    details.genre-group summary::before {
      content: '▶';
      font-size: 8px;
      transition: transform .15s;
      color: #555;
    }
    details.genre-group[open] summary::before { transform: rotate(90deg); }

    /* album item */
    .album-item {
      padding: 6px 14px 6px 26px;
      font-size: 12px;
      color: #aaa;
      cursor: pointer;
      line-height: 1.4;
      border-left: 2px solid transparent;
      transition: background .1s, color .1s;
    }
    .album-item:hover { background: rgba(255,255,255,0.05); color: #e0e0e0; }
    .album-item.active {
      color: #c9a84c;
      background: rgba(201, 168, 76, 0.08);
      border-left-color: #c9a84c;
    }
    .album-item.cursor:not(.active) {
      background: rgba(129, 199, 132, 0.08);
      border-left-color: #81C784;
      color: #e0e0e0;
    }

    /* ── Player column ───────────────────────────────────── */
    #player-col {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 0;
    }

    #player-header {
      padding: 10px 16px;
      font-size: 12px;
      color: #888;
      background: #16213e;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex-shrink: 0;
    }
    #player-header span { color: #c9a84c; font-weight: 600; }

    #iframe-wrap {
      position: relative;
      flex: 1;
      background: #0d0d1a;
      min-height: 0;
    }

    /* YT IFrame API container */
    #yt-wrap {
      position: absolute;
      inset: 0;
      display: none;
    }
    #yt-wrap > iframe {
      width: 100% !important;
      height: 100% !important;
      border: none;
    }

    #empty-state {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: #444;
    }
    #empty-state .icon { font-size: 48px; }
    #empty-state .hint { font-size: 13px; }

    #error-state {
      display: none;
      position: absolute;
      inset: 0;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 10px;
      color: #e57373;
    }
    #error-state .err-msg { font-size: 13px; max-width: 340px; text-align: center; line-height: 1.5; }

    #retry-btn {
      padding: 7px 18px;
      background: #c9a84c;
      color: #1a1a2e;
      border: none;
      border-radius: 5px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    #no-video-msg {
      display: none;
      position: absolute;
      inset: 0;
      align-items: center;
      justify-content: center;
      color: #666;
      font-size: 13px;
    }

    /* ── Loop controls ───────────────────────────────────── */
    #loop-controls {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      background: #0d0d1a;
      border-top: 1px solid rgba(255,255,255,0.06);
      flex-wrap: wrap;
      min-height: 38px;
      position: relative;
    }

    /* Spectrum strip along the bottom edge while birds or the loop timer run */
    #activity-line {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 3px;
      display: none;
      pointer-events: none;
      background: linear-gradient(90deg, #d32f2f, #e07b2e, #f5e050, #8fe03a, #4cb85a, #6ff2ff, #3f8fe0, #5a1fc4, #d32f2f);
      background-size: 200% 100%;
    }

    .ctrl-btn {
      padding: 5px 10px;
      border: none;
      border-radius: 5px;
      background: #2c3e50;
      color: #e0e0e0;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }
    .ctrl-btn:hover { background: #37474f; }

    .ctrl-divider {
      width: 1px;
      height: 20px;
      background: rgba(255,255,255,0.12);
      flex-shrink: 0;
      margin: 0 2px;
    }

    #loop-ts-input {
      width: 72px;
      padding: 3px 5px;
      border: 1px solid #555;
      border-radius: 5px;
      background: #1a1a1a;
      color: #ddd;
      font-size: 11px;
      font-family: 'Courier New', monospace;
      outline: none;
    }
    #loop-ts-input:focus { border-color: #c9a84c; }

    #loop-btn {
      padding: 5px 12px;
      border: none;
      border-radius: 5px;
      background: linear-gradient(45deg, #ff9800, #f57c00);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    #loop-pause-btn {
      padding: 5px 10px;
      border: none;
      border-radius: 5px;
      background: #546e7a;
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      opacity: 0.35;
    }
    #loop-pause-btn:not(:disabled) { opacity: 1; }

    #loop2-ts-input {
      width: 72px;
      padding: 3px 5px;
      border: 1px solid #555;
      border-radius: 5px;
      background: #1a1a1a;
      color: #ddd;
      font-size: 11px;
      font-family: 'Courier New', monospace;
      outline: none;
    }
    #loop2-ts-input:focus { border-color: #c9a84c; }

    #loop2-len-input, #loop2-count-input {
      padding: 3px 4px;
      border: 1px solid #555;
      border-radius: 5px;
      background: #1a1a1a;
      color: #ddd;
      font-size: 12px;
      font-family: 'Courier New', monospace;
      outline: none;
    }
    #loop2-len-input   { width: 56px; }
    #loop2-count-input { width: 42px; }
    #loop2-len-input:focus, #loop2-count-input:focus { border-color: #c9a84c; }
    .loop-x { color: #888; font-size: 12px; margin: 0 -3px; }

    #birds-slider { width: 80px; cursor: pointer; }

    #loop2-btn {
      padding: 5px 12px;
      border: none;
      border-radius: 5px;
      background: linear-gradient(45deg, #ab47bc, #8e24aa);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    #loop2-pause-btn {
      padding: 5px 10px;
      border: none;
      border-radius: 5px;
      background: #546e7a;
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      opacity: 0.35;
    }
    #loop2-pause-btn:not(:disabled) { opacity: 1; }

    #loop-status {
      font-size: 11px;
      color: #888;
      white-space: nowrap;
      margin-left: 2px;
    }

    /* ── Toast ───────────────────────────────────────────── */
    #toast {
      position: fixed;
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%) translateY(10px);
      background: #2c2c44;
      color: #e0e0e0;
      border: 1px solid rgba(229, 115, 115, 0.4);
      border-left: 3px solid #e57373;
      padding: 10px 16px;
      border-radius: 6px;
      font-size: 13px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.35);
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s, transform .2s;
      z-index: 999;
      max-width: 90vw;
    }
    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ── Track list (right pane) ─────────────────────────── */
    #track-list {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #12122a;
      border-left: 1px solid rgba(201, 168, 76, 0.15);
      transition: min-width .2s, max-width .2s;
      min-width: 220px;
      max-width: 220px;
    }

    #track-list-header {
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .08em;
      color: #c9a84c;
      text-transform: uppercase;
      border-bottom: 1px solid rgba(201, 168, 76, 0.15);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    #track-list-header-title { flex: 1; }

    #track-list-inner {
      flex: 1;
      overflow-y: auto;
      padding: 6px 0 20px;
    }
    #track-list-empty { padding: 20px 14px; font-size: 12px; color: #444; }

    /* Desktop collapsed state */
    #track-list.collapsed {
      min-width: 36px;
      max-width: 36px;
    }
    #track-list.collapsed #track-list-inner { display: none; }
    #track-list.collapsed #track-list-header-title { display: none; }
    #track-list.collapsed #track-list-header { justify-content: center; padding: 10px 4px; }

    .track-item {
      padding: 6px 14px;
      font-size: 11px;
      color: #aaa;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 2px;
      border-left: 2px solid transparent;
      transition: background .1s, color .1s;
    }
    .track-item:hover { background: rgba(255,255,255,0.05); color: #e0e0e0; }
    .track-item.track-active {
      color: #c9a84c;
      background: rgba(201, 168, 76, 0.08);
      border-left-color: #c9a84c;
    }
    .track-time { font-family: 'Courier New', monospace; font-size: 10px; color: #555; }
    .track-item.track-active .track-time { color: #a07e30; }

    /* ── Mobile layout (≤768px) ──────────────────────────── */
    @media (max-width: 768px) {
      html, body { overflow-y: auto; height: auto; overflow-x: hidden; }

      #app {
        display: flex !important;
        flex-direction: column;
        height: auto;
        min-height: 100vh;
      }

      #player-col { order: 1; overflow: visible; flex-shrink: 0; }

      #iframe-wrap {
        position: relative;
        flex: none;
        height: 56.25vw; /* 16:9 */
        min-height: 200px;
      }

      #loop-controls { flex-wrap: wrap; }

      #sidebar {
        order: 2;
        min-width: 0 !important;
        max-width: none !important;
        width: 100%;
        border-right: none;
        border-top: 1px solid rgba(201, 168, 76, 0.15);
        transition: none;
      }
      /* On mobile, collapsed = just hide the list; header stays for tapping */
      #sidebar.collapsed #sidebar-header-title { display: inline !important; }
      #sidebar.collapsed #sidebar-header { justify-content: space-between !important; padding: 10px 14px !important; }
      #sidebar-list { max-height: 50vh; }

      #track-list {
        order: 3;
        min-width: 0 !important;
        max-width: none !important;
        width: 100%;
        border-left: none;
        border-top: 1px solid rgba(201, 168, 76, 0.15);
        transition: none;
      }
      #track-list.collapsed #track-list-header-title { display: inline !important; }
      #track-list.collapsed #track-list-header { justify-content: space-between !important; padding: 10px 14px !important; }
      #track-list-inner { max-height: 50vh; }
    }
  </style>
</head>
<body>

<div id="app">

  <!-- Sidebar -->
  <div id="sidebar">
    <div id="sidebar-header">
      <span id="sidebar-header-title">Playlists</span>
      <button id="sidebar-toggle" class="panel-toggle" title="Collapse playlists">◀</button>
    </div>
    <div id="sidebar-list">
      <div style="padding:20px 14px; font-size:12px; color:#555;">Loading playlists…</div>
    </div>
  </div>

  <!-- Player column -->
  <div id="player-col">
    <div id="player-header">Select a playlist to begin</div>

    <div id="iframe-wrap">
      <div id="empty-state">
        <div class="icon">▶</div>
        <div class="hint">Click an album in the sidebar</div>
      </div>
      <div id="error-state">
        <div class="err-msg" id="err-text">Failed to load playlists.</div>
        <button id="retry-btn">Retry</button>
      </div>
      <div id="no-video-msg">No video available for this album</div>
      <!-- YouTube IFrame API renders into this div -->
      <div id="yt-wrap"><div id="yt-player"></div></div>
    </div>

    <!-- Playback + Loop controls -->
    <div id="loop-controls">
      <!-- Playback controls -->
      <button id="ctrl-back10"  class="ctrl-btn" title="Skip back 10s">−10s</button>
      <button id="ctrl-fwd30"   class="ctrl-btn" title="Skip forward 30s">+30s</button>
      <button id="ctrl-playpause" class="ctrl-btn" title="Play / Pause">▶</button>
      <button id="ctrl-vol-down" class="ctrl-btn" title="Volume −10%">🔉</button>
      <button id="ctrl-vol-up"   class="ctrl-btn" title="Volume +10%">🔊</button>
      <span id="ctrl-time" style="font-family:'Courier New',monospace; font-size:12px; font-weight:700; color:#e0e0e0; white-space:nowrap; min-width:52px; text-align:right;">--:--</span>
      <span class="ctrl-divider"></span>
      <!-- Loop controls -->
      <input id="loop-ts-input" type="text" value="00:00:00" placeholder="00:00:00"
             title="Loop back to this timestamp (HH:MM:SS)" spellcheck="false">
      <button id="loop-btn" title="Play 30s, rewind, repeat x40">⏱️ 30s</button>
      <button id="loop-pause-btn" title="Pause loop" disabled>⏸</button>
      <input id="loop2-ts-input" type="text" value="00:00:00" placeholder="00:00:00"
             title="Loop back to this timestamp (HH:MM:SS)" spellcheck="false">
      <input id="loop2-len-input" type="number" min="1" value="180"
             title="Loop length in seconds (180 = 3m). Applies from the next loop if the timer is running.">
      <span class="loop-x">&times;</span>
      <input id="loop2-count-input" type="number" min="1" max="99" value="8"
             title="Number of repeats (1-99). Applies from the next loop if the timer is running.">
      <button id="loop2-btn" title="Play 3m, rewind, repeat x8">⏱️ 3m</button>
      <button id="loop2-pause-btn" title="Pause loop" disabled>⏸</button>
      <button id="birds-btn" class="ctrl-btn" title="Toggle forest birdsong">🐦</button>
      <input id="birds-slider" type="range" min="0" max="100" value="30" title="Birds volume">
      <button id="dots-btn" class="ctrl-btn" title="Dots: guess the count of a glowing network">Dots</button>
      <button id="breathe-btn" class="ctrl-btn" title="Box breathing 4-4-4-4 with a stopwatch">Breathe</button>
      <a id="ytAnchor" href="#" target="_blank" rel="noopener" style="display:none; color:#FF4040; font-size:11px; text-decoration:none; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">&#9654; YouTube</a>
      <span id="loop-status"></span>
      <div id="activity-line"></div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast"></div>

  <!-- Track list (right pane) -->
  <div id="track-list">
    <div id="track-list-header">
      <button id="tracks-toggle" class="panel-toggle" title="Collapse tracks">▶</button>
      <span id="track-list-header-title">Tracks</span>
    </div>
    <div id="track-list-inner">
      <div id="track-list-empty">Select an album</div>
    </div>
  </div>

</div>

<script>
  // ── State ────────────────────────────────────────────────────────────────────
  let playlists    = null;
  let allAlbums    = [];
  let cursorIndex  = -1;
  let activeYoutubeId = '';
  let pendingVideo = null; // queued while YT API is still loading

  // ── DOM refs ─────────────────────────────────────────────────────────────────
  const appEl          = document.getElementById('app');
  const sidebar        = document.getElementById('sidebar');
  const sidebarList    = document.getElementById('sidebar-list');
  const playerHeader   = document.getElementById('player-header');
  const emptyState     = document.getElementById('empty-state');
  const errorState     = document.getElementById('error-state');
  const errText        = document.getElementById('err-text');
  const noVideoMsg     = document.getElementById('no-video-msg');
  // Toggle the wrapper, not #yt-player: YT.Player replaces that div with the iframe
  const ytPlayerDiv    = document.getElementById('yt-wrap');
  const trackListEl    = document.getElementById('track-list');
  const trackListInner = document.getElementById('track-list-inner');
  const trackListEmpty = document.getElementById('track-list-empty');
  const retryBtn       = document.getElementById('retry-btn');
  const sidebarToggle  = document.getElementById('sidebar-toggle');
  const tracksToggle   = document.getElementById('tracks-toggle');
  const loopTsInput    = document.getElementById('loop-ts-input');
  const loopBtn        = document.getElementById('loop-btn');
  const loopPauseBtn   = document.getElementById('loop-pause-btn');
  const loop2TsInput   = document.getElementById('loop2-ts-input');
  const loop2Btn       = document.getElementById('loop2-btn');
  const loop2PauseBtn  = document.getElementById('loop2-pause-btn');
  const loopStatusEl   = document.getElementById('loop-status');
  const ytAnchorEl     = document.getElementById('ytAnchor');
  const toastEl        = document.getElementById('toast');

  let _toastTimer = null;
  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    if (_toastTimer) clearTimeout(_toastTimer);
    _toastTimer = setTimeout(() => toastEl.classList.remove('show'), 4000);
  }

  // ── YouTube IFrame Player API ─────────────────────────────────────────────────
  let ytPlayer = null;
  let ytReady  = false;

  const YT_ERROR_MEANINGS = {
    2: 'Invalid videoId (malformed parameter)',
    5: 'HTML5 player error',
    100: 'Video not found (removed or private)',
    101: 'Owner disabled embedding on other sites',
    150: 'Owner disabled embedding on other sites (same as 101)'
  };

  console.log('[YT] injecting iframe_api script tag');

  window.onYouTubeIframeAPIReady = function () {
    console.log('[YT] onYouTubeIframeAPIReady fired, YT global:', typeof YT, YT && YT.loaded);
    ytPlayer = new YT.Player('yt-player', {
      width: '100%',
      height: '100%',
      playerVars: { rel: 0, modestbranding: 1 },
      events: {
        onReady: function () {
          console.log('[YT] player onReady, pendingVideo=', pendingVideo);
          ytReady = true;
          if (pendingVideo) {
            console.log('[YT] loading pending video', pendingVideo);
            ytPlayer.loadVideoById(pendingVideo);
            ytPlayerDiv.style.display = 'block';
            pendingVideo = null;
          }
          startTimeClock();
        },
        onStateChange: function (e) {
          console.log('[YT] onStateChange, state=', e.data, '(-1 unstarted, 0 ended, 1 playing, 2 paused, 3 buffering, 5 cued)');
          if (window._ytOnStateChange) window._ytOnStateChange(e);
        },
        onError: function (e) {
          console.error('[YT] player onError, code=', e.data, '-', YT_ERROR_MEANINGS[e.data] || 'unknown error');
          if (e.data === 101 || e.data === 150) {
            showToast('Embedding disabled for "' + (playerHeader.textContent || 'this video') + '" — watch it on YouTube instead');
          } else if (e.data === 100) {
            showToast('Video unavailable (removed or private): ' + (playerHeader.textContent || ''));
          } else {
            showToast('Playback error (code ' + e.data + ') for ' + (playerHeader.textContent || 'this video'));
          }
        }
      }
    });
  };

  // Inject YT IFrame API script
  (function () {
    const tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    tag.onerror = () => console.error('[YT] failed to load iframe_api script (blocked? offline? adblock?)');
    tag.onload = () => console.log('[YT] iframe_api script tag loaded (onYouTubeIframeAPIReady should fire next)');
    document.head.appendChild(tag);
  })();

  // Fallback: warn if the API never calls back within 8s
  setTimeout(() => {
    if (!ytReady) {
      console.warn('[YT] still not ready 8s after page load — onYouTubeIframeAPIReady never fired, or player onReady never fired. Check network tab for youtube.com/iframe_api and an adblocker/CSP blocking it.');
    }
  }, 8000);

  // YT player helpers
  function ytLoadVideo(videoId, startSeconds) {
    console.log('[YT] ytLoadVideo called, videoId=', videoId, 'startSeconds=', startSeconds, 'ytReady=', ytReady);
    const params = { videoId, startSeconds: startSeconds || 0 };
    if (!ytPlayer || !ytReady) {
      console.log('[YT] player not ready yet, queueing as pendingVideo');
      pendingVideo = params;
      return;
    }
    pendingVideo = null;
    ytPlayer.loadVideoById(params);
    ytPlayerDiv.style.display = 'block';
  }

  function ytSeekTo(secs) {
    if (!ytPlayer || !ytReady) return;
    ytPlayer.seekTo(secs, true);
    ytPlayer.playVideo();
  }

  function ytGetCurrentTime() {
    if (!ytPlayer || !ytReady) return 0;
    return ytPlayer.getCurrentTime() || 0;
  }

  function ytGetVolume() {   // returns 0–100
    if (!ytPlayer || !ytReady) return 100;
    return ytPlayer.getVolume();
  }

  function ytSetVolume(v) {  // v: 0–100
    if (!ytPlayer || !ytReady) return;
    ytPlayer.setVolume(Math.max(0, Math.min(100, Math.round(v))));
  }

  // ── Helpers ──────────────────────────────────────────────────────────────────
  function toLabel(key) {
    return key.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
  }

  function showOnly(el) {
    emptyState.style.display   = 'none';
    errorState.style.display   = 'none';
    noVideoMsg.style.display   = 'none';
    ytPlayerDiv.style.display  = 'none';
    // ytPlayerDiv is absolutely positioned — needs 'block' to override CSS display:none
    el.style.display = (el === ytPlayerDiv) ? 'block' : 'flex';
  }

  function secsToHMS(s) {
    s = Math.max(0, Math.floor(s));
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    const sec = s % 60;
    return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0') + ':' + String(sec).padStart(2, '0');
  }

  function parseHMS(ts) {
    const parts = String(ts).split(':').map(Number);
    return (parts[0] || 0) * 3600 + (parts[1] || 0) * 60 + (parts[2] || 0);
  }

  // ── Panel collapse (desktop & mobile) ─────────────────────────────────────────
  function isMobile() { return window.innerWidth <= 768; }

  function updateDesktopGrid() {
    if (isMobile()) return;
    const leftW  = sidebar.classList.contains('collapsed')   ? '36px' : '260px';
    const rightW = trackListEl.classList.contains('collapsed') ? '36px' : '220px';
    appEl.style.gridTemplateColumns = `${leftW} 1fr ${rightW}`;
  }

  sidebarToggle.addEventListener('click', (e) => {
    e.stopPropagation();
    sidebar.classList.toggle('collapsed');
    const collapsed = sidebar.classList.contains('collapsed');
    sidebarToggle.textContent = collapsed ? (isMobile() ? '▼' : '▶') : (isMobile() ? '▲' : '◀');
    sidebarToggle.title = collapsed ? 'Expand playlists' : 'Collapse playlists';
    if (!isMobile()) updateDesktopGrid();
  });

  tracksToggle.addEventListener('click', (e) => {
    e.stopPropagation();
    trackListEl.classList.toggle('collapsed');
    const collapsed = trackListEl.classList.contains('collapsed');
    tracksToggle.textContent = collapsed ? (isMobile() ? '▼' : '◀') : (isMobile() ? '▲' : '▶');
    tracksToggle.title = collapsed ? 'Expand tracks' : 'Collapse tracks';

  document.getElementById('sidebar-header').addEventListener('click', (e) => {
    if (!isMobile() || e.target === sidebarToggle) return;
    sidebarToggle.click();
  });
  document.getElementById('track-list-header').addEventListener('click', (e) => {
    if (!isMobile() || e.target === tracksToggle) return;
    tracksToggle.click();
  });

  window.addEventListener('resize', updateDesktopGrid);

  // Collapse panels on mobile at startup
  if (isMobile()) {
    sidebar.classList.add('collapsed');
    trackListEl.classList.add('collapsed');
    sidebarToggle.textContent = '▼';
    tracksToggle.textContent  = '▼';
  }

  // ── Loop engine (30s × 40, ported from yt-controls) ──────────────────────────
  const T3_DURATION_MS = 30000;
  const T3_TOTAL_LOOPS = 40;
  const T3_FADE_MS     = 2000;

  let t3Timeout        = null;
  let t3LoopsRemaining = 0;
  let t3SavedVolume    = 100;  // 0–100
  let t3Generation     = 0;
  let t3Paused         = false;
  let _loopStatusTimer = null;

  function flashLoopStatus(msg, color) {
    loopStatusEl.textContent = msg;
    loopStatusEl.style.color = color;
    if (_loopStatusTimer) clearTimeout(_loopStatusTimer);
    _loopStatusTimer = setTimeout(() => { loopStatusEl.textContent = ''; }, 2500);
  }

  function setLoopStatus(msg, color) {
    if (_loopStatusTimer) { clearTimeout(_loopStatusTimer); _loopStatusTimer = null; }
    loopStatusEl.textContent = msg;
    loopStatusEl.style.color = color;
  }

  function fadeVolTo(target0to100, durationMs, gen) {
    return new Promise(resolve => {
      const startVol = ytGetVolume();
      const steps = 20;
      let i = 0;
      const iv = setInterval(() => {
        if (gen !== t3Generation) { clearInterval(iv); resolve(); return; }
        i++;
        ytSetVolume(startVol + (target0to100 - startVol) * (i / steps));
        if (i >= steps) { clearInterval(iv); resolve(); }
      }, durationMs / steps);
    });
  }

  function runT3Loop(gen) {
    const currentLoop = T3_TOTAL_LOOPS - t3LoopsRemaining + 1;
    loopBtn.textContent = `⏹️ ${currentLoop}/${T3_TOTAL_LOOPS}`;
    setLoopStatus(`loop ${currentLoop}/${T3_TOTAL_LOOPS}`, '#ff9800');

    t3Timeout = setTimeout(async () => {
      if (gen !== t3Generation) return;
      await fadeVolTo(0, T3_FADE_MS, gen);
      if (gen !== t3Generation) return;
      t3LoopsRemaining--;
      ytSeekTo(parseHMS(loopTsInput.value));
      if (t3LoopsRemaining > 0) {
        await fadeVolTo(t3SavedVolume, 1000, gen);
        if (gen !== t3Generation) return;
        runT3Loop(gen);
      } else {
        t3Timeout = null;
        ytSetVolume(t3SavedVolume);
        loopBtn.textContent           = '⏱️ 30s';
        loopBtn.style.background      = 'linear-gradient(45deg,#ff9800,#f57c00)';
        loopPauseBtn.disabled         = true;
        loopPauseBtn.textContent      = '⏸';
        loopPauseBtn.style.background = '#546e7a';
        t3Paused = false;
        flashLoopStatus(`Done ✓ (${T3_TOTAL_LOOPS}/${T3_TOTAL_LOOPS})`, '#2ecc71');
      }
    }, T3_DURATION_MS - T3_FADE_MS);
  }

  function cancelT3() {
    t3Generation++;
    if (t3Timeout) { clearTimeout(t3Timeout); t3Timeout = null; }
    t3Paused = false;
    ytSetVolume(t3SavedVolume);
    loopBtn.textContent           = '⏱️ 30s';
    loopBtn.style.background      = 'linear-gradient(45deg,#ff9800,#f57c00)';
    loopPauseBtn.disabled         = true;
    loopPauseBtn.textContent      = '⏸';
    loopPauseBtn.style.background = '#546e7a';
    flashLoopStatus('Loop cancelled', '#e74c3c');
  }

  function toggleT3() {
    if (t3Timeout || t3Paused) { cancelT3(); return; }
    if (!activeYoutubeId) { flashLoopStatus('No video loaded', '#e74c3c'); return; }
    loopTsInput.value             = secsToHMS(ytGetCurrentTime());
    t3SavedVolume                 = ytGetVolume();
    t3LoopsRemaining              = T3_TOTAL_LOOPS;
    t3Paused                      = false;
    t3Generation++;
    loopPauseBtn.disabled         = false;
    loopPauseBtn.textContent      = '⏸';
    loopPauseBtn.style.background = '#546e7a';
    runT3Loop(t3Generation);
  }

  function toggleT3Pause() {
    t3Paused = !t3Paused;
    if (t3Paused) {
      if (t3Timeout) { clearTimeout(t3Timeout); t3Timeout = null; }
      loopPauseBtn.textContent     = '▶ resume';
      loopPauseBtn.style.background = '#f57f17';
      setLoopStatus('Loop paused', '#ffb300');
    } else {
      loopPauseBtn.textContent     = '⏸';
      loopPauseBtn.style.background = '#546e7a';
      loopTsInput.value = secsToHMS(ytGetCurrentTime());
      t3Generation++;
      runT3Loop(t3Generation);
    }
  }

  // ── Loop engine (3m × 8, ported from yt-controls) ────────────────────────────
  const T4_DEFAULT_SECS  = 180; // 3 minutes
  const T4_DEFAULT_LOOPS = 8;
  const T4_LEN_KEY   = 'ytpp_loop_secs';
  const T4_LOOPS_KEY = 'ytpp_loop_count';
  const loop2LenInput   = document.getElementById('loop2-len-input');
  const loop2CountInput = document.getElementById('loop2-count-input');

  // Loop length in seconds from the number box (falls back to 3m)
  function t4Secs() {
    const n = parseFloat(loop2LenInput.value);
    return isFinite(n) && n >= 1 ? n : T4_DEFAULT_SECS;
  }
  // Repeats from the x-box (whole number 1-99, falls back to 8)
  function t4Loops() {
    const n = parseInt(loop2CountInput.value, 10);
    return n >= 1 && n <= 99 ? n : T4_DEFAULT_LOOPS;
  }
  function t4Name(secs) {
    return secs >= 60 && secs % 60 === 0 ? (secs / 60) + 'm' : secs + 's';
  }
  function updateT4Idle() {
    const name = t4Name(t4Secs());
    loop2Btn.textContent = '⏱️ ' + name;
    loop2Btn.title = 'Play ' + name + ', rewind, repeat x' + t4Loops();
  }
  try {
    const n = parseFloat(localStorage.getItem(T4_LEN_KEY));
    if (isFinite(n) && n >= 1) loop2LenInput.value = n;
    const c = parseInt(localStorage.getItem(T4_LOOPS_KEY), 10);
    if (c >= 1 && c <= 99) loop2CountInput.value = c;
  } catch (e) {}
  loop2LenInput.addEventListener('input', () => {
    try { localStorage.setItem(T4_LEN_KEY, loop2LenInput.value); } catch (e) {}
    if (!t4Timeout && !t4Paused) updateT4Idle();
  });
  loop2CountInput.addEventListener('input', () => {
    try { localStorage.setItem(T4_LOOPS_KEY, loop2CountInput.value); } catch (e) {}
    if (!t4Timeout && !t4Paused) updateT4Idle();
  });
  [loop2LenInput, loop2CountInput].forEach(el => el.addEventListener('keydown', e => e.stopPropagation()));

  let t4Timeout        = null;
  let t4LoopsRemaining = 0;
  let t4Done           = 0;
  let t4Generation     = 0;
  let t4Paused         = false;

  function runT4Loop(gen) {
    const total = t4Done + t4LoopsRemaining;
    const currentLoop = t4Done + 1;
    loop2Btn.textContent = `⏹️ ${currentLoop}/${total}`;
    setLoopStatus(`${t4Name(t4Secs())} loop ${currentLoop}/${total}`, '#ab47bc');

    t4Timeout = setTimeout(() => {
      if (gen !== t4Generation) return;
      t4LoopsRemaining--;
      t4Done++;
      ytSeekTo(parseHMS(loop2TsInput.value));
      if (t4LoopsRemaining > 0) {
        runT4Loop(gen);
      } else {
        t4Timeout = null;
        const total = t4Done;
        loop2Btn.style.background      = 'linear-gradient(45deg,#ab47bc,#8e24aa)';
        loop2PauseBtn.disabled         = true;
        loop2PauseBtn.textContent      = '⏸';
        loop2PauseBtn.style.background = '#546e7a';
        t4Paused = false;
        updateT4Idle();
        flashLoopStatus(`${t4Name(t4Secs())} complete (${total}/${total})`, '#2ecc71');
      }
    }, t4Secs() * 1000);
  }

  function cancelT4() {
    t4Generation++;
    if (t4Timeout) { clearTimeout(t4Timeout); t4Timeout = null; }
    t4Paused = false;
    loop2Btn.style.background      = 'linear-gradient(45deg,#ab47bc,#8e24aa)';
    loop2PauseBtn.disabled         = true;
    loop2PauseBtn.textContent      = '⏸';
    loop2PauseBtn.style.background = '#546e7a';
    updateT4Idle();
    flashLoopStatus('Timer cancelled', '#e74c3c');
  }

  function toggleT4() {
    if (t4Timeout || t4Paused) { cancelT4(); return; }
    if (!activeYoutubeId) { flashLoopStatus('No video loaded', '#e74c3c'); return; }
    loop2TsInput.value             = secsToHMS(ytGetCurrentTime());
    t4LoopsRemaining               = t4Loops();
    t4Done                         = 0;
    t4Paused                       = false;
    t4Generation++;
    loop2PauseBtn.disabled         = false;
    loop2PauseBtn.textContent      = '⏸';
    loop2PauseBtn.style.background = '#546e7a';
    runT4Loop(t4Generation);
  }

  function toggleT4Pause() {
    t4Paused = !t4Paused;
    if (t4Paused) {
      if (t4Timeout) { clearTimeout(t4Timeout); t4Timeout = null; }
      loop2PauseBtn.textContent     = '▶ resume';
      loop2PauseBtn.style.background = '#f57f17';
      setLoopStatus('Loop paused', '#ffb300');
    } else {
      loop2PauseBtn.textContent     = '⏸';
      loop2PauseBtn.style.background = '#546e7a';
      loop2TsInput.value = secsToHMS(ytGetCurrentTime());
      t4Generation++;
      runT4Loop(t4Generation);
    }
  }

  // ── Birds (ambient loop with its own volume slider) ──────────────────────────
  const BIRDS_URL = 'https://www.dropbox.com/scl/fi/x09bfk82awmzt89r1oxtp/Forest-Birdsong-Nature-Sounds-trimmed-30min-loudnorm-2G8LAiHSCAs.mp3?rlkey=7pydzw8pia681zyfijrjszqwi&st=mowf7s9e&raw=1';
  const BIRDS_VOL_KEY = 'ytpp_birds_vol';
  const birdsBtn    = document.getElementById('birds-btn');
  const birdsSlider = document.getElementById('birds-slider');
  let _birds = null;
  try {
    const n = parseInt(localStorage.getItem(BIRDS_VOL_KEY), 10);
    if (n >= 0 && n <= 100) birdsSlider.value = n;
  } catch (e) {}

  function stopBirds() {
    if (_birds) { _birds.pause(); _birds.removeAttribute('src'); _birds.load(); _birds = null; }
    birdsBtn.style.background = '';
  }

  birdsBtn.addEventListener('click', () => {
    if (_birds) { stopBirds(); flashLoopStatus('Birds off', '#888'); return; }
    const a = new Audio(BIRDS_URL);
    a.loop = true;
    a.volume = birdsSlider.value / 100;
    a.addEventListener('error', () => {
      if (_birds !== a) return;
      stopBirds();
      flashLoopStatus('Birds unavailable', '#e74c3c');
    });
    _birds = a;
    birdsBtn.style.background = '#2e7d32';
    a.play().then(() => flashLoopStatus('Birds on', '#2ecc71')).catch(() => {
      if (_birds !== a) return;
      stopBirds();
      flashLoopStatus('Birds blocked', '#e74c3c');
    });
  });
  birdsSlider.addEventListener('input', () => {
    if (_birds) _birds.volume = birdsSlider.value / 100;
    try { localStorage.setItem(BIRDS_VOL_KEY, birdsSlider.value); } catch (e) {}
  });
  birdsSlider.addEventListener('keydown', e => e.stopPropagation());

  // ── Activity line (animated spectrum strip) ──────────────────────────────────
  const activityLine = document.getElementById('activity-line');
  let _activityAnim = null;
  function updateActivityLine() {
    const on = !!(_birds || t4Timeout);
    activityLine.style.display = on ? 'block' : 'none';
    if (on && !_activityAnim && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      _activityAnim = activityLine.animate(
        [{ backgroundPosition: '0 0' }, { backgroundPosition: '-200% 0' }],
        { duration: 5000, iterations: Infinity, easing: 'linear' }
      );
    } else if (!on && _activityAnim) {
      _activityAnim.cancel();
      _activityAnim = null;
    }
  }
  setInterval(updateActivityLine, 500);

  // ── Live time clock ───────────────────────────────────────────────────────────
  let _clockInterval = null;
  function fmtTime(sec) {
    if (!isFinite(sec) || sec < 0) return '--:--';
    const h = Math.floor(sec / 3600);
    const m = Math.floor((sec % 3600) / 60);
    const s = Math.floor(sec % 60);
    const mm = h ? String(m).padStart(2, '0') : String(m);
    const ss = String(s).padStart(2, '0');
    return h ? `${h}:${mm}:${ss}` : `${mm}:${ss}`;
  }
  function startTimeClock() {
    if (_clockInterval) clearInterval(_clockInterval);
    const timeEl = document.getElementById('ctrl-time');
    _clockInterval = setInterval(() => {
      if (!ytPlayer || !ytReady) return;
      timeEl.textContent = fmtTime(ytPlayer.getCurrentTime());
    }, 500);
  }

  // ── Playback controls ─────────────────────────────────────────────────────────
  let _playPauseState = 'paused'; // track display state

  function ytSkip(secs) {
    if (!ytPlayer || !ytReady) return;
    const t = (ytPlayer.getCurrentTime() || 0) + secs;
    ytPlayer.seekTo(Math.max(0, t), true);
  }

  function ytTogglePlayPause() {
    if (!ytPlayer || !ytReady) return;
    const state = ytPlayer.getPlayerState();
    // 1 = playing, 2 = paused/stopped, 5 = cued
    if (state === YT.PlayerState.PLAYING) {
      ytPlayer.pauseVideo();
    } else {
      ytPlayer.playVideo();
    }
  }

  function ytChangeVolume(delta) {  // delta: ±10
    if (!ytPlayer || !ytReady) return;
    ytPlayer.setVolume(Math.max(0, Math.min(100, ytPlayer.getVolume() + delta)));
  }

  // Keep play/pause button icon in sync with player state
  window._ytOnStateChange = function (event) {
    const btn = document.getElementById('ctrl-playpause');
    if (!btn) return;
    btn.textContent = (event.data === YT.PlayerState.PLAYING) ? '⏸' : '▶';
  };

  document.getElementById('ctrl-back10').addEventListener('click', () => ytSkip(-10));
  document.getElementById('ctrl-fwd30').addEventListener('click',  () => ytSkip(+30));
  document.getElementById('ctrl-playpause').addEventListener('click', ytTogglePlayPause);
  document.getElementById('ctrl-vol-down').addEventListener('click', () => ytChangeVolume(-10));
  document.getElementById('ctrl-vol-up').addEventListener('click',   () => ytChangeVolume(+10));

  loopBtn.addEventListener('click', toggleT3);
  loopPauseBtn.addEventListener('click', toggleT3Pause);
  // Prevent arrow-key navigation from firing while user edits the timestamp
  loopTsInput.addEventListener('keydown', e => e.stopPropagation());

  loop2Btn.addEventListener('click', toggleT4);
  loop2PauseBtn.addEventListener('click', toggleT4Pause);
  loop2TsInput.addEventListener('keydown', e => e.stopPropagation());

  // ── Sidebar render ────────────────────────────────────────────────────────────
  function renderSidebar(data) {
    allAlbums = [];
    sidebarList.innerHTML = '';
    const genres = Object.keys(data);
    if (!genres.length) {
      sidebarList.innerHTML = '<div style="padding:14px; font-size:12px; color:#555;">No playlists found.</div>';
      return;
    }
    genres.forEach(genre => {
      const albums = data[genre] || [];
      const details = document.createElement('details');
      details.className = 'genre-group';
      details.open = true;
      const summary = document.createElement('summary');
      summary.textContent = toLabel(genre);
      details.appendChild(summary);
      albums.forEach(album => {
        const el = document.createElement('div');
        el.className = 'album-item';
        el.textContent = album.name;
        el.dataset.youtubeId = album.youtubeId || '';
        el.dataset.tracks = JSON.stringify(album.tracks || []);
        el.dataset.name = album.name;
        details.appendChild(el);
        allAlbums.push(el);
      });
      sidebarList.appendChild(details);
    });
  }

  // ── Track list ────────────────────────────────────────────────────────────────
  function renderTrackList(tracks) {
    trackListInner.innerHTML = '';
    if (!tracks || !tracks.length) {
      trackListEmpty.textContent = 'No chapters';
      trackListInner.appendChild(trackListEmpty);
      return;
    }
    tracks.forEach((t, i) => {
      const el = document.createElement('div');
      el.className = 'track-item';
      el.dataset.seconds = Math.floor(t.seconds || 0);
      el.dataset.index = i;
      const timeEl = document.createElement('span');
      timeEl.className = 'track-time';
      timeEl.textContent = t.time || '';
      const titleEl = document.createElement('span');
      titleEl.textContent = t.title || ('Track ' + (i + 1));
      el.appendChild(timeEl);
      el.appendChild(titleEl);
      trackListInner.appendChild(el);
    });
  }

  function setActiveTrack(el) {
    trackListInner.querySelectorAll('.track-item').forEach(t => t.classList.remove('track-active'));
    if (el) el.classList.add('track-active');
  }

  // ── Album selection ───────────────────────────────────────────────────────────
  function selectAlbum(albumEl) {
    if (!albumEl) return;
    allAlbums.forEach(el => el.classList.remove('active'));
    albumEl.classList.add('active');
    albumEl.scrollIntoView({ block: 'nearest' });
    cursorIndex = allAlbums.indexOf(albumEl);
    const youtubeId = albumEl.dataset.youtubeId;
    const name      = albumEl.dataset.name || '';
    let tracks      = JSON.parse(albumEl.dataset.tracks || '[]');
    // Albums without chapters still get one entry (same as the extension popup)
    if (!tracks.length && youtubeId) tracks = [{ time: '0:00', seconds: 0, title: name }];
    console.log('[album] selected', { name, youtubeId, trackCount: tracks.length });
    playerHeader.innerHTML = name ? `<span>${name}</span>` : 'Playlist Player';
    activeYoutubeId = youtubeId;
    if (!youtubeId) {
      console.warn('[album] no youtubeId on this album — showing "no video" state. Check playlists.json for this entry.');
      ytAnchorEl.style.display = 'none';
      showOnly(noVideoMsg);
      renderTrackList([]);
      return;
    }
    ytAnchorEl.href = `https://www.youtube.com/watch?v=${youtubeId}`;
    ytAnchorEl.style.display = '';
    ytLoadVideo(youtubeId, 0);
    showOnly(ytPlayerDiv);
    renderTrackList(tracks);
  }

  // ── Keyboard navigation ───────────────────────────────────────────────────────
  function highlightCursor() {
    allAlbums.forEach((el, i) => {
      el.classList.toggle('cursor', i === cursorIndex);
      if (i === cursorIndex) {
        el.setAttribute('aria-selected', 'true');
        el.scrollIntoView({ block: 'nearest' });
      } else {
        el.removeAttribute('aria-selected');
      }
    });
  }

  document.addEventListener('keydown', e => {
    if (!allAlbums.length) return;
    if (['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName)) return;
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      cursorIndex = Math.min(cursorIndex + 1, allAlbums.length - 1);
      if (cursorIndex < 0) cursorIndex = 0;
      highlightCursor();
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      cursorIndex = Math.max(cursorIndex - 1, 0);
      highlightCursor();
    } else if (e.key === 'Enter' && cursorIndex >= 0) {
      selectAlbum(allAlbums[cursorIndex]);
    }
  });

  // ── Event delegation ──────────────────────────────────────────────────────────
  sidebarList.addEventListener('click', e => {
    const albumEl = e.target.closest('.album-item');
    if (albumEl) selectAlbum(albumEl);
  });

  trackListInner.addEventListener('click', e => {
    const trackEl = e.target.closest('.track-item');
    if (!trackEl || !activeYoutubeId) return;
    const secs = parseInt(trackEl.dataset.seconds) || 0;
    ytSeekTo(secs);
    setActiveTrack(trackEl);
  });

  // ── Dots + Breathe overlay (ported from the neuron-breath extension) ──────────
  let _nbr = null;
  function openNeuronBreath(startMode) {
    if (_nbr) { _nbr.teardown(); _nbr = null; }
    // ---- DOM: shadow root so page CSS can't reach in; styles are set through
    // the CSSOM (el.style.cssText) so a strict page CSP can't block them -------
    const host = document.createElement('div');
    host.id = '__nbr-host';
    host.style.cssText = 'all: initial; position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 2147483647;';
    const root = host.attachShadow({ mode: 'open' });

    function el(tag, css, text) {
      const e = document.createElement(tag);
      if (css) e.style.cssText = css;
      if (text != null) e.textContent = text;
      return e;
    }

    const FONT = 'font-family: system-ui, -apple-system, Segoe UI, sans-serif;';
    const backdrop = el('div', 'position:absolute; inset:0; background:rgba(8,14,24,.55);');
    const panel = el('div',
      'position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);' +
      'width:min(92vw, 900px); height:min(88vh, 660px); display:flex; flex-direction:column;' +
      'border-radius:16px; overflow:hidden; box-shadow:0 12px 48px rgba(0,0,0,.5);' +
      'background:#0b2a36; color:#fff; ' + FONT);

    const BTN = 'padding:7px 14px; border-radius:8px; border:1px solid rgba(255,255,255,.35);' +
      'background:rgba(255,255,255,.12); color:inherit; font:600 13px system-ui, sans-serif; cursor:pointer;';

    const top = el('div', 'flex:none; display:flex; align-items:center; gap:8px; padding:10px 14px;');
    const tabDots = el('button', BTN, 'Dots');
    const tabBreath = el('button', BTN, 'Breathe');
    const closeBtn = el('button', BTN + 'margin-left:auto;', 'Close');
    top.append(tabDots, tabBreath, closeBtn);

    const stage = el('div', 'position:relative; flex:1 1 0; min-height:0;');
    const canvas = el('canvas', 'position:absolute; inset:0; width:100%; height:100%; display:block;');
    stage.appendChild(canvas);

    // bottom bar, dots mode: your estimate -> Check -> true count
    const bar = el('div', 'flex:none; display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:10px 14px;');
    const guess = el('input', 'width:110px; padding:7px 10px; border-radius:8px; border:1px solid rgba(255,255,255,.35);' +
      'background:rgba(0,0,0,.35); color:#fff; font:14px system-ui, sans-serif;');
    guess.type = 'number';
    guess.min = '0';
    guess.placeholder = 'Your count';
    const checkBtn = el('button', BTN, 'Check');
    const newBtn = el('button', BTN, 'New dots');
    const result = el('span', 'font:600 14px system-ui, sans-serif; color:#ffd98a;');
    // stopwatch next to New dots: starts at 0:00 when the Dots tab opens, resets on leaving it
    const dotsClock = el('span', 'font:600 14px system-ui, sans-serif; color:rgba(255,255,255,.8); font-variant-numeric:tabular-nums;', '0:00');
    bar.append(guess, checkBtn, newBtn, dotsClock, result);

    const breathInfo = el('div', 'flex:none; padding:10px 14px; text-align:center; font:13px system-ui, sans-serif; color:rgba(40,40,70,.75);');
    breathInfo.textContent = 'Box breathing: in 4, hold 4, out 4, hold 4';

    panel.append(top, stage, bar, breathInfo);
    root.append(backdrop, panel);
    (document.body || document.documentElement).appendChild(host);

    // keep keystrokes (typing a guess) away from page shortcuts
    ['keydown', 'keyup', 'keypress'].forEach((t) => host.addEventListener(t, (e) => e.stopPropagation()));

    // ---- dot network -----------------------------------------------------
    const RW = 1000, RH = 600; // reference space the network is generated in
    let nodes = [], edges = [];

    function rnd(a, b) { return a + Math.random() * (b - a); }

    function makeNetwork() {
      const n = Math.floor(rnd(18, 61));
      nodes = [];
      let tries = 0;
      while (nodes.length < n && tries++ < 5000) {
        const x = rnd(50, RW - 50), y = rnd(50, RH - 50);
        if (nodes.every((p) => Math.hypot(p.x - x, p.y - y) > 58)) {
          nodes.push({ x, y, ph: rnd(0, 6.28), ph2: rnd(0, 6.28), deg: 0 });
        }
      }
      const seen = new Set();
      function link(a, b) {
        const k = a < b ? a + '-' + b : b + '-' + a;
        if (a === b || seen.has(k)) return;
        seen.add(k);
        edges.push([a, b]);
        nodes[a].deg++; nodes[b].deg++;
      }
      edges = [];
      nodes.forEach((p, i) => {
        nodes.map((q, j) => [j, Math.hypot(p.x - q.x, p.y - q.y)])
          .filter((d) => d[0] !== i).sort((u, v) => u[1] - v[1]).slice(0, 2)
          .forEach((d) => link(i, d[0]));
      });
      for (let k = 0; k < nodes.length * 0.45; k++) {
        const a = Math.floor(Math.random() * nodes.length);
        const b = Math.floor(Math.random() * nodes.length);
        if (Math.hypot(nodes[a].x - nodes[b].x, nodes[a].y - nodes[b].y) < 380) link(a, b);
      }
      result.textContent = '';
      guess.value = '';
    }

    // ---- breathing: in / hold / out / hold, 4 s each ---------------------
    const PHASES = [
      { label: 'Breathe in', grow: 1 },
      { label: 'Hold', grow: 0 },
      { label: 'Breathe out', grow: -1 },
      { label: 'Hold', grow: 0 },
    ];
    const PHASE_S = 4, CYCLE_S = PHASE_S * PHASES.length;
    let breathStart = 0, dotsStart = 0;
    function fmtClock(sec) { const t = Math.floor(sec); return Math.floor(t / 60) + ':' + (t % 60 < 10 ? '0' : '') + (t % 60); }

    let mode = startMode;
    function setMode(m) {
      mode = m;
      bar.style.display = m === 'dots' ? 'flex' : 'none';
      breathInfo.style.display = m === 'breath' ? 'block' : 'none';
      panel.style.background = m === 'dots' ? '#0b2a36' : '#e9e6fb';
      const act = 'background:rgba(255,255,255,.3);';
      tabDots.style.cssText = BTN + (m === 'dots' ? act : '');
      tabBreath.style.cssText = BTN + (m === 'breath' ? act : '');
      if (m === 'breath') breathStart = performance.now();
      else { dotsStart = performance.now(); dotsClock.textContent = '0:00'; }
      // the breath screen is light, so the top buttons need dark text there
      const fg = m === 'dots' ? '#fff' : '#3b3a5c';
      [tabDots, tabBreath, closeBtn].forEach((b) => {
        b.style.color = fg;
        b.style.borderColor = m === 'dots' ? 'rgba(255,255,255,.35)' : 'rgba(59,58,92,.35)';
      });
      if (m === 'breath') closeBtn.style.cssText = BTN + 'margin-left:auto;color:' + fg + ';border-color:rgba(59,58,92,.35);';
      else closeBtn.style.cssText = BTN + 'margin-left:auto;';
    }

    // ---- canvas ------------------------------------------------------------
    const g = canvas.getContext('2d');
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    let W = 1, H = 1, DPR = 1;

    function resize() {
      DPR = window.devicePixelRatio || 1;
      W = Math.max(1, canvas.clientWidth);
      H = Math.max(1, canvas.clientHeight);
      canvas.width = Math.round(W * DPR);
      canvas.height = Math.round(H * DPR);
    }
    window.addEventListener('resize', resize);

    function drawDots(t) {
      const bg = g.createLinearGradient(0, 0, W, H);
      bg.addColorStop(0, '#0f4b5c');
      bg.addColorStop(1, '#06202c');
      g.fillStyle = bg;
      g.fillRect(0, 0, W, H);

      // fit the 1000x600 reference space inside the canvas, centred
      const s = Math.min(W / RW, H / RH);
      const ox = (W - RW * s) / 2, oy = (H - RH * s) / 2;
      const pos = nodes.map((p) => ({
        x: ox + (p.x + (reduced ? 0 : Math.sin(t * 0.4 + p.ph) * 4)) * s,
        y: oy + (p.y + (reduced ? 0 : Math.cos(t * 0.35 + p.ph2) * 4)) * s,
      }));

      g.lineWidth = Math.max(1, s * 1.4);
      g.strokeStyle = 'rgba(210,245,245,.38)';
      g.beginPath();
      edges.forEach((e) => { g.moveTo(pos[e[0]].x, pos[e[0]].y); g.lineTo(pos[e[1]].x, pos[e[1]].y); });
      g.stroke();

      nodes.forEach((p, i) => {
        const tw = reduced ? 1 : 0.7 + 0.3 * Math.sin(t * 1.3 + p.ph);
        const r = (4 + p.deg * 1.1) * s;
        const glow = g.createRadialGradient(pos[i].x, pos[i].y, 0, pos[i].x, pos[i].y, r * 4);
        glow.addColorStop(0, 'rgba(255,214,140,' + (0.9 * tw).toFixed(3) + ')');
        glow.addColorStop(0.35, 'rgba(255,170,70,' + (0.35 * tw).toFixed(3) + ')');
        glow.addColorStop(1, 'rgba(255,170,70,0)');
        g.fillStyle = glow;
        g.beginPath(); g.arc(pos[i].x, pos[i].y, r * 4, 0, 6.2832); g.fill();
        g.fillStyle = 'rgba(255,246,222,' + tw.toFixed(3) + ')';
        g.beginPath(); g.arc(pos[i].x, pos[i].y, r * 0.55, 0, 6.2832); g.fill();
      });
    }

    function ease(x) { return 0.5 - 0.5 * Math.cos(Math.PI * x); }

    function drawBreath(now) {
      const bg = g.createLinearGradient(0, 0, W, H);
      bg.addColorStop(0, '#efe7fb');
      bg.addColorStop(1, '#dcefff');
      g.fillStyle = bg;
      g.fillRect(0, 0, W, H);

      const el_s = (now - breathStart) / 1000;
      const cyc = el_s % CYCLE_S;
      const idx = Math.floor(cyc / PHASE_S);
      const ph = PHASES[idx];
      const f = (cyc - idx * PHASE_S) / PHASE_S; // 0..1 inside this phase

      // circle size: grows on in, stays big on hold, shrinks on out, stays small on hold
      let k;
      if (ph.grow === 1) k = ease(f);
      else if (ph.grow === -1) k = 1 - ease(f);
      else k = idx === 1 ? 1 : 0;

      const cx = W / 2, cy = H / 2;
      const maxR = Math.min(W, H) * 0.34, minR = maxR * 0.62;
      const r = minR + (maxR - minR) * k;

      // progress ring over the whole 16 s cycle, light blue -> yellow
      const ringR = maxR * 1.2;
      g.lineWidth = Math.max(8, maxR * 0.1);
      g.lineCap = 'round';
      g.strokeStyle = 'rgba(160,190,235,.18)';
      g.beginPath(); g.arc(cx, cy, ringR, 0, 6.2832); g.stroke();
      let stroke = '#bfe3f8';
      if (g.createConicGradient) {
        const cg = g.createConicGradient(-Math.PI / 2, cx, cy);
        cg.addColorStop(0, '#bfe3f8');
        cg.addColorStop(0.5, '#e4e8b8');
        cg.addColorStop(1, '#fbe5a6');
        stroke = cg;
      }
      g.strokeStyle = stroke;
      g.beginPath();
      g.arc(cx, cy, ringR, -Math.PI / 2, -Math.PI / 2 + 6.2832 * (cyc / CYCLE_S));
      g.stroke();

      // soft white circle
      g.save();
      g.shadowColor = 'rgba(255,255,255,.95)';
      g.shadowBlur = r * 0.25;
      g.fillStyle = '#fff';
      g.beginPath(); g.arc(cx, cy, r, 0, 6.2832); g.fill();
      g.restore();

      // calm face: closed eyes and a small smile, near the top of the circle
      g.strokeStyle = '#6b6a8a';
      g.lineWidth = Math.max(3, r * 0.035);
      g.lineCap = 'round';
      const fy = cy - r * 0.45, ew = r * 0.1;
      [-1, 1].forEach((side) => {
        g.beginPath();
        g.arc(cx + side * r * 0.2, fy, ew, 0.15 * Math.PI, 0.85 * Math.PI);
        g.stroke();
      });
      g.beginPath();
      g.arc(cx, fy + r * 0.07, r * 0.13, 0.15 * Math.PI, 0.85 * Math.PI);
      g.stroke();

      // stopwatch since this Breathe session started (resets on tab switch / close)
      g.fillStyle = '#6b6a8a';
      g.textAlign = 'center';
      g.textBaseline = 'middle';
      g.font = '600 ' + Math.max(16, Math.round(maxR * 0.14)) + 'px system-ui, sans-serif';
      g.fillText(fmtClock(el_s), cx, Math.max(22, cy - ringR - maxR * 0.16));

      // phase label and seconds left
      g.fillStyle = '#5b5a80';
      g.textAlign = 'center';
      g.textBaseline = 'middle';
      g.font = '600 ' + Math.round(r * 0.17) + 'px system-ui, sans-serif';
      g.fillText(ph.label, cx, cy + r * 0.1);
      g.font = '300 ' + Math.round(r * 0.42) + 'px system-ui, sans-serif';
      g.fillText(String(Math.ceil(PHASE_S - f * PHASE_S)), cx, cy + r * 0.48);
    }

    let raf = 0;
    function frame(now) {
      raf = requestAnimationFrame(frame);
      g.setTransform(DPR, 0, 0, DPR, 0, 0);
      if (mode === 'dots') { drawDots(now / 1000); dotsClock.textContent = fmtClock((now - dotsStart) / 1000); }
      else drawBreath(now);
    }

    // ---- wiring -----------------------------------------------------------
    tabDots.addEventListener('click', () => setMode('dots'));
    tabBreath.addEventListener('click', () => setMode('breath'));
    newBtn.addEventListener('click', makeNetwork);

    function check() {
      const n = nodes.length;
      const v = parseInt(guess.value, 10);
      if (isNaN(v)) { result.textContent = 'There are ' + n + ' dots'; return; }
      const d = v - n;
      result.textContent = 'There are ' + n + ' dots' +
        (d === 0 ? ' - exact!' : ' - you were ' + Math.abs(d) + (d > 0 ? ' over' : ' under') +
          ' (' + Math.round(Math.abs(d) / n * 100) + '%)');
    }
    checkBtn.addEventListener('click', check);
    guess.addEventListener('keydown', (e) => { if (e.key === 'Enter') check(); });

    function close() { teardown(); _nbr = null; }
    closeBtn.addEventListener('click', close);
    backdrop.addEventListener('click', close);
    function onEsc(e) { if (e.key === 'Escape') close(); }
    window.addEventListener('keydown', onEsc, true);

    makeNetwork();
    setMode(startMode);
    resize();
    raf = requestAnimationFrame(frame);

    function teardown() {
      cancelAnimationFrame(raf);
      window.removeEventListener('resize', resize);
      window.removeEventListener('keydown', onEsc, true);
      host.remove();
    }
    _nbr = { teardown };


  }

  document.getElementById('dots-btn').addEventListener('click', () => openNeuronBreath('dots'));
  document.getElementById('breathe-btn').addEventListener('click', () => openNeuronBreath('breath'));

  // ── Load playlists ────────────────────────────────────────────────────────────
  async function loadPlaylists() {
    sidebarList.innerHTML = '<div style="padding:20px 14px; font-size:12px; color:#555;">Loading…</div>';
    try {
      const res = await fetch('/api/playlists');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      playlists = data;
      renderSidebar(data);
    } catch (err) {
      sidebarList.innerHTML = '<div style="padding:14px; font-size:12px; color:#e57373;">Error loading playlists</div>';
      errText.textContent = 'Failed to load playlists — check YOUTUBE_PLAYLISTS_URL env var. (' + err.message + ')';
      showOnly(errorState);
    }
  }

  retryBtn.addEventListener('click', loadPlaylists);
  loadPlaylists();
</script>
</body>
