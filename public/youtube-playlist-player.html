<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playlist Player</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      overflow: hidden;
    }

    /* ── Layout ─────────────────────────────────────────── */
    #app {
      display: grid;
      grid-template-columns: 260px 1fr 220px;
      height: 100vh;
    }

    /* ── Sidebar ─────────────────────────────────────────── */
    #sidebar {
      background: #12122a;
      border-right: 1px solid rgba(201, 168, 76, 0.15);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    #sidebar-header {
      padding: 14px 14px 10px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .08em;
      color: #c9a84c;
      text-transform: uppercase;
      border-bottom: 1px solid rgba(201, 168, 76, 0.15);
      flex-shrink: 0;
    }

    #sidebar-list {
      flex: 1;
      overflow-y: auto;
      padding: 6px 0 20px;
    }

    /* genre group */
    details.genre-group {
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }

    details.genre-group summary {
      list-style: none;
      padding: 8px 14px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: #81C784;
      cursor: pointer;
      user-select: none;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    details.genre-group summary::-webkit-details-marker { display: none; }

    details.genre-group summary::before {
      content: '▶';
      font-size: 8px;
      transition: transform .15s;
      color: #555;
    }

    details.genre-group[open] summary::before {
      transform: rotate(90deg);
    }

    /* album item */
    .album-item {
      padding: 6px 14px 6px 26px;
      font-size: 12px;
      color: #aaa;
      cursor: pointer;
      line-height: 1.4;
      border-left: 2px solid transparent;
      transition: background .1s, color .1s;
    }

    .album-item:hover {
      background: rgba(255,255,255,0.05);
      color: #e0e0e0;
    }

    .album-item.active {
      color: #c9a84c;
      background: rgba(201, 168, 76, 0.08);
      border-left-color: #c9a84c;
    }

    /* keyboard cursor — distinct from active */
    .album-item.cursor:not(.active) {
      background: rgba(129, 199, 132, 0.08);
      border-left-color: #81C784;
      color: #e0e0e0;
    }

    /* ── Player column ───────────────────────────────────── */
    #player-col {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #player-header {
      padding: 10px 16px;
      font-size: 12px;
      color: #888;
      background: #16213e;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex-shrink: 0;
    }

    #player-header span { color: #c9a84c; font-weight: 600; }

    #iframe-wrap {
      position: relative;
      flex: 1;
      background: #0d0d1a;
      min-height: 0;
    }

    #yt-frame {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    #empty-state {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: #444;
    }

    #empty-state .icon { font-size: 48px; }
    #empty-state .hint { font-size: 13px; }

    #error-state {
      display: none;
      position: absolute;
      inset: 0;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 10px;
      color: #e57373;
    }

    #error-state .err-msg { font-size: 13px; max-width: 340px; text-align: center; line-height: 1.5; }

    #retry-btn {
      padding: 7px 18px;
      background: #c9a84c;
      color: #1a1a2e;
      border: none;
      border-radius: 5px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    #no-video-msg {
      display: none;
      position: absolute;
      inset: 0;
      align-items: center;
      justify-content: center;
      color: #666;
      font-size: 13px;
    }

    /* ── Track list (right pane) ─────────────────────────── */
    #track-list {
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      background: #12122a;
      border-left: 1px solid rgba(201, 168, 76, 0.15);
    }

    #track-list-header {
      padding: 14px 14px 10px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .08em;
      color: #c9a84c;
      text-transform: uppercase;
      border-bottom: 1px solid rgba(201, 168, 76, 0.15);
      flex-shrink: 0;
    }

    #track-list-inner {
      flex: 1;
      overflow-y: auto;
      padding: 6px 0 20px;
    }

    #track-list-empty {
      padding: 20px 14px;
      font-size: 12px;
      color: #444;
    }

    .track-item {
      padding: 6px 14px 6px 14px;
      font-size: 11px;
      color: #aaa;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 2px;
      border-left: 2px solid transparent;
      transition: background .1s, color .1s;
    }

    .track-item:hover { background: rgba(255,255,255,0.05); color: #e0e0e0; }

    .track-item.track-active {
      color: #c9a84c;
      background: rgba(201, 168, 76, 0.08);
      border-left-color: #c9a84c;
    }

    .track-time {
      font-family: 'Courier New', monospace;
      font-size: 10px;
      color: #555;
    }

    .track-item.track-active .track-time { color: #a07e30; }
  </style>
</head>
<body>

<div id="app">

  <!-- Sidebar -->
  <div id="sidebar">
    <div id="sidebar-header">Playlists</div>
    <div id="sidebar-list">
      <div style="padding:20px 14px; font-size:12px; color:#555;">Loading playlists…</div>
    </div>
  </div>

  <!-- Player column -->
  <div id="player-col">
    <div id="player-header">Select a playlist to begin</div>

    <div id="iframe-wrap">
      <div id="empty-state">
        <div class="icon">▶</div>
        <div class="hint">Click an album in the sidebar</div>
      </div>
      <div id="error-state">
        <div class="err-msg" id="err-text">Failed to load playlists.</div>
        <button id="retry-btn">Retry</button>
      </div>
      <div id="no-video-msg">No video available for this album</div>
      <iframe
        id="yt-frame"
        src=""
        allow="autoplay; encrypted-media; picture-in-picture"
        allowfullscreen
        style="display:none;"
      ></iframe>
    </div>
  </div>

  <!-- Track list (right pane) -->
  <div id="track-list">
    <div id="track-list-header">Tracks</div>
    <div id="track-list-inner">
      <div id="track-list-empty">Select an album</div>
    </div>
  </div>

</div>

<script>
  // ── State ────────────────────────────────────────────────────────────────────
  let playlists = null;
  let allAlbums = [];       // flat ordered list of .album-item DOM elements
  let cursorIndex = -1;     // keyboard cursor position in allAlbums
  let activeYoutubeId = ''; // currently loaded video ID

  // ── DOM refs ─────────────────────────────────────────────────────────────────
  const sidebarList  = document.getElementById('sidebar-list');
  const playerHeader = document.getElementById('player-header');
  const iframeWrap   = document.getElementById('iframe-wrap');
  const ytFrame      = document.getElementById('yt-frame');
  const emptyState   = document.getElementById('empty-state');
  const errorState   = document.getElementById('error-state');
  const errText      = document.getElementById('err-text');
  const noVideoMsg   = document.getElementById('no-video-msg');
  const trackListInner = document.getElementById('track-list-inner');
  const trackListEmpty = document.getElementById('track-list-empty');
  const retryBtn       = document.getElementById('retry-btn');

  // ── Helpers ──────────────────────────────────────────────────────────────────
  function toLabel(key) {
    return key.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
  }

  function showOnly(el) {
    [emptyState, errorState, noVideoMsg, ytFrame].forEach(e => {
      e.style.display = 'none';
    });
    el.style.display = 'flex';
  }

  // ── Sidebar render ────────────────────────────────────────────────────────────
  function renderSidebar(data) {
    allAlbums = [];
    sidebarList.innerHTML = '';

    const genres = Object.keys(data);
    if (!genres.length) {
      sidebarList.innerHTML = '<div style="padding:14px; font-size:12px; color:#555;">No playlists found.</div>';
      return;
    }

    genres.forEach(genre => {
      const albums = data[genre] || [];
      const details = document.createElement('details');
      details.className = 'genre-group';
      details.open = true;

      const summary = document.createElement('summary');
      summary.textContent = toLabel(genre);
      details.appendChild(summary);

      albums.forEach(album => {
        const el = document.createElement('div');
        el.className = 'album-item';
        el.textContent = album.name;
        el.dataset.youtubeId = album.youtubeId || '';
        el.dataset.tracks = JSON.stringify(album.tracks || []);
        el.dataset.name = album.name;
        details.appendChild(el);
        allAlbums.push(el);
      });

      sidebarList.appendChild(details);
    });
  }

  // ── Track list ────────────────────────────────────────────────────────────────
  function renderTrackList(album, tracks) {
    trackListInner.innerHTML = '';
    if (!tracks || !tracks.length) {
      trackListEmpty.textContent = 'No chapters';
      trackListInner.appendChild(trackListEmpty);
      return;
    }

    tracks.forEach((t, i) => {
      const el = document.createElement('div');
      el.className = 'track-item';
      el.dataset.seconds = Math.floor(t.seconds || 0);
      el.dataset.index = i;

      const timeEl = document.createElement('span');
      timeEl.className = 'track-time';
      timeEl.textContent = t.time || '';

      const titleEl = document.createElement('span');
      titleEl.textContent = t.title || ('Track ' + (i + 1));

      el.appendChild(timeEl);
      el.appendChild(titleEl);
      trackListInner.appendChild(el);
    });
  }

  function setActiveTrack(el) {
    trackListInner.querySelectorAll('.track-item').forEach(t => t.classList.remove('track-active'));
    if (el) el.classList.add('track-active');
  }

  // ── Album selection ───────────────────────────────────────────────────────────
  function selectAlbum(albumEl) {
    if (!albumEl) return;

    // Update active class
    allAlbums.forEach(el => el.classList.remove('active'));
    albumEl.classList.add('active');
    albumEl.scrollIntoView({ block: 'nearest' });

    // Sync cursor
    cursorIndex = allAlbums.indexOf(albumEl);

    const youtubeId = albumEl.dataset.youtubeId;
    const name = albumEl.dataset.name || '';
    const tracks = JSON.parse(albumEl.dataset.tracks || '[]');

    playerHeader.innerHTML = name ? `<span>${name}</span>` : 'Playlist Player';
    activeYoutubeId = youtubeId;

    if (!youtubeId) {
      showOnly(noVideoMsg);
      renderTrackList(null, []);
      return;
    }

    ytFrame.src = `https://www.youtube.com/embed/${youtubeId}?autoplay=1`;
    showOnly(ytFrame);
    renderTrackList(albumEl.dataset.name, tracks);
  }

  // ── Keyboard navigation ───────────────────────────────────────────────────────
  function highlightCursor() {
    allAlbums.forEach((el, i) => {
      el.classList.toggle('cursor', i === cursorIndex);
      if (i === cursorIndex) {
        el.setAttribute('aria-selected', 'true');
        el.scrollIntoView({ block: 'nearest' });
      } else {
        el.removeAttribute('aria-selected');
      }
    });
  }

  document.addEventListener('keydown', e => {
    if (!allAlbums.length) return;

    if (e.key === 'ArrowDown') {
      e.preventDefault();
      cursorIndex = Math.min(cursorIndex + 1, allAlbums.length - 1);
      if (cursorIndex < 0) cursorIndex = 0;
      highlightCursor();
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      cursorIndex = Math.max(cursorIndex - 1, 0);
      highlightCursor();
    } else if (e.key === 'Enter' && cursorIndex >= 0) {
      selectAlbum(allAlbums[cursorIndex]);
    }
  });

  // ── Event delegation ──────────────────────────────────────────────────────────
  sidebarList.addEventListener('click', e => {
    const albumEl = e.target.closest('.album-item');
    if (albumEl) selectAlbum(albumEl);
  });

  trackListInner.addEventListener('click', e => {
    const trackEl = e.target.closest('.track-item');
    if (!trackEl || !activeYoutubeId) return;
    const secs = parseInt(trackEl.dataset.seconds) || 0;
    ytFrame.src = `https://www.youtube.com/embed/${activeYoutubeId}?start=${secs}&autoplay=1`;
    setActiveTrack(trackEl);
  });

  // ── Load playlists ────────────────────────────────────────────────────────────
  async function loadPlaylists() {
    sidebarList.innerHTML = '<div style="padding:20px 14px; font-size:12px; color:#555;">Loading…</div>';
    try {
      const res = await fetch('/api/playlists');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      playlists = data;
      renderSidebar(data);
    } catch (err) {
      sidebarList.innerHTML = '<div style="padding:14px; font-size:12px; color:#e57373;">Error loading playlists</div>';
      errText.textContent = 'Failed to load playlists — check YOUTUBE_PLAYLISTS_URL env var. (' + err.message + ')';
      showOnly(errorState);
    }
  }

  retryBtn.addEventListener('click', loadPlaylists);

  loadPlaylists();
</script>
</body>
</html>
