<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playlist Player</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      overflow: hidden;
    }

    /* ── Layout ─────────────────────────────────────────── */
    #app {
      display: grid;
      grid-template-columns: 260px 1fr 220px;
      height: 100vh;
    }

    /* ── Panel toggle buttons ────────────────────────────── */
    .panel-toggle {
      background: none;
      border: none;
      color: #666;
      cursor: pointer;
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 3px;
      flex-shrink: 0;
      line-height: 1;
      transition: color .15s, background .15s;
    }
    .panel-toggle:hover { color: #c9a84c; background: rgba(255,255,255,0.07); }

    /* ── Sidebar ─────────────────────────────────────────── */
    #sidebar {
      background: #12122a;
      border-right: 1px solid rgba(201, 168, 76, 0.15);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: min-width .2s, max-width .2s;
      min-width: 260px;
      max-width: 260px;
    }

    #sidebar-header {
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .08em;
      color: #c9a84c;
      text-transform: uppercase;
      border-bottom: 1px solid rgba(201, 168, 76, 0.15);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
    }

    #sidebar-list {
      flex: 1;
      overflow-y: auto;
      padding: 6px 0 20px;
    }

    /* Desktop collapsed state */
    #sidebar.collapsed {
      min-width: 36px;
      max-width: 36px;
    }
    #sidebar.collapsed #sidebar-list { display: none; }
    #sidebar.collapsed #sidebar-header-title { display: none; }
    #sidebar.collapsed #sidebar-header { justify-content: center; padding: 10px 4px; }

    /* genre group */
    details.genre-group {
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }
    details.genre-group summary {
      list-style: none;
      padding: 8px 14px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: #81C784;
      cursor: pointer;
      user-select: none;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    details.genre-group summary::-webkit-details-marker { display: none; }
    details.genre-group summary::before {
      content: '▶';
      font-size: 8px;
      transition: transform .15s;
      color: #555;
    }
    details.genre-group[open] summary::before { transform: rotate(90deg); }

    /* album item */
    .album-item {
      padding: 6px 14px 6px 26px;
      font-size: 12px;
      color: #aaa;
      cursor: pointer;
      line-height: 1.4;
      border-left: 2px solid transparent;
      transition: background .1s, color .1s;
    }
    .album-item:hover { background: rgba(255,255,255,0.05); color: #e0e0e0; }
    .album-item.active {
      color: #c9a84c;
      background: rgba(201, 168, 76, 0.08);
      border-left-color: #c9a84c;
    }
    .album-item.cursor:not(.active) {
      background: rgba(129, 199, 132, 0.08);
      border-left-color: #81C784;
      color: #e0e0e0;
    }

    /* ── Player column ───────────────────────────────────── */
    #player-col {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 0;
    }

    #player-header {
      padding: 10px 16px;
      font-size: 12px;
      color: #888;
      background: #16213e;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex-shrink: 0;
    }
    #player-header span { color: #c9a84c; font-weight: 600; }

    #iframe-wrap {
      position: relative;
      flex: 1;
      background: #0d0d1a;
      min-height: 0;
    }

    /* YT IFrame API container */
    #yt-player {
      position: absolute;
      inset: 0;
      display: none;
    }
    #yt-player > iframe {
      width: 100% !important;
      height: 100% !important;
      border: none;
    }

    #empty-state {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: #444;
    }
    #empty-state .icon { font-size: 48px; }
    #empty-state .hint { font-size: 13px; }

    #error-state {
      display: none;
      position: absolute;
      inset: 0;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 10px;
      color: #e57373;
    }
    #error-state .err-msg { font-size: 13px; max-width: 340px; text-align: center; line-height: 1.5; }

    #retry-btn {
      padding: 7px 18px;
      background: #c9a84c;
      color: #1a1a2e;
      border: none;
      border-radius: 5px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    #no-video-msg {
      display: none;
      position: absolute;
      inset: 0;
      align-items: center;
      justify-content: center;
      color: #666;
      font-size: 13px;
    }

    /* ── Loop controls ───────────────────────────────────── */
    #loop-controls {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      background: #0d0d1a;
      border-top: 1px solid rgba(255,255,255,0.06);
      flex-wrap: wrap;
      min-height: 38px;
    }

    #loop-ts-input {
      width: 72px;
      padding: 3px 5px;
      border: 1px solid #555;
      border-radius: 5px;
      background: #1a1a1a;
      color: #ddd;
      font-size: 11px;
      font-family: 'Courier New', monospace;
      outline: none;
    }
    #loop-ts-input:focus { border-color: #c9a84c; }

    #loop-btn {
      padding: 5px 12px;
      border: none;
      border-radius: 5px;
      background: linear-gradient(45deg, #ff9800, #f57c00);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    #loop-pause-btn {
      padding: 5px 10px;
      border: none;
      border-radius: 5px;
      background: #546e7a;
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: none;
    }

    #loop-status {
      font-size: 11px;
      color: #888;
      white-space: nowrap;
      margin-left: 2px;
    }

    /* ── Track list (right pane) ─────────────────────────── */
    #track-list {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #12122a;
      border-left: 1px solid rgba(201, 168, 76, 0.15);
      transition: min-width .2s, max-width .2s;
      min-width: 220px;
      max-width: 220px;
    }

    #track-list-header {
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .08em;
      color: #c9a84c;
      text-transform: uppercase;
      border-bottom: 1px solid rgba(201, 168, 76, 0.15);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    #track-list-header-title { flex: 1; }

    #track-list-inner {
      flex: 1;
      overflow-y: auto;
      padding: 6px 0 20px;
    }
    #track-list-empty { padding: 20px 14px; font-size: 12px; color: #444; }

    /* Desktop collapsed state */
    #track-list.collapsed {
      min-width: 36px;
      max-width: 36px;
    }
    #track-list.collapsed #track-list-inner { display: none; }
    #track-list.collapsed #track-list-header-title { display: none; }
    #track-list.collapsed #track-list-header { justify-content: center; padding: 10px 4px; }

    .track-item {
      padding: 6px 14px;
      font-size: 11px;
      color: #aaa;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 2px;
      border-left: 2px solid transparent;
      transition: background .1s, color .1s;
    }
    .track-item:hover { background: rgba(255,255,255,0.05); color: #e0e0e0; }
    .track-item.track-active {
      color: #c9a84c;
      background: rgba(201, 168, 76, 0.08);
      border-left-color: #c9a84c;
    }
    .track-time { font-family: 'Courier New', monospace; font-size: 10px; color: #555; }
    .track-item.track-active .track-time { color: #a07e30; }

    /* ── Mobile layout (≤768px) ──────────────────────────── */
    @media (max-width: 768px) {
      html, body { overflow-y: auto; height: auto; overflow-x: hidden; }

      #app {
        display: flex !important;
        flex-direction: column;
        height: auto;
        min-height: 100vh;
      }

      #player-col { order: 1; overflow: visible; flex-shrink: 0; }

      #iframe-wrap {
        position: relative;
        flex: none;
        height: 56.25vw; /* 16:9 */
        min-height: 200px;
      }

      #loop-controls { flex-wrap: wrap; }

      #sidebar {
        order: 2;
        min-width: 0 !important;
        max-width: none !important;
        width: 100%;
        border-right: none;
        border-top: 1px solid rgba(201, 168, 76, 0.15);
        transition: none;
      }
      /* On mobile, collapsed = just hide the list; header stays for tapping */
      #sidebar.collapsed #sidebar-header-title { display: inline !important; }
      #sidebar.collapsed #sidebar-header { justify-content: space-between !important; padding: 10px 14px !important; }
      #sidebar-list { max-height: 50vh; }

      #track-list {
        order: 3;
        min-width: 0 !important;
        max-width: none !important;
        width: 100%;
        border-left: none;
        border-top: 1px solid rgba(201, 168, 76, 0.15);
        transition: none;
      }
      #track-list.collapsed #track-list-header-title { display: inline !important; }
      #track-list.collapsed #track-list-header { justify-content: space-between !important; padding: 10px 14px !important; }
      #track-list-inner { max-height: 50vh; }
    }
  </style>
</head>
<body>

<div id="app">

  <!-- Sidebar -->
  <div id="sidebar">
    <div id="sidebar-header">
      <span id="sidebar-header-title">Playlists</span>
      <button id="sidebar-toggle" class="panel-toggle" title="Collapse playlists">◀</button>
    </div>
    <div id="sidebar-list">
      <div style="padding:20px 14px; font-size:12px; color:#555;">Loading playlists…</div>
    </div>
  </div>

  <!-- Player column -->
  <div id="player-col">
    <div id="player-header">Select a playlist to begin</div>

    <div id="iframe-wrap">
      <div id="empty-state">
        <div class="icon">▶</div>
        <div class="hint">Click an album in the sidebar</div>
      </div>
      <div id="error-state">
        <div class="err-msg" id="err-text">Failed to load playlists.</div>
        <button id="retry-btn">Retry</button>
      </div>
      <div id="no-video-msg">No video available for this album</div>
      <!-- YouTube IFrame API renders into this div -->
      <div id="yt-player"></div>
    </div>

    <!-- Loop controls (30s × 40) -->
    <div id="loop-controls">
      <input id="loop-ts-input" type="text" value="00:00:00" placeholder="00:00:00"
             title="Loop back to this timestamp (HH:MM:SS)" spellcheck="false">
      <button id="loop-btn" title="Play 30s, rewind, repeat x40">⏱️ 30s</button>
      <button id="loop-pause-btn" title="Pause loop">⏸</button>
      <span id="loop-status"></span>
    </div>
  </div>

  <!-- Track list (right pane) -->
  <div id="track-list">
    <div id="track-list-header">
      <button id="tracks-toggle" class="panel-toggle" title="Collapse tracks">▶</button>
      <span id="track-list-header-title">Tracks</span>
    </div>
    <div id="track-list-inner">
      <div id="track-list-empty">Select an album</div>
    </div>
  </div>

</div>

<script>
  // ── State ────────────────────────────────────────────────────────────────────
  let playlists    = null;
  let allAlbums    = [];
  let cursorIndex  = -1;
  let activeYoutubeId = '';
  let pendingVideo = null; // queued while YT API is still loading

  // ── DOM refs ─────────────────────────────────────────────────────────────────
  const appEl          = document.getElementById('app');
  const sidebar        = document.getElementById('sidebar');
  const sidebarList    = document.getElementById('sidebar-list');
  const playerHeader   = document.getElementById('player-header');
  const emptyState     = document.getElementById('empty-state');
  const errorState     = document.getElementById('error-state');
  const errText        = document.getElementById('err-text');
  const noVideoMsg     = document.getElementById('no-video-msg');
  const ytPlayerDiv    = document.getElementById('yt-player');
  const trackListEl    = document.getElementById('track-list');
  const trackListInner = document.getElementById('track-list-inner');
  const trackListEmpty = document.getElementById('track-list-empty');
  const retryBtn       = document.getElementById('retry-btn');
  const sidebarToggle  = document.getElementById('sidebar-toggle');
  const tracksToggle   = document.getElementById('tracks-toggle');
  const loopTsInput    = document.getElementById('loop-ts-input');
  const loopBtn        = document.getElementById('loop-btn');
  const loopPauseBtn   = document.getElementById('loop-pause-btn');
  const loopStatusEl   = document.getElementById('loop-status');

  // ── YouTube IFrame Player API ─────────────────────────────────────────────────
  let ytPlayer = null;
  let ytReady  = false;

  window.onYouTubeIframeAPIReady = function () {
    ytPlayer = new YT.Player('yt-player', {
      width: '100%',
      height: '100%',
      playerVars: { rel: 0, modestbranding: 1 },
      events: {
        onReady: function () {
          ytReady = true;
          if (pendingVideo) {
            ytPlayer.loadVideoById(pendingVideo);
            ytPlayerDiv.style.display = '';
            pendingVideo = null;
          }
        },
        onError: function (e) { console.warn('YT player error:', e.data); }
      }
    });
  };

  // Inject YT IFrame API script
  (function () {
    const tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(tag);
  })();

  // YT player helpers
  function ytLoadVideo(videoId, startSeconds) {
    const params = { videoId, startSeconds: startSeconds || 0 };
    if (!ytPlayer || !ytReady) {
      pendingVideo = params;
      return;
    }
    pendingVideo = null;
    ytPlayer.loadVideoById(params);
    ytPlayerDiv.style.display = '';
  }

  function ytSeekTo(secs) {
    if (!ytPlayer || !ytReady) return;
    ytPlayer.seekTo(secs, true);
    ytPlayer.playVideo();
  }

  function ytGetCurrentTime() {
    if (!ytPlayer || !ytReady) return 0;
    return ytPlayer.getCurrentTime() || 0;
  }

  function ytGetVolume() {   // returns 0–100
    if (!ytPlayer || !ytReady) return 100;
    return ytPlayer.getVolume();
  }

  function ytSetVolume(v) {  // v: 0–100
    if (!ytPlayer || !ytReady) return;
    ytPlayer.setVolume(Math.max(0, Math.min(100, Math.round(v))));
  }

  // ── Helpers ──────────────────────────────────────────────────────────────────
  function toLabel(key) {
    return key.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
  }

  function showOnly(el) {
    emptyState.style.display   = 'none';
    errorState.style.display   = 'none';
    noVideoMsg.style.display   = 'none';
    ytPlayerDiv.style.display  = 'none';
    // ytPlayerDiv is absolutely positioned — just unhide it; others need flex
    el.style.display = (el === ytPlayerDiv) ? '' : 'flex';
  }

  function secsToHMS(s) {
    s = Math.max(0, Math.floor(s));
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    const sec = s % 60;
    return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0') + ':' + String(sec).padStart(2, '0');
  }

  function parseHMS(ts) {
    const parts = String(ts).split(':').map(Number);
    return (parts[0] || 0) * 3600 + (parts[1] || 0) * 60 + (parts[2] || 0);
  }

  // ── Panel collapse (desktop & mobile) ─────────────────────────────────────────
  function isMobile() { return window.innerWidth <= 768; }

  function updateDesktopGrid() {
    if (isMobile()) return;
    const leftW  = sidebar.classList.contains('collapsed')   ? '36px' : '260px';
    const rightW = trackListEl.classList.contains('collapsed') ? '36px' : '220px';
    appEl.style.gridTemplateColumns = `${leftW} 1fr ${rightW}`;
  }

  sidebarToggle.addEventListener('click', (e) => {
    e.stopPropagation();
    sidebar.classList.toggle('collapsed');
    const collapsed = sidebar.classList.contains('collapsed');
    sidebarToggle.textContent = collapsed ? (isMobile() ? '▼' : '▶') : (isMobile() ? '▲' : '◀');
    sidebarToggle.title = collapsed ? 'Expand playlists' : 'Collapse playlists';
    if (!isMobile()) updateDesktopGrid();
  });

  tracksToggle.addEventListener('click', (e) => {
    e.stopPropagation();
    trackListEl.classList.toggle('collapsed');
    const collapsed = trackListEl.classList.contains('collapsed');
    tracksToggle.textContent = collapsed ? (isMobile() ? '▼' : '◀') : (isMobile() ? '▲' : '▶');
    tracksToggle.title = collapsed ? 'Expand tracks' : 'Collapse tracks';
    if (!isMobile()) updateDesktopGrid();
  });

  // Tap whole header on mobile to toggle accordion
  document.getElementById('sidebar-header').addEventListener('click', (e) => {
    if (!isMobile() || e.target === sidebarToggle) return;
    sidebarToggle.click();
  });
  document.getElementById('track-list-header').addEventListener('click', (e) => {
    if (!isMobile() || e.target === tracksToggle) return;
    tracksToggle.click();
  });

  window.addEventListener('resize', updateDesktopGrid);

  // Collapse panels on mobile at startup
  if (isMobile()) {
    sidebar.classList.add('collapsed');
    trackListEl.classList.add('collapsed');
    sidebarToggle.textContent = '▼';
    tracksToggle.textContent  = '▼';
  }

  // ── Loop engine (30s × 40, ported from yt-controls) ──────────────────────────
  const T3_DURATION_MS = 30000;
  const T3_TOTAL_LOOPS = 40;
  const T3_FADE_MS     = 2000;

  let t3Timeout        = null;
  let t3LoopsRemaining = 0;
  let t3SavedVolume    = 100;  // 0–100
  let t3Generation     = 0;
  let t3Paused         = false;
  let _loopStatusTimer = null;

  function flashLoopStatus(msg, color) {
    loopStatusEl.textContent = msg;
    loopStatusEl.style.color = color;
    if (_loopStatusTimer) clearTimeout(_loopStatusTimer);
    _loopStatusTimer = setTimeout(() => { loopStatusEl.textContent = ''; }, 2500);
  }

  function setLoopStatus(msg, color) {
    if (_loopStatusTimer) { clearTimeout(_loopStatusTimer); _loopStatusTimer = null; }
    loopStatusEl.textContent = msg;
    loopStatusEl.style.color = color;
  }

  function fadeVolTo(target0to100, durationMs, gen) {
    return new Promise(resolve => {
      const startVol = ytGetVolume();
      const steps = 20;
      let i = 0;
      const iv = setInterval(() => {
        if (gen !== t3Generation) { clearInterval(iv); resolve(); return; }
        i++;
        ytSetVolume(startVol + (target0to100 - startVol) * (i / steps));
        if (i >= steps) { clearInterval(iv); resolve(); }
      }, durationMs / steps);
    });
  }

  function runT3Loop(gen) {
    const currentLoop = T3_TOTAL_LOOPS - t3LoopsRemaining + 1;
    loopBtn.textContent = `⏹️ ${currentLoop}/${T3_TOTAL_LOOPS}`;
    setLoopStatus(`loop ${currentLoop}/${T3_TOTAL_LOOPS}`, '#ff9800');

    t3Timeout = setTimeout(async () => {
      if (gen !== t3Generation) return;
      await fadeVolTo(0, T3_FADE_MS, gen);
      if (gen !== t3Generation) return;
      t3LoopsRemaining--;
      ytSeekTo(parseHMS(loopTsInput.value));
      if (t3LoopsRemaining > 0) {
        await fadeVolTo(t3SavedVolume, 1000, gen);
        if (gen !== t3Generation) return;
        runT3Loop(gen);
      } else {
        t3Timeout = null;
        ytSetVolume(t3SavedVolume);
        loopBtn.textContent        = '⏱️ 30s';
        loopBtn.style.background   = 'linear-gradient(45deg,#ff9800,#f57c00)';
        loopPauseBtn.style.display = 'none';
        loopPauseBtn.textContent   = '⏸';
        t3Paused = false;
        flashLoopStatus(`Done ✓ (${T3_TOTAL_LOOPS}/${T3_TOTAL_LOOPS})`, '#2ecc71');
      }
    }, T3_DURATION_MS - T3_FADE_MS);
  }

  function cancelT3() {
    t3Generation++;
    if (t3Timeout) { clearTimeout(t3Timeout); t3Timeout = null; }
    t3Paused = false;
    ytSetVolume(t3SavedVolume);
    loopBtn.textContent          = '⏱️ 30s';
    loopBtn.style.background     = 'linear-gradient(45deg,#ff9800,#f57c00)';
    loopPauseBtn.style.display   = 'none';
    loopPauseBtn.textContent     = '⏸';
    loopPauseBtn.style.background = '#546e7a';
    flashLoopStatus('Loop cancelled', '#e74c3c');
  }

  function toggleT3() {
    if (t3Timeout || t3Paused) { cancelT3(); return; }
    if (!activeYoutubeId) { flashLoopStatus('No video loaded', '#e74c3c'); return; }
    loopTsInput.value  = secsToHMS(ytGetCurrentTime());
    t3SavedVolume      = ytGetVolume();
    t3LoopsRemaining   = T3_TOTAL_LOOPS;
    t3Paused           = false;
    t3Generation++;
    loopPauseBtn.style.display   = '';
    loopPauseBtn.textContent     = '⏸';
    loopPauseBtn.style.background = '#546e7a';
    runT3Loop(t3Generation);
  }

  function toggleT3Pause() {
    t3Paused = !t3Paused;
    if (t3Paused) {
      if (t3Timeout) { clearTimeout(t3Timeout); t3Timeout = null; }
      loopPauseBtn.textContent     = '▶ resume';
      loopPauseBtn.style.background = '#f57f17';
      setLoopStatus('Loop paused', '#ffb300');
    } else {
      loopPauseBtn.textContent     = '⏸';
      loopPauseBtn.style.background = '#546e7a';
      loopTsInput.value = secsToHMS(ytGetCurrentTime());
      t3Generation++;
      runT3Loop(t3Generation);
    }
  }

  loopBtn.addEventListener('click', toggleT3);
  loopPauseBtn.addEventListener('click', toggleT3Pause);
  // Prevent arrow-key navigation from firing while user edits the timestamp
  loopTsInput.addEventListener('keydown', e => e.stopPropagation());

  // ── Sidebar render ────────────────────────────────────────────────────────────
  function renderSidebar(data) {
    allAlbums = [];
    sidebarList.innerHTML = '';
    const genres = Object.keys(data);
    if (!genres.length) {
      sidebarList.innerHTML = '<div style="padding:14px; font-size:12px; color:#555;">No playlists found.</div>';
      return;
    }
    genres.forEach(genre => {
      const albums = data[genre] || [];
      const details = document.createElement('details');
      details.className = 'genre-group';
      details.open = true;
      const summary = document.createElement('summary');
      summary.textContent = toLabel(genre);
      details.appendChild(summary);
      albums.forEach(album => {
        const el = document.createElement('div');
        el.className = 'album-item';
        el.textContent = album.name;
        el.dataset.youtubeId = album.youtubeId || '';
        el.dataset.tracks = JSON.stringify(album.tracks || []);
        el.dataset.name = album.name;
        details.appendChild(el);
        allAlbums.push(el);
      });
      sidebarList.appendChild(details);
    });
  }

  // ── Track list ────────────────────────────────────────────────────────────────
  function renderTrackList(tracks) {
    trackListInner.innerHTML = '';
    if (!tracks || !tracks.length) {
      trackListEmpty.textContent = 'No chapters';
      trackListInner.appendChild(trackListEmpty);
      return;
    }
    tracks.forEach((t, i) => {
      const el = document.createElement('div');
      el.className = 'track-item';
      el.dataset.seconds = Math.floor(t.seconds || 0);
      el.dataset.index = i;
      const timeEl = document.createElement('span');
      timeEl.className = 'track-time';
      timeEl.textContent = t.time || '';
      const titleEl = document.createElement('span');
      titleEl.textContent = t.title || ('Track ' + (i + 1));
      el.appendChild(timeEl);
      el.appendChild(titleEl);
      trackListInner.appendChild(el);
    });
  }

  function setActiveTrack(el) {
    trackListInner.querySelectorAll('.track-item').forEach(t => t.classList.remove('track-active'));
    if (el) el.classList.add('track-active');
  }

  // ── Album selection ───────────────────────────────────────────────────────────
  function selectAlbum(albumEl) {
    if (!albumEl) return;
    allAlbums.forEach(el => el.classList.remove('active'));
    albumEl.classList.add('active');
    albumEl.scrollIntoView({ block: 'nearest' });
    cursorIndex = allAlbums.indexOf(albumEl);
    const youtubeId = albumEl.dataset.youtubeId;
    const name      = albumEl.dataset.name || '';
    const tracks    = JSON.parse(albumEl.dataset.tracks || '[]');
    playerHeader.innerHTML = name ? `<span>${name}</span>` : 'Playlist Player';
    activeYoutubeId = youtubeId;
    if (!youtubeId) {
      showOnly(noVideoMsg);
      renderTrackList([]);
      return;
    }
    ytLoadVideo(youtubeId, 0);
    showOnly(ytPlayerDiv);
    renderTrackList(tracks);
  }

  // ── Keyboard navigation ───────────────────────────────────────────────────────
  function highlightCursor() {
    allAlbums.forEach((el, i) => {
      el.classList.toggle('cursor', i === cursorIndex);
      if (i === cursorIndex) {
        el.setAttribute('aria-selected', 'true');
        el.scrollIntoView({ block: 'nearest' });
      } else {
        el.removeAttribute('aria-selected');
      }
    });
  }

  document.addEventListener('keydown', e => {
    if (!allAlbums.length) return;
    if (['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName)) return;
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      cursorIndex = Math.min(cursorIndex + 1, allAlbums.length - 1);
      if (cursorIndex < 0) cursorIndex = 0;
      highlightCursor();
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      cursorIndex = Math.max(cursorIndex - 1, 0);
      highlightCursor();
    } else if (e.key === 'Enter' && cursorIndex >= 0) {
      selectAlbum(allAlbums[cursorIndex]);
    }
  });

  // ── Event delegation ──────────────────────────────────────────────────────────
  sidebarList.addEventListener('click', e => {
    const albumEl = e.target.closest('.album-item');
    if (albumEl) selectAlbum(albumEl);
  });

  trackListInner.addEventListener('click', e => {
    const trackEl = e.target.closest('.track-item');
    if (!trackEl || !activeYoutubeId) return;
    const secs = parseInt(trackEl.dataset.seconds) || 0;
    ytSeekTo(secs);
    setActiveTrack(trackEl);
  });

  // ── Load playlists ────────────────────────────────────────────────────────────
  async function loadPlaylists() {
    sidebarList.innerHTML = '<div style="padding:20px 14px; font-size:12px; color:#555;">Loading…</div>';
    try {
      const res = await fetch('/api/playlists');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      playlists = data;
      renderSidebar(data);
    } catch (err) {
      sidebarList.innerHTML = '<div style="padding:14px; font-size:12px; color:#e57373;">Error loading playlists</div>';
      errText.textContent = 'Failed to load playlists — check YOUTUBE_PLAYLISTS_URL env var. (' + err.message + ')';
      showOnly(errorState);
    }
  }

  retryBtn.addEventListener('click', loadPlaylists);
  loadPlaylists();
</script>
</body>
</html>
