<html lang="en">

    <meta charset="UTF-8">

  <html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JS Piano with Sequence Input</title>
  <style>
    html {
      background: #000;
      font-family: 'Noto Serif', serif;
      -webkit-font-smoothing: antialiased;
      text-align: center;
    }

    body {
      margin: 0;
      padding: 0;
    }

    video#bgvid { 
      position: fixed;
      top: 50%;
      left: 50%;
      min-width: 100%;
      min-height: 100%;
      width: auto;
      height: auto;
      z-index: -100;
      transform: translateX(-50%) translateY(-50%);
      background-size: cover; 
    }

    header {
      position: relative;
      margin: 30px 0;
    }

    header:after {
      content: '';
      width: 460px;
      height: 15px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
      display: inline-block;
      text-align: center;
    }

    h1 {
      color: #fff;
      font-size: 50px;
      font-weight: 400;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin: 0;
    }

    h2 {
      color: #fff;
      font-size: 24px;
      font-style: italic;
      font-weight: 400;
      margin: 0 0 30px;
    }

    .nowplaying {
      font-size: 120px;
      line-height: 1;
      color: #eee;
      text-shadow: 0 0 5rem #028ae9;
      transition: all .07s ease;
      min-height: 120px;
    }

    .keys {
      display: block;
      width: 100%;
      height: 160px;
      position: relative;
    }

    .key {
      position: relative;
      border: 4px solid black;
      border-radius: .5rem;
      transition: all .07s ease;
      display: block;
      box-sizing: border-box;
      z-index: 2;
    }

    .key:not(.sharp) {
      float: left;
      height: 100%;
      background: rgba(255, 255, 255, .8);
    }

    .key.sharp {
      position: absolute;
      width: 6%;
      height: 60%;
      background: #000;
      color: #eee;
      top: 0;
      z-index: 3;
    }

    .playing {
      transform: scale(.95);
      border-color: #028ae9;
      box-shadow: 0 0 1rem #028ae9;
    }

    .hints {
      display: block;
      width: 100%;
      opacity: 1;
      position: absolute;
      bottom: 7px;
      font-size: 13px;
      color: #333;
      pointer-events: none;
    }

    .key.sharp .hints {
      color: #eee;
    }

    .keys-wrap {
      max-width: 880px;
      margin: 30px auto 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* Sequence input styles */
    .sequence-container {
      margin: 30px auto;
      max-width: 805px;
      width: 100%;
      text-align: left; /* Left-align all content in the container */
    }

    .sequence-input {
      background: rgba(255, 255, 255, 0.07);
      border: 2px solid #028ae9;
      padding: 10px 15px;
      font-size: 14px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      border-radius: 4px;
      width: 100%;
      color: #eee;
      resize: vertical;
      min-height: 100px;
      line-height: 1.6;
      box-sizing: border-box;
    }
    .sequence-input::placeholder { color: #555; }

    .play-btn {
      background: #028ae9;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 18px;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .play-btn:hover {
      background: #0279d0;
    }

    .input-container {
      margin-bottom: 15px;
    }

    /* Dropbox modal */
    .dbx-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .dbx-overlay.open { display: flex; }
    .dbx-box {
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 12px;
      width: min(520px, 94vw);
      max-height: 75vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .dbx-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid #2a2a2a;
      color: #eee;
      font-size: 14px;
      font-weight: 600;
    }
    .dbx-close {
      background: none;
      border: none;
      color: #888;
      font-size: 20px;
      cursor: pointer;
      line-height: 1;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .dbx-close:hover { background: #2a2a2a; color: #ccc; }
    .dbx-toolbar {
      padding: 10px 14px;
      border-bottom: 1px solid #222;
      display: flex;
      gap: 8px;
    }
    .dbx-path-input {
      flex: 1;
      background: #111;
      border: 1px solid #3a3a3a;
      border-radius: 6px;
      color: #ddd;
      font-size: 13px;
      padding: 6px 10px;
      font-family: monospace;
    }
    .dbx-path-input:focus { outline: none; border-color: #0061ff; }
    .dbx-go-btn {
      background: #2a2a2a;
      border: 1px solid #3a3a3a;
      border-radius: 6px;
      color: #ccc;
      font-size: 13px;
      padding: 6px 14px;
      cursor: pointer;
    }
    .dbx-go-btn:hover { background: #333; color: #fff; }
    .dbx-go-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .dbx-preset-select {
      background: #111;
      border: 1px solid #3a3a3a;
      border-radius: 6px;
      color: #ccc;
      font-size: 13px;
      padding: 6px 8px;
      cursor: pointer;
    }
    .dbx-breadcrumb {
      padding: 5px 16px;
      font-size: 12px;
      color: #555;
      min-height: 26px;
      display: flex;
      align-items: center;
      gap: 2px;
      flex-wrap: wrap;
    }
    .dbx-crumb {
      background: none;
      border: none;
      color: #4a9eff;
      cursor: pointer;
      font-size: 12px;
      padding: 1px 3px;
      border-radius: 3px;
    }
    .dbx-status {
      padding: 3px 16px 5px;
      font-size: 12px;
      color: #555;
      min-height: 22px;
    }
    .dbx-list { flex: 1; overflow-y: auto; }
    .dbx-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      border-bottom: 1px solid #1a1a1a;
      cursor: pointer;
    }
    .dbx-item:hover { background: #222; }
    .dbx-icon { font-size: 15px; flex-shrink: 0; }
    .dbx-name {
      flex: 1;
      font-size: 13px;
      color: #ddd;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .dbx-action {
      background: linear-gradient(45deg, #0061ff, #004bb5);
      border: none;
      border-radius: 5px;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 12px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .dbx-action:hover { opacity: 0.85; }
    .dbx-signin-btn {
      background: linear-gradient(45deg, #0061ff, #004bb5);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      padding: 12px 28px;
      cursor: pointer;
      display: block;
      margin: 48px auto 0;
    }

    /* ---- staff view ---- */
    #staffView { display:none; background:#111; border:1px solid #2a2a2a; border-radius:8px; margin:10px 0; }
    #staffScroll { overflow-x:auto; padding:6px 0; }
    .play-btn.view-on { box-shadow:0 0 0 2px #fff; }
    #viewBar select, #viewBar input { padding:6px 8px; border-radius:6px; border:1px solid #333; background:#111; color:#aaa; font-size:13px; }

    /* ---- note strip ---- */
    #noteStrip {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 10px 0 14px;
      scroll-behavior: smooth;
      min-height: 80px;
      align-items: flex-end;
    }
    .note-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 46px;
      padding: 8px 6px 6px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(255,255,255,.07);
      flex-shrink: 0;
      transition: background .07s, transform .07s, border-color .07s;
      cursor: pointer;
    }
    .note-card:hover { background: rgba(255,255,255,.14); border-color: rgba(255,255,255,.35); }
    .note-card.end-card {
      border-width: 3px;
      padding: 6px 4px 4px; /* offset thicker border so card size matches the rest */
    }
    .note-card.playing {
      background: #028ae9;
      border-color: #028ae9;
      transform: scale(1.13) translateY(-5px);
      box-shadow: 0 4px 16px rgba(2,138,233,.55);
    }
    .nc-name  { font-size: 14px; font-weight: 700; color: #ddd; }
    .nc-dur   { font-size: 10px; color: #666; margin-top: 1px; }
    .nc-lyric { font-size: 12px; color: #aaa; margin-top: 5px; white-space: nowrap; }
    .note-card.playing .nc-name,
    .note-card.playing .nc-dur,
    .note-card.playing .nc-lyric { color: #fff; }
  </style>
</head>
<body>
  <section id="wrap">
    <header>
      <h1>JS Piano &nbsp;<a href="note_builder.html" target="_blank" style="font-size:14px; color:#028ae9; text-decoration:none; font-weight:400;">Note Builder ↗</a></h1>
    </header>
    <section id="main">

      <!-- Reference image + audio -->
      <div class="sequence-container" style="margin-bottom:0;">
        <button class="play-btn" id="loadImageBtn" onclick="document.getElementById('imageFileInput').click()" style="font-size:15px; margin-bottom:8px; margin-right:8px;">Load image</button>
        <input type="file" id="imageFileInput" accept="image/*" style="display:none;">
        <button class="play-btn" id="loadAudioBtn" onclick="document.getElementById('audioFileInput').click()" style="font-size:15px; margin-bottom:8px; margin-right:8px; background:#1a7a1a;">Load audio</button>
        <input type="file" id="audioFileInput" accept="audio/*" style="display:none;">
        <button class="play-btn" id="audioRepeatBtn" onclick="startAudioRepeat5()" style="font-size:15px; margin-bottom:8px; margin-right:8px; background:#1a4a7a;">🔁 5×</button>
        <div id="imagePreviewContainer" style="display:none; position:relative; margin-bottom:10px;">
          <img id="imagePreview" style="max-width:100%; max-height:180px; border-radius:6px; cursor:pointer; display:block;" onclick="toggleImageSize()">
          <button onclick="closeImagePreview()" style="position:absolute; top:4px; right:4px; background:rgba(0,0,0,0.6); color:#fff; border:none; border-radius:50%; width:26px; height:26px; cursor:pointer; font-size:17px; line-height:1;">×</button>
        </div>
        <div id="audioPlayerContainer" style="display:none; position:relative; margin-bottom:10px;">
          <audio id="audioPlayer" controls style="width:100%; border-radius:6px;"></audio>
          <button onclick="closeAudioPlayer()" style="position:absolute; top:4px; right:4px; background:rgba(0,0,0,0.6); color:#fff; border:none; border-radius:50%; width:26px; height:26px; cursor:pointer; font-size:17px; line-height:1;">×</button>
        </div>
      </div>

      <!-- Sequence input -->
      <div class="sequence-container">
        <div id="trebleLabel" style="display:none; color:#aaa; font-size:13px; margin-bottom:4px;">🎼 Treble (right hand)</div>
        <div class="input-container">
          <textarea class="sequence-input" id="sequenceInput" placeholder="do:D4:1, you:D4:1, hear:E4:1, them:F4:1&#10;next line continues here…">B3:0.75, B4:0.25,
B4:3, C5:1,

A4:3, B4:1,

F#4:3, F#4:0.75, E4:0.25</textarea>
        </div>
        <div id="bassBox" style="display:none; margin-top:8px;">
          <div style="color:#aaa; font-size:13px; margin-bottom:4px;">🎼 Bass (left hand) — plays together with the box above, both from beat 0</div>
          <div class="input-container">
            <textarea class="sequence-input" id="bassInput" placeholder="_:1, E3:0.5, E3:0.5, E3:0.5 …  (use _ rests so it lines up with the treble)">_:1,

F3+Eb4:0.5, F3+Eb4:0.5, F3+Eb4:0.5, F3+Eb4:0.5, F3+D4:0.5, F3+D4:0.5, F3+D4:0.5, F3+D4:0.5,

D3+C4:0.5, D3+C4:0.5, D3+C4:0.5, D3+C4:0.5, D3+C4:0.5, D3+C4:0.5, D3+C4:0.5, D3+C4:0.5,
D3+C4:0.5, D3+C4:0.5, D3+C4:0.5, D3+C4:0.5, D3+B3:0.5, D3+B3:0.5, D3+B3:0.5, D3+B3:0.5,

B2+A3:1, _:1, _:2,
G3+E4:0.5, G3+E4:0.5, G3+E4:0.5, G3+E4:0.5, G3+E4:0.5, G3+E4:0.5, G3+E4:0.5, G3+E4:0.5,
F#3+E4:0.5, F#3+E4:0.5, F#3+E4:0.5, F#3+E4:0.5, F3+Eb4:0.5, F3+Eb4:0.5, F3+Eb4:0.5, F3+Eb4:0.5,
F3+Eb4:0.5, F3+Eb4:0.5, F3+D4:0.5, F3+D4:0.5, E3+D4:0.5, E3+D4:0.5, E3+D4:0.5, E3+D4:0.5,
E3+D4:0.5, E3+D4:0.5, E3+C#4:0.5, E3+C#4:0.5, C#3+A#3:0.5, C#3+A#3:0.5, C3+A3:0.5, C3+A3:0.5,
B2:1, A3:1, G3:1, G3:1,
A3:1, A3:1, B3:1, A3:1,
B2+B3:0.5, B2+B3:0.5, B2+B3:0.5, B2+B3:0.5, C3+A3:0.5, C3+A3:0.5, C3+A3:0.5, C3+A3:0.5,
B2+B3:0.5, B2+B3:0.5, B2+B3:0.5, B2+B3:0.5, B2+B3:0.5, B2+B3:0.5, B2+A3:0.5, B2+A3:0.5</textarea>
          </div>
        </div>
        <div style="display:flex; align-items:center; gap:10px; margin-top:8px;">
          <label for="volumeSlider" style="color:#aaa; font-size:14px;">Vol</label>
          <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="1" style="width:160px; accent-color:#028ae9; cursor:pointer;">
        </div>
        <div style="display:flex; align-items:center; gap:10px; margin-top:8px; flex-wrap:wrap;">
          <select id="syncSelect" style="padding:6px 8px; border-radius:6px; border:1px solid #333; background:#111; color:#aaa; font-size:13px; cursor:pointer;">
            <option value="">⏱ Sync…</option>
          </select>
          <span id="syncStatus" style="font-family:monospace; font-size:12px; color:#aaa;">—</span>
          <button id="clockBtn" style="padding:6px 10px; border-radius:6px; border:1px solid #333; background:#111; color:#aaa; font-size:13px; cursor:pointer;">🕐</button>
          <span id="clockDisplay" style="font-family:monospace; font-size:12px; color:#aaa;"></span>
        </div>
        <div style="display:flex; align-items:center; gap:10px; margin-top:8px; flex-wrap:wrap;">
          <button class="play-btn" id="playSequence">&#9654; Play</button>
          <button class="play-btn" id="seqRepeatBtn" onclick="toggleSeqRepeat()" style="background:#1a4a7a;">🔁 5×</button>
          <label style="color:#aaa; font-size:14px;">BPM</label>
          <input type="number" id="bpmInput" value="60" min="40" max="300"
            style="width:58px; padding:6px; border-radius:6px; border:1px solid #333; background:#111; color:#eee; font-size:13px;">
          <input type="number" id="repeatInput" value="1" min="1" max="99" style="display:none;">
          <button class="play-btn" id="stopStripBtn" style="display:none; background:#b3261e;">&#9632; Stop</button>
          <button class="play-btn" onclick="openDbxModal()" style="font-size:15px; background:linear-gradient(45deg,#0061ff,#004bb5);">📂 Dropbox</button>
        </div>
      </div>

      <!-- Note strip -->
      <div class="sequence-container" style="margin-top:8px;">
        <div id="noteStrip"><span style="color:#555; font-size:13px;">Enter a sequence and press Play — the note strip appears here.</span></div>
      </div>

      <!-- Dropbox modal -->
      <div class="dbx-overlay" id="dbxOverlay">
        <div class="dbx-box">
          <div class="dbx-header">
            <span>📂 Dropbox Files</span>
            <button class="dbx-close" onclick="closeDbxModal()">✕</button>
          </div>
          <div class="dbx-toolbar">
            <input class="dbx-path-input" id="dbxPathInput" value="/" placeholder="/ (root)">
            <button class="dbx-go-btn" id="dbxGoBtn" onclick="dbxBrowse(document.getElementById('dbxPathInput').value)">Go</button>
            <select class="dbx-preset-select" id="dbxPresetSelect" onchange="if(this.value){dbxBrowse(this.value); this.value='';}">
              <option value="">-- Presets --</option>
            </select>
          </div>
          <div class="dbx-breadcrumb" id="dbxBreadcrumb"></div>
          <div class="dbx-status" id="dbxStatus">Not signed in</div>
          <div class="dbx-list" id="dbxList"></div>
        </div>
      </div>

      <div id="viewBar" class="sequence-container" style="display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:8px;">
        <button class="play-btn" id="viewKeysBtn" style="font-size:15px;">🎹 Keys</button>
        <button class="play-btn" id="viewStaffBtn" style="font-size:15px;">🎼 Staff</button>
        <button class="play-btn" id="bassToggleBtn" style="font-size:15px; background:#6b3fa0;" title="Add a second box for the left hand that plays together with the first">➕ Bass hand</button>
        <span id="staffOpts" style="display:none; align-items:center; gap:8px; flex-wrap:wrap;">
          <label for="staffBeats" style="color:#aaa; font-size:14px;">Bar</label>
          <select id="staffBeats">
            <option value="auto">Auto (a bar per line)</option>
            <option value="2">2 beats (2/4)</option>
            <option value="3">3 beats (3/4)</option>
            <option value="4">4 beats (4/4)</option>
            <option value="5">5 beats</option>
            <option value="6">6 beats</option>
            <option value="0">no bar lines</option>
          </select>
          <label for="staffPickup" style="color:#aaa; font-size:14px;">Pickup beats</label>
          <input type="number" id="staffPickup" value="0" min="0" max="8" step="0.5" style="width:58px;">
        </span>
      </div>
      <div class="sequence-container" style="padding:0;"><div id="staffView"><div id="staffScroll"></div></div></div>

      <div class="sequence-container" style="padding:0;">
        <div id="noteLadder" style="display:none; background:#111; border:1px solid #2a2a2a; border-radius:8px; margin:10px 0; padding:10px 12px;">
          <div style="display:flex; align-items:baseline; gap:14px; flex-wrap:wrap;">
            <span style="color:#aaa; font-size:13px;">Press a key (or click a note) — it lights up here</span>
            <span id="ladderReadout" style="font-family:monospace; color:#c4b5fd; font-size:15px; font-weight:700; min-height:20px;"></span>
          </div>
          <svg id="ladderSvg" viewBox="-30 0 530 330" xmlns="http://www.w3.org/2000/svg" style="width:100%; max-width:560px; display:block;"></svg>
        </div>
      </div>

      <div class="keys-wrap" style="display:none;">
        <div class="keys" id="keysRow0"></div>
        <div class="keys" id="keysRow1"></div>
        <div class="keys" id="keysRow2"></div>
      </div>
    </section>
  </section>
  <div style="background: #000; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -101;"></div>

  <script src="staff.js"></script>
  <script>
    // Web Audio API — load all WAVs into buffers for precise duration control
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const audioBuffers = {};
    const SEMI = Math.pow(2, 1/12);

    // note name → { file, rate } — Salamander for bass, original WAVs for treble (C4–E5)
    const NOTE_SOURCES = {
      // Sub-bass row (B1–G#2) — ledger lines below bass clef staff
      'B1':  { file: 'sounds/C2.mp3',  rate: 1 / (SEMI * SEMI) }, // C2 down 2 semitones
      'C2':  { file: 'sounds/C2.mp3',  rate: 1 },
      'C#2': { file: 'sounds/C2.mp3',  rate: SEMI },
      'D2':  { file: 'sounds/Ds2.mp3', rate: 1 / SEMI },
      'D#2': { file: 'sounds/Ds2.mp3', rate: 1 },
      'E2':  { file: 'sounds/Ds2.mp3', rate: SEMI },
      'F2':  { file: 'sounds/Fs2.mp3', rate: 1 / SEMI },
      'F#2': { file: 'sounds/Fs2.mp3', rate: 1 },
      'G2':  { file: 'sounds/Fs2.mp3', rate: SEMI },
      'G#2': { file: 'sounds/A2.mp3',  rate: 1 / SEMI },
      // Bass row (A2–B3)
      'A2':  { file: 'sounds/A2.mp3',  rate: 1 },
      'A#2': { file: 'sounds/A2.mp3',  rate: SEMI },
      'B2':  { file: 'sounds/A2.mp3',  rate: SEMI * SEMI },
      'C3':  { file: 'sounds/C3.mp3',  rate: 1 },
      'C#3': { file: 'sounds/C3.mp3',  rate: SEMI },
      'D3':  { file: 'sounds/Ds3.mp3', rate: 1 / SEMI },
      'D#3': { file: 'sounds/Ds3.mp3', rate: 1 },
      'E3':  { file: 'sounds/Ds3.mp3', rate: SEMI },
      'F3':  { file: 'sounds/Fs3.mp3', rate: 1 / SEMI },
      'F#3': { file: 'sounds/Fs3.mp3', rate: 1 },
      'G3':  { file: 'sounds/Fs3.mp3', rate: SEMI },
      'G#3': { file: 'sounds/A3.mp3',  rate: 1 / SEMI },
      'A3':  { file: 'sounds/A3.mp3',  rate: 1 },
      'A#3': { file: 'sounds/A3.mp3',  rate: SEMI },
      'B3':  { file: 'sounds/A3.mp3',  rate: SEMI * SEMI },
      'C4':  { file: 'sounds/040.wav', rate: 1 },
      'C#4': { file: 'sounds/041.wav', rate: 1 },
      'D4':  { file: 'sounds/042.wav', rate: 1 },
      'D#4': { file: 'sounds/043.wav', rate: 1 },
      'E4':  { file: 'sounds/044.wav', rate: 1 },
      'F4':  { file: 'sounds/045.wav', rate: 1 },
      'F#4': { file: 'sounds/046.wav', rate: 1 },
      'G4':  { file: 'sounds/047.wav', rate: 1 },
      'G#4': { file: 'sounds/048.wav', rate: 1 },
      'A4':  { file: 'sounds/049.wav', rate: 1 },
      'A#4': { file: 'sounds/050.wav', rate: 1 },
      'B4':  { file: 'sounds/051.wav', rate: 1 },
      'C5':  { file: 'sounds/052.wav', rate: 1 },
      'C#5': { file: 'sounds/053.wav', rate: 1 },
      'D5':  { file: 'sounds/054.wav', rate: 1 },
      'D#5': { file: 'sounds/055.wav', rate: 1 },
      'E5':  { file: 'sounds/056.wav', rate: 1 },
      // F5–G5: anchor Fs5 (±1 semitone)
      'F5':  { file: 'sounds/Fs5.wav', rate: 1 / SEMI },
      'F#5': { file: 'sounds/Fs5.wav', rate: 1 },
      'G5':  { file: 'sounds/Fs5.wav', rate: SEMI },
      // G#5–A#5: anchor A5 (±1 semitone)
      'G#5': { file: 'sounds/A5.wav',  rate: 1 / SEMI },
      'A5':  { file: 'sounds/A5.wav',  rate: 1 },
      'A#5': { file: 'sounds/A5.wav',  rate: SEMI },
      // B5–C#6: anchor C6 (±1 semitone)
      'B5':  { file: 'sounds/C6.wav',  rate: 1 / SEMI },
      'C6':  { file: 'sounds/C6.wav',  rate: 1 },
      'C#6': { file: 'sounds/C6.wav',  rate: SEMI },
      // D6–E6: anchor Ds6 (±1 semitone)
      'D6':  { file: 'sounds/Ds6.wav', rate: 1 / SEMI },
      'D#6': { file: 'sounds/Ds6.wav', rate: 1 },
      'E6':  { file: 'sounds/Ds6.wav', rate: SEMI },
    };

    // Load each unique source file once
    const uniqueFiles = [...new Set(Object.values(NOTE_SOURCES).map(s => s.file))];
    (async function loadBuffers() {
      await Promise.all(uniqueFiles.map(async file => {
        try {
          const res = await fetch(file);
          const buf = await res.arrayBuffer();
          audioBuffers[file] = await audioCtx.decodeAudioData(buf);
        } catch(e) { console.warn('Could not load', file, e); }
      }));
    })();

    // Master volume gain — all audio routes through this
    const masterGain = audioCtx.createGain();
    masterGain.gain.value = 1.0;
    // Chords and two hands stack many samples at once; their sum can pass full scale and distort (a buzz).
    // This compressor works as a limiter so the output stays clean.
    const limiter = audioCtx.createDynamicsCompressor();
    limiter.threshold.value = -12;
    limiter.knee.value = 6;
    limiter.ratio.value = 12;
    limiter.attack.value = 0.002;
    limiter.release.value = 0.2;
    masterGain.connect(limiter);
    limiter.connect(audioCtx.destination);

    document.getElementById('volumeSlider').addEventListener('input', function() {
      masterGain.gain.value = parseFloat(this.value);
    });

    // Synthetic reverb — decaying white noise impulse response
    function buildReverb(duration = 2.5, decay = 3) {
      const len = audioCtx.sampleRate * duration;
      const ir  = audioCtx.createBuffer(2, len, audioCtx.sampleRate);
      for (let ch = 0; ch < 2; ch++) {
        const d = ir.getChannelData(ch);
        for (let i = 0; i < len; i++)
          d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
      }
      const conv = audioCtx.createConvolver();
      conv.buffer = ir;
      // Wet/dry mix: mostly dry, light reverb tail
      const dry = audioCtx.createGain(); dry.gain.value = 1.0;
      const wet = audioCtx.createGain(); wet.gain.value = 0.25;
      conv.connect(wet);
      wet.connect(masterGain);
      dry.connect(masterGain);
      return { dry, conv };
    }
    let reverbNodes = null;

    function playBuffer(noteName, durationSeconds, level = 1) {
      const src = NOTE_SOURCES[noteName];
      if (!src) return;
      const buffer = audioBuffers[src.file];
      if (!buffer) { console.warn('Buffer not loaded for', noteName); return; }
      if (audioCtx.state === 'suspended') audioCtx.resume();

      if (!reverbNodes) reverbNodes = buildReverb();

      const source = audioCtx.createBufferSource();
      source.buffer = buffer;
      source.playbackRate.value = src.rate;
      activeSources.push(source);
      source.addEventListener('ended', () => {
        activeSources = activeSources.filter(s => s !== source);
      });

      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(level, audioCtx.currentTime);
      const naturalDur = buffer.duration / src.rate;
      const fadeStart = audioCtx.currentTime + (durationSeconds || naturalDur);
      gain.gain.setTargetAtTime(0, fadeStart, 0.3);

      source.connect(gain);
      gain.connect(reverbNodes.dry);
      gain.connect(reverbNodes.conv);
      source.start(0);
      source.stop(fadeStart + 1.0);
    }

    // Physical keyboard letters → natural notes only (sharps and flats are mouse-only):
    //   B N M = G3 A3 B3,  A S D F G H J K L ; = C4 D4 E4 F4 G4 A4 B4 C5 D5 E5,  Q W E R = F5 G5 A5 B5
    const keyToNote = {
      'B': 'G3', 'N': 'A3', 'M': 'B3',
      'A': 'C4', 'S': 'D4', 'D': 'E4', 'F': 'F4', 'G': 'G4', 'H': 'A4', 'J': 'B4',
      'K': 'C5', 'L': 'D5', ';': 'E5',
      'Q': 'F5', 'W': 'G5', 'E': 'A5', 'R': 'B5'
    };

    // Resolve a typed note string (e.g. "D", "C#", "Eb", "G3", "A#2") → canonical key in NOTE_SOURCES
    const FLAT_TO_SHARP = { CB:'B', DB:'C#', EB:'D#', FB:'E', GB:'F#', AB:'G#', BB:'A#' };
    function resolveNote(raw) {
      if (!raw) return null;
      const s = raw.trim().toUpperCase();
      const m = s.match(/^([A-G])(#|B)?(\d)?$/);
      if (!m) return null;
      const [, root, acc, oct] = m;
      let base;
      if (acc === 'B') {
        base = FLAT_TO_SHARP[root + 'B'] || root;
      } else {
        base = root + (acc === '#' ? '#' : '');
      }
      const canonical = base + (oct || '4');
      return NOTE_SOURCES[canonical] ? canonical : null;
    }

    function buildPianoRow(containerId, notesArray) {
      const container = document.getElementById(containerId);
      if (!container) return;
      const whiteNotes = notesArray.filter(n => !n.includes('#'));
      const whiteWidth = 100 / whiteNotes.length;
      const blackWidth = whiteWidth * 0.6;
      let whiteIndex = 0;
      notesArray.forEach(n => {
        const div = document.createElement('div');
        div.dataset.note = n;
        div.innerHTML = `<span class="hints">${n}</span>`;
        if (!n.includes('#')) {
          div.className = 'key';
          div.style.width = whiteWidth + '%';
          container.appendChild(div);
          whiteIndex++;
        } else {
          div.className = 'key sharp';
          div.style.width = blackWidth + '%';
          div.style.left = (whiteIndex * whiteWidth - blackWidth / 2) + '%';
          container.appendChild(div);
        }
        div.addEventListener('click', () => triggerNote(n));
        div.addEventListener('transitionend', function(e) {
          if (e.propertyName === 'transform') div.classList.remove('playing');
        });
      });
    }

    const row0Notes = ['B1','C2','C#2','D2','D#2','E2','F2','F#2','G2','G#2'];
    const row1Notes = ['A2','A#2','B2','C3','C#3','D3','D#3','E3','F3','F#3','G3','G#3','A3','A#3','B3'];
    const row2Notes = ['C4','C#4','D4','D#4','E4','F4','F#4','G4','G#4','A4','A#4','B4','C5','C#5','D5','D#5','E5','F5','F#5','G5','G#5','A5','A#5','B5'];
    buildPianoRow('keysRow0', row0Notes);
    buildPianoRow('keysRow1', row1Notes);
    buildPianoRow('keysRow2', row2Notes);

    // ---- Note ladder: the Note Builder staff layout, with the computer key (and its keyCode) beside each note ----
    (function () {
      const NS = 'http://www.w3.org/2000/svg';
      const svg = document.getElementById('ladderSvg');
      const readout = document.getElementById('ladderReadout');
      const NAMES = ['B5','A5','G5','F5','E5','D5','C5','B4','A4','G4','F4','E4','D4','C4','B3','A3','G3'];   // top to bottom
      const STAFF_LINES = ['F5','D5','B4','G4','E4'];
      const LEDGERS = ['G5','A5','B5','D4','C4','B3','A3','G3'];
      const X_LEFT = 75, X_RIGHT = 430, X_NOTE = 190, TOP = 20, STEP = 18;
      // note -> the computer key that plays it, and that key's keyCode (what keydown reports)
      const keyOf = {};
      Object.keys(keyToNote).forEach(k => { keyOf[keyToNote[k]] = { label: k, code: k === ';' ? 186 : k.charCodeAt(0) }; });
      const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
      const rows = {};   // note name -> { band, dot, timer }

      const yOf = name => TOP + NAMES.indexOf(name) * STEP;
      const clef = el('text', { x: 30, y: yOf('A4') + 2, 'font-size': 95, 'font-family': 'Georgia, serif', fill: '#ddd' }, svg);
      clef.textContent = '𝄞';
      NAMES.forEach(name => {
        const y = yOf(name);
        const band = el('rect', { x: X_LEFT - 2, y: y - 9, width: X_RIGHT - X_LEFT + 4, height: 18, fill: 'rgba(139,92,246,0.32)', opacity: 0 }, svg);
        if (LEDGERS.includes(name)) el('line', { x1: X_NOTE - 22, y1: y, x2: X_NOTE + 22, y2: y, stroke: '#666', 'stroke-width': 1.5 }, svg);
        if (STAFF_LINES.includes(name)) el('line', { x1: X_LEFT, y1: y, x2: X_RIGHT, y2: y, stroke: '#bbb', 'stroke-width': 1.6 }, svg);
        const label = el('text', { x: X_LEFT - 45, y: y + 4, 'font-size': 12, fill: '#aaa', 'font-family': 'monospace' }, svg);
        label.textContent = name;
        const k = keyOf[name];
        if (k) {
          const hint = el('text', { x: X_LEFT - 98, y: y + 4, 'font-size': 12, fill: '#a78bfa', 'font-family': 'monospace', 'font-weight': '700' }, svg);
          hint.textContent = k.label;
          const code = el('text', { x: X_LEFT - 84, y: y + 4, 'font-size': 9, fill: '#8a8a8e', 'font-family': 'monospace' }, svg);
          code.textContent = k.code;
        }
        const dot = el('ellipse', { cx: X_NOTE, cy: y, rx: 9, ry: 6.5, fill: '#8b5cf6', opacity: 0 }, svg);
        const hit = el('rect', { x: X_LEFT - 2, y: y - 9, width: X_RIGHT - X_LEFT + 4, height: 18, fill: 'transparent', style: 'cursor:pointer' }, svg);
        hit.addEventListener('click', () => triggerNote(name));
        rows[name] = { band, dot, timer: null };
      });

      // Called for every note that sounds: a key press, a click, or the sequence playing
      window.ladderShow = function (noteName) {
        const m = /^([A-G])(#?)(\d)$/.exec(noteName);
        if (!m) return;
        const natural = m[1] + m[3];            // a sharp lights its natural's row
        const row = rows[natural];
        const lk = window.__lastKey, k = keyOf[noteName];
        readout.textContent = lk ? 'key ' + lk.label + ' (' + lk.code + ') → ' + noteName : noteName + (k ? '  (key ' + k.label + ', ' + k.code + ')' : '');
        if (!row) return;
        clearTimeout(row.timer);
        row.band.setAttribute('opacity', 1);
        row.dot.setAttribute('opacity', 1);
        row.timer = setTimeout(() => { row.band.setAttribute('opacity', 0); row.dot.setAttribute('opacity', 0); }, 600);
      };
    })();

    // Live keyboard → treble row (skip when typing in inputs)
    window.addEventListener('keydown', function(e) {
      if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
      if (e.metaKey || e.ctrlKey || e.altKey) return;   // leave browser shortcuts (Cmd+N, Cmd+M, ...) alone
      const n = keyToNote[e.key.toUpperCase()] || keyToNote[e.key];
      if (n) {
        window.__lastKey = { label: e.key === ';' ? ';' : e.key.toUpperCase(), code: e.keyCode };
        triggerNote(n);
        window.__lastKey = null;
      }
    });

    function triggerNote(noteName, durationSeconds, level) {
      const key = document.querySelector(`.key[data-note="${noteName}"]`);
      if (key) key.classList.add('playing');
      if (window.ladderShow) window.ladderShow(noteName);
      playBuffer(noteName, durationSeconds, level);
    }

    const sequenceInput = document.getElementById("sequenceInput"),
          playSequenceBtn = document.getElementById("playSequence");

    // ---- note strip ----
    const DUR_LABELS = {0.5:'♪',1:'♩',1.5:'♩.',2:'𝅗𝅥',3:'𝅗𝅥.',4:'○'};
    let allTimers = [];
    let activeSources = [];
    let lastParsed = [];
    let lastBass = [];   // bass-voice parse used by the last Play (empty when the bass box is closed)
    // Playback and the staff both count time in whole ticks (1/24 beat) so triplets never drift between the two voices
    const TICKS_PER_BEAT = StaffView.TICKS_PER_BEAT, toTicks = StaffView.toTicks;
    function getBassParsed() {
      const box = document.getElementById('bassBox');
      if (!box || box.style.display === 'none') return [];
      const s = document.getElementById('bassInput').value.trim();
      return s ? parseNoteSequence(s).filter(it => !(it && it.type === 'section')) : [];
    }
    let remainingRepeats = 0;

    // ---- fade-loop helpers (mirrors bach-player pattern) ----
    const LOOP_FADE_OUT_MS = 800;
    const LOOP_FADE_IN_MS  = 600;
    let loopFadeGen = 0;

    function fadeGainTo(target, durationMs) {
      masterGain.gain.cancelScheduledValues(audioCtx.currentTime);
      masterGain.gain.setValueAtTime(masterGain.gain.value, audioCtx.currentTime);
      masterGain.gain.linearRampToValueAtTime(target, audioCtx.currentTime + durationMs / 1000);
    }

    function fadeAudioElTo(el, target, durationMs) {
      if (!el || !el.src || el.paused) return;
      const start = el.volume;
      const steps = 20;
      const stepMs = durationMs / steps;
      let i = 0;
      const iv = setInterval(() => {
        i++;
        el.volume = Math.min(1, Math.max(0, start + (target - start) * (i / steps)));
        if (i >= steps) clearInterval(iv);
      }, stepMs);
    }

    function doFadeLoop() {
      document.querySelectorAll('.note-card.playing').forEach(c => c.classList.remove('playing'));
      const gen = ++loopFadeGen;
      const sliderVol = parseFloat(document.getElementById('volumeSlider').value);
      const audioEl = document.getElementById('audioPlayer');
      const audioVol = audioEl.volume;
      fadeGainTo(0, LOOP_FADE_OUT_MS);
      fadeAudioElTo(audioEl, 0, LOOP_FADE_OUT_MS);
      setTimeout(() => {
        if (loopFadeGen !== gen) return;
        // save repeat count — startPlaybackFrom→stopStripPlayback resets it to 0
        const reps = remainingRepeats;
        if (audioEl.src && !audioEl.paused) audioEl.currentTime = 0;
        startPlaybackFrom(lastParsed, 0);
        remainingRepeats = reps; // restore after stopStripPlayback wiped it
        // stopStripPlayback also snaps gain back to full, so force 0 → fade in
        masterGain.gain.cancelScheduledValues(audioCtx.currentTime);
        masterGain.gain.setValueAtTime(0, audioCtx.currentTime);
        masterGain.gain.linearRampToValueAtTime(sliderVol, audioCtx.currentTime + LOOP_FADE_IN_MS / 1000);
        if (audioEl.src) { audioEl.volume = 0; fadeAudioElTo(audioEl, audioVol, LOOP_FADE_IN_MS); }
      }, LOOP_FADE_OUT_MS);
    }

    function renderNoteStrip(parsed) {
      if (window.renderStaff) window.renderStaff(parsed);
      const strip = document.getElementById('noteStrip');
      if (!parsed.length) {
        strip.innerHTML = '<span style="color:#555;font-size:13px;">Enter a sequence and press Play — the note strip appears here.</span>';
        return;
      }
      strip.innerHTML = '';
      parsed.forEach((item, i) => {
        const card = document.createElement('div');
        card.id = 'nc-' + i;
        if (i === parsed.length - 1) card.classList.add('end-card');

        if (item && item.type === 'section') {
          card.className = 'note-card';
          card.style.cssText = 'background:#1a3a1a; border-color:#2a6a2a; min-width:80px; justify-content:center;';
          card.innerHTML = `<span class="nc-name" style="color:#4caf50; font-size:11px;">[${item.label}]</span><span class="nc-dur" style="color:#555;">rest</span>`;
          card.addEventListener('click', () => startPlaybackFrom(lastParsed, i));
        } else {
          const noteStr = item && typeof item === 'object' ? item.note : item;
          const beats   = item && typeof item === 'object' ? item.beats : 1;
          const lyric   = (item && item.lyric) || '';
          card.className = 'note-card';
          const durLabel = DUR_LABELS[beats] || beats + 'b';
          const lyricSpan = lyric ? `<span class="nc-lyric">${lyric}</span>` : '';
          card.innerHTML = `<span class="nc-name">${noteStr}</span><span class="nc-dur">${durLabel}</span>${lyricSpan}`;
          card.addEventListener('click', () => startPlaybackFrom(lastParsed, i));
        }
        strip.appendChild(card);
      });
    }

    function stopStripPlayback() {
      loopFadeGen++;           // cancels any pending doFadeLoop callback
      remainingRepeats = 0;
      // restore gain immediately
      const sliderVol = parseFloat(document.getElementById('volumeSlider').value);
      masterGain.gain.cancelScheduledValues(audioCtx.currentTime);
      masterGain.gain.setValueAtTime(sliderVol, audioCtx.currentTime);
      // restore audio element volume if it was mid-fade
      const audioEl = document.getElementById('audioPlayer');
      if (audioEl && audioEl.volume < 0.99) audioEl.volume = 1;
      allTimers.forEach(clearTimeout);
      allTimers = [];
      activeSources.forEach(s => { try { s.stop(0); } catch(e) {} });
      activeSources = [];
      document.querySelectorAll('.note-card.playing').forEach(c => c.classList.remove('playing'));
      if (window.staffMark) window.staffMark(-1);
      if (window.staffMarkBass) window.staffMarkBass(-1);
      document.getElementById('stopStripBtn').style.display = 'none';
    }

    // Plays the treble list and (if the bass box is open) the bass list from one clock. startTick, when given,
    // is the moment to start from (so a click on either staff starts both voices together); otherwise the
    // start of treble note startIdx.
    function startPlaybackFrom(parsed, startIdx, startTick) {
      stopStripPlayback();
      const bass = lastBass;
      if (!parsed.length && !bass.length) return;
      if ((startIdx === 0 && startTick == null) || startTick === 0) {
        // instant jump — #noteStrip has scroll-behavior:smooth in CSS, which would
        // otherwise animate this reset and lag behind the first note's audio
        const strip = document.getElementById('noteStrip');
        strip.style.scrollBehavior = 'auto';
        strip.scrollLeft = 0;
        strip.style.scrollBehavior = '';
      }
      document.getElementById('stopStripBtn').style.display = '';

      const bpm = parseFloat(document.getElementById('bpmInput').value) || 100;
      const msPerBeat = 60000 / bpm;

      const timeline = list => {
        let t = 0;
        return list.map(item => {
          const beats = item && typeof item === 'object' ? item.beats : 1;
          const e = { item, beats, tick: t };
          t += toTicks(beats);
          return e;
        });
      };
      const endTick = tl => tl.length ? tl[tl.length - 1].tick + toTicks(tl[tl.length - 1].beats) : 0;
      const tlT = timeline(parsed), tlB = timeline(bass);
      const from = startTick != null ? startTick : (tlT[startIdx] ? tlT[startIdx].tick : 0);
      const at = tick => (tick - from) * msPerBeat / TICKS_PER_BEAT;

      tlT.forEach((e, i) => {
        if (e.tick < from) return;
        const item = e.item;
        const isSection = item && item.type === 'section';
        const noteStr = isSection ? '_' : (item && typeof item === 'object' ? item.note : item);
        const durSec = (msPerBeat * e.beats) / 1000;

        allTimers.push(setTimeout(() => {
          document.querySelectorAll('.note-card.playing').forEach(c => c.classList.remove('playing'));
          const card = document.getElementById('nc-' + i);
          if (card) {
            card.classList.add('playing');
            card.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
          }
          if (window.staffMark) window.staffMark(i);
          if (!isSection) playNoteByChar(noteStr, durSec);
        }, at(e.tick)));
      });

      tlB.forEach((e, j) => {
        if (e.tick < from) return;
        const noteStr = e.item && typeof e.item === 'object' ? e.item.note : e.item;
        const durSec = (msPerBeat * e.beats) / 1000;
        allTimers.push(setTimeout(() => {
          if (window.staffMarkBass) window.staffMarkBass(j);
          playNoteByChar(noteStr, durSec, 0.7);   // the left hand sits a little under the melody
        }, at(e.tick)));
      });

      allTimers.push(setTimeout(() => {
        if (remainingRepeats > 0) {
          remainingRepeats--;
          doFadeLoop();   // fade out → restart → fade in
        } else {
          stopStripPlayback();
        }
      }, at(Math.max(endTick(tlT), endTick(tlB)))));
    }

    // Parse a sequence of notes.
    // Supports three token formats (comma-delimited):
    //   lyric:note:beats  →  { lyric, note, beats }   e.g. "do:C4:1"
    //   note:beats        →  { note, beats }           e.g. "C4:2"
    //   note              →  { note, beats:1 }         e.g. "C4"
    // Two-colon format lets a single file carry both melody and lyrics.
    // A chord joins its notes with "+" (E3+G3+B3:1) and "*N" after a token repeats it N times.
    function parseNoteSequence(inputString) {
      const result = [];

      // Process line by line to detect section headers like [verse1] or [chorus]
      const lines = inputString.split('\n').map(l => l.trim()).filter(Boolean);
      const noteLines = [];
      for (const line of lines) {
        if (/^\[.+\]$/.test(line)) {
          // Flush any accumulated note lines first
          flushNoteLines();
          result.push({ type: 'section', label: line.slice(1, -1), beats: 1 });
        } else {
          noteLines.push(line);
        }
      }
      flushNoteLines();
      return result;

      // Comma format is parsed one line at a time: the first note of every line after the first is marked
      // barBefore (the reader writes one bar per line), so the staff can draw bar lines where the PDF has them.
      function flushNoteLines() {
        if (!noteLines.length) return;
        const joined = noteLines.join(',').replace(/,+/g, ',');
        if (joined.includes(',')) {
          noteLines.forEach((l, k) => {
            const items = parseNoteTokens(l.replace(/,+\s*$/, '') + ',');
            if (k > 0 && items.length) items[0].barBefore = true;
            result.push(...items);
          });
        } else {
          result.push(...parseNoteTokens(joined));
        }
        noteLines.length = 0;
      }
    }

    function parseNoteTokens(inputString) {
      if (inputString.includes(',')) {
        return inputString.split(',').flatMap(item => {
          item = item.trim();
          if (item === '') return [];
          // trailing "*8" repeats the token: "E3+G3+B3:0.5*8" is eight eighth-note chords
          let times = 1;
          const rm = /\*(\d+)$/.exec(item);
          if (rm) { times = Math.min(parseInt(rm[1], 10) || 1, 999); item = item.slice(0, rm.index).trim(); }
          const parts = item.split(':');
          let ev;
          if (parts.length >= 3) {
            // lyric:note:beats
            ev = { lyric: parts[0].trim(), note: parts[1].trim(), beats: parseFloat(parts[2]) || 1 };
          } else if (parts.length === 2) {
            ev = { note: parts[0].trim(), beats: parseFloat(parts[1]) || 1 };
          } else {
            ev = { note: item, beats: 1 };
          }
          return Array.from({ length: times }, () => ({ ...ev }));
        });
      }
      
      // Original parsing for space-separated or continuous format
      const result = [];
      let i = 0;
      
      while (i < inputString.length) {
        // Skip spaces
        if (inputString[i] === ' ') {
          i++;
          continue;
        }
        
        // Check for rest
        if (inputString[i] === '_') {
          result.push('_');
          i++;
          continue;
        }
        
        // Check for note name followed by # or b and optional octave number
        if (i + 1 < inputString.length && "CDEFGAB".includes(inputString[i].toUpperCase())) {
          if ("#B".includes(inputString[i+1].toUpperCase())) {
            // We have a sharp/flat note
            if (i + 2 < inputString.length && "0123456789".includes(inputString[i+2])) {
              // We have an octave number too
              result.push(inputString.slice(i, i+3));
              i += 3;
            } else {
              // Just a sharp/flat note
              result.push(inputString.slice(i, i+2));
              i += 2;
            }
          } else if ("0123456789".includes(inputString[i+1])) {
            // Just a note with octave number
            result.push(inputString.slice(i, i+2));
            i += 2;
          } else {
            // Just a regular note
            result.push(inputString[i]);
            i++;
          }
        } else {
          // Regular character
          result.push(inputString[i]);
          i++;
        }
      }

      return result;
    }  // end parseNoteTokens

    const VOICE_SPLIT = /^[ \t]*={3,}[ \t]*$/m;

    // ---- audio 5× repeat ----
    let audioRepeatRemaining = 0;

    function startAudioRepeat5() {
      const audioEl = document.getElementById('audioPlayer');
      if (!audioEl.src) return;

      // cancel any running repeat
      audioRepeatGen++;
      if (_audioRepeatHandler) {
        audioEl.removeEventListener('ended', _audioRepeatHandler);
        _audioRepeatHandler = null;
      }

      const gen = audioRepeatGen;
      audioRepeatRemaining = 4; // 4 more after first play = 5 total

      const savedVol = audioEl.volume || 1;
      audioEl.currentTime = 0;
      audioEl.play();

      _audioRepeatHandler = function handleRepeatEnded() {
        if (audioRepeatGen !== gen) {
          audioEl.removeEventListener('ended', _audioRepeatHandler);
          _audioRepeatHandler = null;
          return;
        }
        if (audioRepeatRemaining > 0) {
          audioRepeatRemaining--;
          audioEl.volume = 0;
          audioEl.currentTime = 0;
          audioEl.play();
          fadeAudioElTo(audioEl, savedVol, LOOP_FADE_IN_MS);

    // ── Dropbox integration ────────────────────────────────────────────────
    (function () {
      let dropboxAccessToken = null;
      let dropboxAppKey = '';
      const IS_LOCALHOST = ['localhost', '127.0.0.1'].includes(window.location.hostname);
      const DBX_LAST_PATH_KEY = 'piano-dbx-last-path';
      const DBX_FOLDER_PRESETS = { 'Piano': '/piano' };

      function generateCodeVerifier() {
        const a = new Uint8Array(64);
        crypto.getRandomValues(a);
        return btoa(String.fromCharCode(...a)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
      }
      async function generateCodeChallenge(v) {
        const digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(v));
        return btoa(String.fromCharCode(...new Uint8Array(digest))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
      }
      async function fetchAppKey() {
        if (IS_LOCALHOST) return localStorage.getItem('dropbox-app-key') || '';
        try { const r = await fetch('/api/dropbox-key'); return (await r.json()).key || ''; } catch { return ''; }
      }

      async function dropboxSignInPopup(onSuccess) {
        let appKey;
        if (IS_LOCALHOST) {
          appKey = localStorage.getItem('dropbox-app-key') || prompt('Enter your Dropbox App Key:');
          if (!appKey) return;
          localStorage.setItem('dropbox-app-key', appKey);
        } else {
          appKey = await fetchAppKey();
          if (!appKey) { alert('Dropbox App Key not configured'); return; }
        }
        dropboxAppKey = appKey;
        const verifier  = generateCodeVerifier();
        const challenge = await generateCodeChallenge(verifier);
        localStorage.setItem('dropbox_code_verifier', verifier);
        const redirectUri = window.location.origin + window.location.pathname;
        const authUrl = 'https://www.dropbox.com/oauth2/authorize'
          + '?client_id=' + appKey + '&response_type=code'
          + '&code_challenge=' + challenge + '&code_challenge_method=S256'
          + '&redirect_uri=' + encodeURIComponent(redirectUri) + '&token_access_type=online';
        const w = 600, h = 700;
        window.open(authUrl, 'dropbox-auth',
          `width=${w},height=${h},left=${Math.round(window.screenX+(window.outerWidth-w)/2)},top=${Math.round(window.screenY+(window.outerHeight-h)/2)}`);
        function handler(e) {
          if (e.origin !== window.location.origin) return;
          if (!e.data || e.data.type !== 'dropbox-token') return;
          dropboxAccessToken = e.data.token;
          window.removeEventListener('message', handler);
          if (onSuccess) onSuccess();
        }
        window.addEventListener('message', handler);
      }

      async function handleOAuthRedirect() {
        const params = new URLSearchParams(window.location.search);
        const code = params.get('code');
        if (!code) return;
        const verifier = sessionStorage.getItem('dropbox_code_verifier') || localStorage.getItem('dropbox_code_verifier');
        const appKey = await fetchAppKey();
        if (!verifier || !appKey) return;
        const redirectUri = window.location.origin + window.location.pathname;
        try {
          const res = await fetch('https://api.dropboxapi.com/oauth2/token', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: new URLSearchParams({ code, grant_type:'authorization_code', client_id:appKey, redirect_uri:redirectUri, code_verifier:verifier }).toString(),
          });
          const data = await res.json();
          if (data.access_token) {
            sessionStorage.removeItem('dropbox_code_verifier');
            localStorage.removeItem('dropbox_code_verifier');
            if (window.opener && !window.opener.closed) {
              window.opener.postMessage({ type:'dropbox-token', token:data.access_token }, window.location.origin);
              window.close(); return;
            }
            dropboxAccessToken = data.access_token;
            window.history.replaceState({}, document.title, window.location.pathname);
          }
        } catch(err) {
          if (window.opener && !window.opener.closed) window.close();
        }
      }
      handleOAuthRedirect();

      window.getDropboxAccessToken = () => dropboxAccessToken;
      window.dropboxSignInPopup    = dropboxSignInPopup;

      // Headers must be ISO-8859-1; escape non-ASCII chars in the JSON value
      function dbxArg(obj) {
        return JSON.stringify(obj).replace(/[^\x00-\x7F]/g, c =>
          '\\u' + c.charCodeAt(0).toString(16).padStart(4, '0')
        );
      }

      window.dropboxDownloadText = async function(path) {
        const res = await fetch('https://content.dropboxapi.com/2/files/download', {
          method: 'POST',
          headers: { Authorization:'Bearer '+dropboxAccessToken, 'Dropbox-API-Arg':dbxArg({path}) },
        });
        if (!res.ok) throw new Error('Download failed ('+res.status+')');
        return res.text();
      };
      window.dropboxDownloadBlob = async function(path) {
        const res = await fetch('https://content.dropboxapi.com/2/files/download', {
          method: 'POST',
          headers: { Authorization:'Bearer '+dropboxAccessToken, 'Dropbox-API-Arg':dbxArg({path}) },
        });
        if (!res.ok) throw new Error('Download failed ('+res.status+')');
        return res.blob();
      };
      window.dropboxListFolder = async function(path) {
        const normPath = (!path || path === '/') ? '' : ('/'+path.replace(/^\/+|\/+$/g,''));
        const res = await fetch('https://api.dropboxapi.com/2/files/list_folder', {
          method: 'POST',
          headers: { Authorization:'Bearer '+dropboxAccessToken, 'Content-Type':'application/json' },
          body: JSON.stringify({path: normPath}),
        });
        if (!res.ok) throw new Error('List folder failed ('+res.status+')');
        return res.json();
      };

      // Modal open/close
      window.DBX_START_PATH = '/songs/suno_enhanced_songs_piano_index';
      window.openDbxModal = function(startPath) {
        document.getElementById('dbxOverlay').classList.add('open');
        const token = window.getDropboxAccessToken && window.getDropboxAccessToken();
        if (!token) {
          document.getElementById('dbxList').innerHTML =
            '<button class="dbx-signin-btn" onclick="(async()=>{await window.dropboxSignInPopup(()=>dbxBrowse(window.DBX_START_PATH));})()">Sign in with Dropbox</button>';
          document.getElementById('dbxStatus').textContent = 'Not signed in';
          return;
        }
        dbxBrowse(startPath || window.DBX_START_PATH);
      };
      window.closeDbxModal = function() {
        document.getElementById('dbxOverlay').classList.remove('open');
      };

      const DBX_IMAGE_EXT = new Set(['.jpg','.jpeg','.png','.gif','.webp','.bmp']);
      const DBX_AUDIO_EXT = new Set(['.mp3','.wav','.m4a','.ogg','.flac','.aac']);
      const DBX_TEXT_EXT  = new Set(['.txt']);

      window.dbxBrowse = async function(path) {
        const token = window.getDropboxAccessToken && window.getDropboxAccessToken();
        if (!token) { window.openDbxModal(); return; }
        const goBtn = document.getElementById('dbxGoBtn');
        goBtn.disabled = true;
        document.getElementById('dbxStatus').textContent = 'Loading…';
        document.getElementById('dbxList').innerHTML = '';
        const normPath = (!path || path === '/') ? '' : ('/'+path.replace(/^\/+|\/+$/g,''));
        document.getElementById('dbxPathInput').value = normPath || '/';
        localStorage.setItem(DBX_LAST_PATH_KEY, normPath || '/');
        try {
          const data = await window.dropboxListFolder(normPath || '');
          const entries = (data.entries || [])
            .map(e => ({ name:e.name, path:e.path_lower||e.path_display, isFolder:e['.tag']==='folder' }))
            .filter(e => {
              if (e.isFolder) return true;
              const ext = e.name.slice(e.name.lastIndexOf('.')).toLowerCase();
              return DBX_IMAGE_EXT.has(ext) || DBX_AUDIO_EXT.has(ext) || DBX_TEXT_EXT.has(ext);
            })
            .sort((a,b) => {
              if (a.isFolder !== b.isFolder) return a.isFolder ? -1 : 1;
              return a.name.localeCompare(b.name, undefined, {numeric:true});
            });
          const nFolders = entries.filter(e=>e.isFolder).length;
          const nFiles   = entries.filter(e=>!e.isFolder).length;
          document.getElementById('dbxStatus').textContent = `${nFolders} folders · ${nFiles} files`;
          dbxRenderBreadcrumb(normPath);
          dbxRenderList(entries);
        } catch(err) {
          document.getElementById('dbxStatus').textContent = 'Error: '+err.message;
        } finally { goBtn.disabled = false; }
      };

      function dbxRenderBreadcrumb(path) {
        const el = document.getElementById('dbxBreadcrumb');
        if (!path) { el.innerHTML = ''; return; }
        const parts = path.replace(/^\//,'').split('/').filter(Boolean);
        let html = '<span style="color:#444">▸</span>';
        parts.forEach((part,i) => {
          const crumbPath = '/'+parts.slice(0,i+1).join('/');
          html += `<span style="color:#444"> / </span><button class="dbx-crumb" onclick="dbxBrowse('${crumbPath}')">${part}</button>`;
        });
        el.innerHTML = html;
      }

      function dbxRenderList(entries) {
        const list = document.getElementById('dbxList');
        if (!entries.length) {
          list.innerHTML = '<div style="color:#555;padding:24px;text-align:center">No image or text files found</div>';
          return;
        }
        list.innerHTML = entries.map(e => {
          if (e.isFolder) {
            const p = e.path.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
            return `<div class="dbx-item" onclick="dbxBrowse('${p}')"><span class="dbx-icon">📁</span><span class="dbx-name">${e.name}</span></div>`;
          }
          const ext = e.name.slice(e.name.lastIndexOf('.')).toLowerCase();
          const isImg   = DBX_IMAGE_EXT.has(ext);
          const isAudio = DBX_AUDIO_EXT.has(ext);
          const icon  = isImg ? '🖼️' : isAudio ? '🎵' : '📄';
          const label = isImg ? 'Image' : isAudio ? 'Audio' : 'Load';
          const fileType = isImg ? 'image' : isAudio ? 'audio' : 'text';
          const p = e.path.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
          const n = e.name.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
          return `<div class="dbx-item">
            <span class="dbx-icon">${icon}</span>
            <span class="dbx-name">${e.name}</span>
            <button class="dbx-action" onclick="dbxLoadFile('${p}','${n}','${fileType}')">${label}</button>
          </div>`;
        }).join('');
      }

      window.dbxLoadFile = async function(path, name, fileType) {
        try {
          if (fileType === 'image') {
            const blob = await window.dropboxDownloadBlob(path);
            const img  = document.getElementById('imagePreview');
            img.src = URL.createObjectURL(blob);
            img.style.maxHeight = '180px';
            imageSizeState = 'small';
            document.getElementById('imagePreviewContainer').style.display = 'block';
            document.getElementById('loadImageBtn').textContent = name;
            window.closeDbxModal();
          } else if (fileType === 'audio') {
            const blob  = await window.dropboxDownloadBlob(path);
            const audio = document.getElementById('audioPlayer');
            audio.src = URL.createObjectURL(blob);
            document.getElementById('audioPlayerContainer').style.display = 'block';
            document.getElementById('loadAudioBtn').textContent = name;
            window.closeDbxModal();
          } else {
            const text = await window.dropboxDownloadText(path);
            const split = window.loadVoices(text);
            document.getElementById('dbxStatus').textContent = '✅ '+name+' loaded'+(split ? ' (top + bass)' : '')+' — pick an image or close';
            closeAudioPlayer();
          }
        } catch(err) {
          document.getElementById('dbxStatus').textContent = 'Error: '+err.message;
        }
      };

      const dbxPresetSelect = document.getElementById('dbxPresetSelect');
      Object.entries(DBX_FOLDER_PRESETS).forEach(([label, path]) => {
        const opt = document.createElement('option');
        opt.value = path;
        opt.textContent = label;
        dbxPresetSelect.appendChild(opt);
      });

      document.getElementById('dbxOverlay').addEventListener('click', e => {
        if (e.target === document.getElementById('dbxOverlay')) window.closeDbxModal();
      });
      document.getElementById('dbxPathInput').addEventListener('keydown', e => {
        if (e.key === 'Enter') window.dbxBrowse(e.target.value);
      });
    })();

    // ── Sync Start ──────────────────────────────────────────────────────────
    (function(){
      let bc;
      try { bc = new BroadcastChannel('piano-beats-sync'); } catch(e) { bc = null; }

      const syncSelect   = document.getElementById('syncSelect');
      const syncStatus   = document.getElementById('syncStatus');
      const clockBtn     = document.getElementById('clockBtn');
      const clockDisplay = document.getElementById('clockDisplay');

      let syncWatcher = null;

      function fmt(d) {
        return [d.getHours(), d.getMinutes(), d.getSeconds()]
          .map(n => String(n).padStart(2,'0')).join(':');
      }

      function getNextHalfMarks(count) {
        const marks = [];
        const now = new Date();
        const next = new Date(now);
        next.setMilliseconds(0);
        const s = next.getSeconds();
        if (s < 30) { next.setSeconds(30); }
        else { next.setSeconds(0); next.setMinutes(next.getMinutes() + 1); }
        for (let i = 0; i < count; i++) {
          marks.push(new Date(next));
          next.setSeconds(next.getSeconds() + 30);
        }
        return marks;
      }

      function cancelSync() {
        if (syncWatcher) { clearInterval(syncWatcher); syncWatcher = null; }
        syncSelect.style.color = '#aaa';
        syncStatus.textContent = '—';
        syncSelect.value = '';
      }

      function armAt(targetMs, broadcast) {
        cancelSync();
        if (broadcast && bc) bc.postMessage({ type: 'sync-start', targetMs });
        syncStatus.textContent = 'fires ' + fmt(new Date(targetMs));
        syncSelect.style.color = '#f0c060';
        syncWatcher = setInterval(() => {
          if (Date.now() >= targetMs) {
            clearInterval(syncWatcher); syncWatcher = null;
            syncSelect.style.color = '#aaa';
            syncStatus.textContent = '▶ fired :' + String(new Date().getSeconds()).padStart(2,'0');
            document.getElementById('playSequence').click();
          }
        }, 250);
      }

      syncSelect.addEventListener('mousedown', () => {
        syncSelect.innerHTML = '<option value="">⏱ Sync…</option>';
        getNextHalfMarks(3).forEach(m => {
          const o = document.createElement('option');
          o.value = m.getTime(); o.textContent = fmt(m);
          syncSelect.appendChild(o);
        });
        const cancel = document.createElement('option');
        cancel.value = 'cancel'; cancel.textContent = '— cancel —';
        syncSelect.appendChild(cancel);
      });

      syncSelect.addEventListener('change', () => {
        if (!syncSelect.value) return;
        if (syncSelect.value === 'cancel') {
          cancelSync();
          if (bc) bc.postMessage({ type: 'sync-cancel' });
          return;
        }
        armAt(+syncSelect.value, true);
      });

      clockBtn.addEventListener('click', () => {
        clockDisplay.textContent = fmt(new Date());
      });

      if (bc) bc.onmessage = (e) => {
        if (!e.data) return;
        if (e.data.type === 'sync-start') armAt(e.data.targetMs, false);
        if (e.data.type === 'sync-cancel') cancelSync();
      };
    })();
  </script>
</body>
