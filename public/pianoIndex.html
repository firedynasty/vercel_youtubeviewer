<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>JavaScript Piano</title>
    

  </head>
    
  <body>
  <html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JS Piano with Sequence Input</title>
  <style>
    html {
      background: #000;
      font-family: 'Noto Serif', serif;
      -webkit-font-smoothing: antialiased;
      text-align: center;
    }

    body {
      margin: 0;
      padding: 0;
    }

    video#bgvid { 
      position: fixed;
      top: 50%;
      left: 50%;
      min-width: 100%;
      min-height: 100%;
      width: auto;
      height: auto;
      z-index: -100;
      transform: translateX(-50%) translateY(-50%);
      background-size: cover; 
    }

    header {
      position: relative;
      margin: 30px 0;
    }

    header:after {
      content: '';
      width: 460px;
      height: 15px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
      display: inline-block;
      text-align: center;
    }

    h1 {
      color: #fff;
      font-size: 50px;
      font-weight: 400;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin: 0;
    }

    h2 {
      color: #fff;
      font-size: 24px;
      font-style: italic;
      font-weight: 400;
      margin: 0 0 30px;
    }

    .nowplaying {
      font-size: 120px;
      line-height: 1;
      color: #eee;
      text-shadow: 0 0 5rem #028ae9;
      transition: all .07s ease;
      min-height: 120px;
    }

    .keys {
      display: block;
      width: 100%;
      height: 160px;
      position: relative;
    }

    .key {
      position: relative;
      border: 4px solid black;
      border-radius: .5rem;
      transition: all .07s ease;
      display: block;
      box-sizing: border-box;
      z-index: 2;
    }

    .key:not(.sharp) {
      float: left;
      height: 100%;
      background: rgba(255, 255, 255, .8);
    }

    .key.sharp {
      position: absolute;
      width: 6%;
      height: 60%;
      background: #000;
      color: #eee;
      top: 0;
      z-index: 3;
    }

    .playing {
      transform: scale(.95);
      border-color: #028ae9;
      box-shadow: 0 0 1rem #028ae9;
    }

    .hints {
      display: block;
      width: 100%;
      opacity: 1;
      position: absolute;
      bottom: 7px;
      font-size: 13px;
      color: #333;
      pointer-events: none;
    }

    .key.sharp .hints {
      color: #eee;
    }

    .keys-wrap {
      max-width: 880px;
      margin: 30px auto 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* Sequence input styles */
    .sequence-container {
      margin: 30px auto;
      max-width: 805px;
      width: 100%;
      text-align: left; /* Left-align all content in the container */
    }

    .sequence-input {
      background: rgba(255, 255, 255, 0.07);
      border: 2px solid #028ae9;
      padding: 10px 15px;
      font-size: 14px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      border-radius: 4px;
      width: 100%;
      color: #eee;
      resize: vertical;
      min-height: 100px;
      line-height: 1.6;
      box-sizing: border-box;
    }
    .sequence-input::placeholder { color: #555; }

    .play-btn {
      background: #028ae9;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 18px;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .play-btn:hover {
      background: #0279d0;
    }

    .input-container {
      margin-bottom: 15px;
    }

    /* Dropbox modal */
    .dbx-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .dbx-overlay.open { display: flex; }
    .dbx-box {
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 12px;
      width: min(520px, 94vw);
      max-height: 75vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .dbx-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid #2a2a2a;
      color: #eee;
      font-size: 14px;
      font-weight: 600;
    }
    .dbx-close {
      background: none;
      border: none;
      color: #888;
      font-size: 20px;
      cursor: pointer;
      line-height: 1;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .dbx-close:hover { background: #2a2a2a; color: #ccc; }
    .dbx-toolbar {
      padding: 10px 14px;
      border-bottom: 1px solid #222;
      display: flex;
      gap: 8px;
    }
    .dbx-path-input {
      flex: 1;
      background: #111;
      border: 1px solid #3a3a3a;
      border-radius: 6px;
      color: #ddd;
      font-size: 13px;
      padding: 6px 10px;
      font-family: monospace;
    }
    .dbx-path-input:focus { outline: none; border-color: #0061ff; }
    .dbx-go-btn {
      background: #2a2a2a;
      border: 1px solid #3a3a3a;
      border-radius: 6px;
      color: #ccc;
      font-size: 13px;
      padding: 6px 14px;
      cursor: pointer;
    }
    .dbx-go-btn:hover { background: #333; color: #fff; }
    .dbx-go-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .dbx-breadcrumb {
      padding: 5px 16px;
      font-size: 12px;
      color: #555;
      min-height: 26px;
      display: flex;
      align-items: center;
      gap: 2px;
      flex-wrap: wrap;
    }
    .dbx-crumb {
      background: none;
      border: none;
      color: #4a9eff;
      cursor: pointer;
      font-size: 12px;
      padding: 1px 3px;
      border-radius: 3px;
    }
    .dbx-status {
      padding: 3px 16px 5px;
      font-size: 12px;
      color: #555;
      min-height: 22px;
    }
    .dbx-list { flex: 1; overflow-y: auto; }
    .dbx-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      border-bottom: 1px solid #1a1a1a;
      cursor: pointer;
    }
    .dbx-item:hover { background: #222; }
    .dbx-icon { font-size: 15px; flex-shrink: 0; }
    .dbx-name {
      flex: 1;
      font-size: 13px;
      color: #ddd;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .dbx-action {
      background: linear-gradient(45deg, #0061ff, #004bb5);
      border: none;
      border-radius: 5px;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 12px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .dbx-action:hover { opacity: 0.85; }
    .dbx-signin-btn {
      background: linear-gradient(45deg, #0061ff, #004bb5);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      padding: 12px 28px;
      cursor: pointer;
      display: block;
      margin: 48px auto 0;
    }

    /* ---- note strip ---- */
    #noteStrip {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 10px 0 14px;
      scroll-behavior: smooth;
      min-height: 80px;
      align-items: flex-end;
    }
    .note-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 46px;
      padding: 8px 6px 6px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(255,255,255,.07);
      flex-shrink: 0;
      transition: background .07s, transform .07s, border-color .07s;
      cursor: pointer;
    }
    .note-card:hover { background: rgba(255,255,255,.14); border-color: rgba(255,255,255,.35); }
    .note-card.end-card {
      border-width: 3px;
      padding: 6px 4px 4px; /* offset thicker border so card size matches the rest */
    }
    .note-card.playing {
      background: #028ae9;
      border-color: #028ae9;
      transform: scale(1.13) translateY(-5px);
      box-shadow: 0 4px 16px rgba(2,138,233,.55);
    }
    .nc-name  { font-size: 14px; font-weight: 700; color: #ddd; }
    .nc-dur   { font-size: 10px; color: #666; margin-top: 1px; }
    .nc-lyric { font-size: 12px; color: #aaa; margin-top: 5px; white-space: nowrap; }
    .note-card.playing .nc-name,
    .note-card.playing .nc-dur,
    .note-card.playing .nc-lyric { color: #fff; }
  </style>
</head>
<body>
  <section id="wrap">
    <header>
      <h1>JS Piano &nbsp;<a href="note_builder.html" target="_blank" style="font-size:14px; color:#028ae9; text-decoration:none; font-weight:400;">Note Builder ↗</a></h1>
    </header>
    <section id="main">

      <!-- Reference image + audio -->
      <div class="sequence-container" style="margin-bottom:0;">
        <button class="play-btn" id="loadImageBtn" onclick="document.getElementById('imageFileInput').click()" style="font-size:15px; margin-bottom:8px; margin-right:8px;">Load image</button>
        <input type="file" id="imageFileInput" accept="image/*" style="display:none;">
        <button class="play-btn" id="loadAudioBtn" onclick="document.getElementById('audioFileInput').click()" style="font-size:15px; margin-bottom:8px; margin-right:8px; background:#1a7a1a;">Load audio</button>
        <input type="file" id="audioFileInput" accept="audio/*" style="display:none;">
        <button class="play-btn" id="audioRepeatBtn" onclick="startAudioRepeat5()" style="font-size:15px; margin-bottom:8px; margin-right:8px; background:#1a4a7a;">🔁 5×</button>
        <div id="imagePreviewContainer" style="display:none; position:relative; margin-bottom:10px;">
          <img id="imagePreview" style="max-width:100%; max-height:180px; border-radius:6px; cursor:pointer; display:block;" onclick="toggleImageSize()">
          <button onclick="closeImagePreview()" style="position:absolute; top:4px; right:4px; background:rgba(0,0,0,0.6); color:#fff; border:none; border-radius:50%; width:26px; height:26px; cursor:pointer; font-size:17px; line-height:1;">×</button>
        </div>
        <div id="audioPlayerContainer" style="display:none; position:relative; margin-bottom:10px;">
          <audio id="audioPlayer" controls style="width:100%; border-radius:6px;"></audio>
          <button onclick="closeAudioPlayer()" style="position:absolute; top:4px; right:4px; background:rgba(0,0,0,0.6); color:#fff; border:none; border-radius:50%; width:26px; height:26px; cursor:pointer; font-size:17px; line-height:1;">×</button>
        </div>
      </div>

      <!-- Sequence input -->
      <div class="sequence-container">
        <div class="input-container">
          <textarea class="sequence-input" id="sequenceInput" placeholder="do:D4:1, you:D4:1, hear:E4:1, them:F4:1&#10;next line continues here…"></textarea>
        </div>
        <div style="display:flex; align-items:center; gap:10px; margin-top:8px;">
          <label for="volumeSlider" style="color:#aaa; font-size:14px;">Vol</label>
          <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="1" style="width:160px; accent-color:#028ae9; cursor:pointer;">
        </div>
        <div style="display:flex; align-items:center; gap:10px; margin-top:8px; flex-wrap:wrap;">
          <button class="play-btn" id="playSequence">&#9654; Play</button>
          <button class="play-btn" id="seqRepeatBtn" onclick="toggleSeqRepeat()" style="background:#0e6b3a;">🔁 5× on</button>
          <label style="color:#aaa; font-size:14px;">BPM</label>
          <input type="number" id="bpmInput" value="100" min="40" max="300"
            style="width:58px; padding:6px; border-radius:6px; border:1px solid #333; background:#111; color:#eee; font-size:13px;">
          <input type="number" id="repeatInput" value="5" min="1" max="99" style="display:none;">
          <button class="play-btn" id="stopStripBtn" style="display:none; background:#b3261e;">&#9632; Stop</button>
          <button class="play-btn" onclick="openDbxModal()" style="font-size:15px; background:linear-gradient(45deg,#0061ff,#004bb5);">📂 Dropbox</button>
        </div>
      </div>

      <!-- Note strip -->
      <div class="sequence-container" style="margin-top:8px;">
        <div id="noteStrip"><span style="color:#555; font-size:13px;">Enter a sequence and press Play — the note strip appears here.</span></div>
      </div>

      <!-- Dropbox modal -->
      <div class="dbx-overlay" id="dbxOverlay">
        <div class="dbx-box">
          <div class="dbx-header">
            <span>📂 Dropbox Files</span>
            <button class="dbx-close" onclick="closeDbxModal()">✕</button>
          </div>
          <div class="dbx-toolbar">
            <input class="dbx-path-input" id="dbxPathInput" value="/" placeholder="/ (root)">
            <button class="dbx-go-btn" id="dbxGoBtn" onclick="dbxBrowse(document.getElementById('dbxPathInput').value)">Go</button>
          </div>
          <div class="dbx-breadcrumb" id="dbxBreadcrumb"></div>
          <div class="dbx-status" id="dbxStatus">Not signed in</div>
          <div class="dbx-list" id="dbxList"></div>
        </div>
      </div>

      <div class="keys-wrap">
        <div class="keys" id="keysRow0"></div>
        <div class="keys" id="keysRow1"></div>
        <div class="keys" id="keysRow2"></div>
      </div>
    </section>
  </section>
  <div style="background: #000; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -101;"></div>

  <script>
    // Web Audio API — load all WAVs into buffers for precise duration control
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const audioBuffers = {};
    const SEMI = Math.pow(2, 1/12);

    // note name → { file, rate } — Salamander for bass, original WAVs for treble (C4–E5)
    const NOTE_SOURCES = {
      // Sub-bass row (B1–G#2) — ledger lines below bass clef staff
      'B1':  { file: 'sounds/C2.mp3',  rate: 1 / (SEMI * SEMI) }, // C2 down 2 semitones
      'C2':  { file: 'sounds/C2.mp3',  rate: 1 },
      'C#2': { file: 'sounds/C2.mp3',  rate: SEMI },
      'D2':  { file: 'sounds/Ds2.mp3', rate: 1 / SEMI },
      'D#2': { file: 'sounds/Ds2.mp3', rate: 1 },
      'E2':  { file: 'sounds/Ds2.mp3', rate: SEMI },
      'F2':  { file: 'sounds/Fs2.mp3', rate: 1 / SEMI },
      'F#2': { file: 'sounds/Fs2.mp3', rate: 1 },
      'G2':  { file: 'sounds/Fs2.mp3', rate: SEMI },
      'G#2': { file: 'sounds/A2.mp3',  rate: 1 / SEMI },
      // Bass row (A2–B3)
      'A2':  { file: 'sounds/A2.mp3',  rate: 1 },
      'A#2': { file: 'sounds/A2.mp3',  rate: SEMI },
      'B2':  { file: 'sounds/A2.mp3',  rate: SEMI * SEMI },
      'C3':  { file: 'sounds/C3.mp3',  rate: 1 },
      'C#3': { file: 'sounds/C3.mp3',  rate: SEMI },
      'D3':  { file: 'sounds/Ds3.mp3', rate: 1 / SEMI },
      'D#3': { file: 'sounds/Ds3.mp3', rate: 1 },
      'E3':  { file: 'sounds/Ds3.mp3', rate: SEMI },
      'F3':  { file: 'sounds/Fs3.mp3', rate: 1 / SEMI },
      'F#3': { file: 'sounds/Fs3.mp3', rate: 1 },
      'G3':  { file: 'sounds/Fs3.mp3', rate: SEMI },
      'G#3': { file: 'sounds/A3.mp3',  rate: 1 / SEMI },
      'A3':  { file: 'sounds/A3.mp3',  rate: 1 },
      'A#3': { file: 'sounds/A3.mp3',  rate: SEMI },
      'B3':  { file: 'sounds/A3.mp3',  rate: SEMI * SEMI },
      'C4':  { file: 'sounds/040.wav', rate: 1 },
      'C#4': { file: 'sounds/041.wav', rate: 1 },
      'D4':  { file: 'sounds/042.wav', rate: 1 },
      'D#4': { file: 'sounds/043.wav', rate: 1 },
      'E4':  { file: 'sounds/044.wav', rate: 1 },
      'F4':  { file: 'sounds/045.wav', rate: 1 },
      'F#4': { file: 'sounds/046.wav', rate: 1 },
      'G4':  { file: 'sounds/047.wav', rate: 1 },
      'G#4': { file: 'sounds/048.wav', rate: 1 },
      'A4':  { file: 'sounds/049.wav', rate: 1 },
      'A#4': { file: 'sounds/050.wav', rate: 1 },
      'B4':  { file: 'sounds/051.wav', rate: 1 },
      'C5':  { file: 'sounds/052.wav', rate: 1 },
      'C#5': { file: 'sounds/053.wav', rate: 1 },
      'D5':  { file: 'sounds/054.wav', rate: 1 },
      'D#5': { file: 'sounds/055.wav', rate: 1 },
      'E5':  { file: 'sounds/056.wav', rate: 1 },
    };

    // Load each unique source file once
    const uniqueFiles = [...new Set(Object.values(NOTE_SOURCES).map(s => s.file))];
    (async function loadBuffers() {
      await Promise.all(uniqueFiles.map(async file => {
        try {
          const res = await fetch(file);
          const buf = await res.arrayBuffer();
          audioBuffers[file] = await audioCtx.decodeAudioData(buf);
        } catch(e) { console.warn('Could not load', file, e); }
      }));
    })();

    // Master volume gain — all audio routes through this
    const masterGain = audioCtx.createGain();
    masterGain.gain.value = 1.0;
    masterGain.connect(audioCtx.destination);

    document.getElementById('volumeSlider').addEventListener('input', function() {
      masterGain.gain.value = parseFloat(this.value);
    });

    // Synthetic reverb — decaying white noise impulse response
    function buildReverb(duration = 2.5, decay = 3) {
      const len = audioCtx.sampleRate * duration;
      const ir  = audioCtx.createBuffer(2, len, audioCtx.sampleRate);
      for (let ch = 0; ch < 2; ch++) {
        const d = ir.getChannelData(ch);
        for (let i = 0; i < len; i++)
          d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
      }
      const conv = audioCtx.createConvolver();
      conv.buffer = ir;
      // Wet/dry mix: mostly dry, light reverb tail
      const dry = audioCtx.createGain(); dry.gain.value = 1.0;
      const wet = audioCtx.createGain(); wet.gain.value = 0.25;
      conv.connect(wet);
      wet.connect(masterGain);
      dry.connect(masterGain);
      return { dry, conv };
    }
    let reverbNodes = null;

    function playBuffer(noteName, durationSeconds) {
      const src = NOTE_SOURCES[noteName];
      if (!src) return;
      const buffer = audioBuffers[src.file];
      if (!buffer) { console.warn('Buffer not loaded for', noteName); return; }
      if (audioCtx.state === 'suspended') audioCtx.resume();

      if (!reverbNodes) reverbNodes = buildReverb();

      const source = audioCtx.createBufferSource();
      source.buffer = buffer;
      source.playbackRate.value = src.rate;
      activeSources.push(source);
      source.addEventListener('ended', () => {
        activeSources = activeSources.filter(s => s !== source);
      });

      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(1, audioCtx.currentTime);
      const naturalDur = buffer.duration / src.rate;
      const fadeStart = audioCtx.currentTime + (durationSeconds || naturalDur);
      gain.gain.setTargetAtTime(0, fadeStart, 0.3);

      source.connect(gain);
      gain.connect(reverbNodes.dry);
      gain.connect(reverbNodes.conv);
      source.start(0);
      source.stop(fadeStart + 1.0);
    }

    // Physical keyboard letters → note names (treble row C4–E5)
    const keyToNote = {
      'A': 'C4', 'W': 'C#4', 'S': 'D4', 'E': 'D#4', 'D': 'E4',
      'F': 'F4', 'T': 'F#4', 'G': 'G4', 'Y': 'G#4', 'H': 'A4',
      'U': 'A#4', 'J': 'B4', 'K': 'C5', 'O': 'C#5', 'L': 'D5',
      'P': 'D#5', ';': 'E5'
    };

    // Resolve a typed note string (e.g. "D", "C#", "Eb", "G3", "A#2") → canonical key in NOTE_SOURCES
    const FLAT_TO_SHARP = { CB:'B', DB:'C#', EB:'D#', FB:'E', GB:'F#', AB:'G#', BB:'A#' };
    function resolveNote(raw) {
      if (!raw) return null;
      const s = raw.trim().toUpperCase();
      const m = s.match(/^([A-G])(#|B)?(\d)?$/);
      if (!m) return null;
      const [, root, acc, oct] = m;
      let base;
      if (acc === 'B') {
        base = FLAT_TO_SHARP[root + 'B'] || root;
      } else {
        base = root + (acc === '#' ? '#' : '');
      }
      const canonical = base + (oct || '4');
      return NOTE_SOURCES[canonical] ? canonical : null;
    }

    function buildPianoRow(containerId, notesArray) {
      const container = document.getElementById(containerId);
      if (!container) return;
      const whiteNotes = notesArray.filter(n => !n.includes('#'));
      const whiteWidth = 100 / whiteNotes.length;
      const blackWidth = whiteWidth * 0.6;
      let whiteIndex = 0;
      notesArray.forEach(n => {
        const div = document.createElement('div');
        div.dataset.note = n;
        div.innerHTML = `<span class="hints">${n}</span>`;
        if (!n.includes('#')) {
          div.className = 'key';
          div.style.width = whiteWidth + '%';
          container.appendChild(div);
          whiteIndex++;
        } else {
          div.className = 'key sharp';
          div.style.width = blackWidth + '%';
          div.style.left = (whiteIndex * whiteWidth - blackWidth / 2) + '%';
          container.appendChild(div);
        }
        div.addEventListener('click', () => triggerNote(n));
        div.addEventListener('transitionend', function(e) {
          if (e.propertyName === 'transform') div.classList.remove('playing');
        });
      });
    }

    const row0Notes = ['B1','C2','C#2','D2','D#2','E2','F2','F#2','G2','G#2'];
    const row1Notes = ['A2','A#2','B2','C3','C#3','D3','D#3','E3','F3','F#3','G3','G#3','A3','A#3','B3'];
    const row2Notes = ['C4','C#4','D4','D#4','E4','F4','F#4','G4','G#4','A4','A#4','B4','C5','C#5','D5','D#5','E5'];
    buildPianoRow('keysRow0', row0Notes);
    buildPianoRow('keysRow1', row1Notes);
    buildPianoRow('keysRow2', row2Notes);

    // Live keyboard → treble row (skip when typing in inputs)
    window.addEventListener('keydown', function(e) {
      if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
      const n = keyToNote[e.key.toUpperCase()] || keyToNote[e.key];
      if (n) triggerNote(n);
    });

    function triggerNote(noteName, durationSeconds) {
      const key = document.querySelector(`.key[data-note="${noteName}"]`);
      if (key) key.classList.add('playing');
      playBuffer(noteName, durationSeconds);
    }

    const sequenceInput = document.getElementById("sequenceInput"),
          playSequenceBtn = document.getElementById("playSequence");

    // ---- note strip ----
    const DUR_LABELS = {0.5:'♪',1:'♩',1.5:'♩.',2:'𝅗𝅥',3:'𝅗𝅥.',4:'○'};
    let allTimers = [];
    let activeSources = [];
    let lastParsed = [];
    let remainingRepeats = 0;

    // ---- fade-loop helpers (mirrors bach-player pattern) ----
    const LOOP_FADE_OUT_MS = 800;
    const LOOP_FADE_IN_MS  = 600;
    let loopFadeGen = 0;

    function fadeGainTo(target, durationMs) {
      masterGain.gain.cancelScheduledValues(audioCtx.currentTime);
      masterGain.gain.setValueAtTime(masterGain.gain.value, audioCtx.currentTime);
      masterGain.gain.linearRampToValueAtTime(target, audioCtx.currentTime + durationMs / 1000);
    }

    function fadeAudioElTo(el, target, durationMs) {
      if (!el || !el.src || el.paused) return;
      const start = el.volume;
      const steps = 20;
      const stepMs = durationMs / steps;
      let i = 0;
      const iv = setInterval(() => {
        i++;
        el.volume = Math.min(1, Math.max(0, start + (target - start) * (i / steps)));
        if (i >= steps) clearInterval(iv);
      }, stepMs);
    }

    function doFadeLoop() {
      document.querySelectorAll('.note-card.playing').forEach(c => c.classList.remove('playing'));
      const gen = ++loopFadeGen;
      const sliderVol = parseFloat(document.getElementById('volumeSlider').value);
      const audioEl = document.getElementById('audioPlayer');
      const audioVol = audioEl.volume;
      fadeGainTo(0, LOOP_FADE_OUT_MS);
      fadeAudioElTo(audioEl, 0, LOOP_FADE_OUT_MS);
      setTimeout(() => {
        if (loopFadeGen !== gen) return;
        // save repeat count — startPlaybackFrom→stopStripPlayback resets it to 0
        const reps = remainingRepeats;
        if (audioEl.src && !audioEl.paused) audioEl.currentTime = 0;
        startPlaybackFrom(lastParsed, 0);
        remainingRepeats = reps; // restore after stopStripPlayback wiped it
        // stopStripPlayback also snaps gain back to full, so force 0 → fade in
        masterGain.gain.cancelScheduledValues(audioCtx.currentTime);
        masterGain.gain.setValueAtTime(0, audioCtx.currentTime);
        masterGain.gain.linearRampToValueAtTime(sliderVol, audioCtx.currentTime + LOOP_FADE_IN_MS / 1000);
        if (audioEl.src) { audioEl.volume = 0; fadeAudioElTo(audioEl, audioVol, LOOP_FADE_IN_MS); }
      }, LOOP_FADE_OUT_MS);
    }

    function renderNoteStrip(parsed) {
      const strip = document.getElementById('noteStrip');
      if (!parsed.length) {
        strip.innerHTML = '<span style="color:#555;font-size:13px;">Enter a sequence and press Play — the note strip appears here.</span>';
        return;
      }
      strip.innerHTML = '';
      parsed.forEach((item, i) => {
        const noteStr = item && typeof item === 'object' ? item.note : item;
        const beats   = item && typeof item === 'object' ? item.beats : 1;
        const lyric   = (item && item.lyric) || '';
        const card = document.createElement('div');
        card.className = 'note-card';
        if (i === parsed.length - 1) card.classList.add('end-card');
        card.id = 'nc-' + i;
        const durLabel = DUR_LABELS[beats] || beats + 'b';
        const lyricSpan = lyric ? `<span class="nc-lyric">${lyric}</span>` : '';
        card.innerHTML = `<span class="nc-name">${noteStr}</span><span class="nc-dur">${durLabel}</span>${lyricSpan}`;
        card.addEventListener('click', () => startPlaybackFrom(lastParsed, i));
        strip.appendChild(card);
      });
    }

    function stopStripPlayback() {
      loopFadeGen++;           // cancels any pending doFadeLoop callback
      remainingRepeats = 0;
      // restore gain immediately
      const sliderVol = parseFloat(document.getElementById('volumeSlider').value);
      masterGain.gain.cancelScheduledValues(audioCtx.currentTime);
      masterGain.gain.setValueAtTime(sliderVol, audioCtx.currentTime);
      // restore audio element volume if it was mid-fade
      const audioEl = document.getElementById('audioPlayer');
      if (audioEl && audioEl.volume < 0.99) audioEl.volume = 1;
      allTimers.forEach(clearTimeout);
      allTimers = [];
      activeSources.forEach(s => { try { s.stop(0); } catch(e) {} });
      activeSources = [];
      document.querySelectorAll('.note-card.playing').forEach(c => c.classList.remove('playing'));
      document.getElementById('stopStripBtn').style.display = 'none';
    }

    function startPlaybackFrom(parsed, startIdx) {
      stopStripPlayback();
      if (!parsed.length) return;
      if (startIdx === 0) {
        // instant jump — #noteStrip has scroll-behavior:smooth in CSS, which would
        // otherwise animate this reset and lag behind the first note's audio
        const strip = document.getElementById('noteStrip');
        strip.style.scrollBehavior = 'auto';
        strip.scrollLeft = 0;
        strip.style.scrollBehavior = '';
      }
      document.getElementById('stopStripBtn').style.display = '';

      const bpm = parseFloat(document.getElementById('bpmInput').value) || 100;
      const msPerBeat = 60000 / bpm;

      let t = 0;
      parsed.slice(startIdx).forEach((item, offset) => {
        const i = startIdx + offset;
        const noteStr = item && typeof item === 'object' ? item.note : item;
        const beats   = item && typeof item === 'object' ? item.beats : 1;
        const durSec  = (msPerBeat * beats) / 1000;

        allTimers.push(setTimeout(() => {
          document.querySelectorAll('.note-card.playing').forEach(c => c.classList.remove('playing'));
          const card = document.getElementById('nc-' + i);
          if (card) {
            card.classList.add('playing');
            card.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
          }
          playNoteByChar(noteStr, durSec);
        }, t));
        t += msPerBeat * beats;
      });

      allTimers.push(setTimeout(() => {
        if (remainingRepeats > 0) {
          remainingRepeats--;
          doFadeLoop();   // fade out → restart → fade in
        } else {
          stopStripPlayback();
        }
      }, t));
    }

    document.getElementById('stopStripBtn').addEventListener('click', stopStripPlayback);

    // Play a note by name string from the sequence player
    function playNoteByChar(char, durationSeconds) {
      if (char === '_' || char === '=') return; // rest / hold — no audio
      const noteName = resolveNote(char);
      if (!noteName) return;
      triggerNote(noteName, durationSeconds);
    }

    function toggleSeqRepeat() {
      const btn = document.getElementById('seqRepeatBtn');
      const input = document.getElementById('repeatInput');
      const isOn = input.value !== '1';
      input.value = isOn ? '1' : '5';
      btn.style.background = isOn ? '#1a4a7a' : '#0e6b3a';
      btn.textContent = isOn ? '🔁 5×' : '🔁 5× on';
    }

    // Play button — parse, render strip, start from beginning
    playSequenceBtn.addEventListener("click", function() {
      const sequence = sequenceInput.value.trim();
      if (!sequence) return;
      lastParsed = parseNoteSequence(sequence);
      renderNoteStrip(lastParsed);
      startPlaybackFrom(lastParsed, 0);
      // set AFTER startPlaybackFrom — it calls stopStripPlayback() which resets remainingRepeats to 0
      remainingRepeats = Math.max(0, (parseInt(document.getElementById('repeatInput').value) || 1) - 1);
    });
    
    // Parse a sequence of notes.
    // Supports three token formats (comma-delimited):
    //   lyric:note:beats  →  { lyric, note, beats }   e.g. "do:C4:1"
    //   note:beats        →  { note, beats }           e.g. "C4:2"
    //   note              →  { note, beats:1 }         e.g. "C4"
    // Two-colon format lets a single file carry both melody and lyrics.
    function parseNoteSequence(inputString) {
      // Flatten multi-line: join lines with a comma, collapse runs of commas/spaces
      inputString = inputString
        .split('\n')
        .map(l => l.trim())
        .filter(Boolean)
        .join(',')
        .replace(/,+/g, ',');

      if (inputString.includes(',')) {
        return inputString.split(',').map(item => {
          item = item.trim();
          if (item === '') return null;
          const parts = item.split(':');
          if (parts.length >= 3) {
            // lyric:note:beats
            return { lyric: parts[0].trim(), note: parts[1].trim(), beats: parseFloat(parts[2]) || 1 };
          } else if (parts.length === 2) {
            return { note: parts[0].trim(), beats: parseFloat(parts[1]) || 1 };
          }
          return { note: item, beats: 1 };
        }).filter(Boolean);
      }
      
      // Original parsing for space-separated or continuous format
      const result = [];
      let i = 0;
      
      while (i < inputString.length) {
        // Skip spaces
        if (inputString[i] === ' ') {
          i++;
          continue;
        }
        
        // Check for rest
        if (inputString[i] === '_') {
          result.push('_');
          i++;
          continue;
        }
        
        // Check for note name followed by # or b and optional octave number
        if (i + 1 < inputString.length && "CDEFGAB".includes(inputString[i].toUpperCase())) {
          if ("#B".includes(inputString[i+1].toUpperCase())) {
            // We have a sharp/flat note
            if (i + 2 < inputString.length && "0123456789".includes(inputString[i+2])) {
              // We have an octave number too
              result.push(inputString.slice(i, i+3));
              i += 3;
            } else {
              // Just a sharp/flat note
              result.push(inputString.slice(i, i+2));
              i += 2;
            }
          } else if ("0123456789".includes(inputString[i+1])) {
            // Just a note with octave number
            result.push(inputString.slice(i, i+2));
            i += 2;
          } else {
            // Just a regular note
            result.push(inputString[i]);
            i++;
          }
        } else {
          // Regular character
          result.push(inputString[i]);
          i++;
        }
      }
      
      return result;
    }

    // Image picker
    let imageSizeState = 'small';

    function closeAudioPlayer() {

    }

    // ---- audio 5× repeat ----
    let audioRepeatRemaining = 0;
    let audioRepeatGen = 0;
    let _audioRepeatHandler = null;

    function startAudioRepeat5() {
      const audioEl = document.getElementById('audioPlayer');
      if (!audioEl.src) return;

      // cancel any running repeat
      audioRepeatGen++;
      if (_audioRepeatHandler) {
        audioEl.removeEventListener('ended', _audioRepeatHandler);
        _audioRepeatHandler = null;
      }

      const gen = audioRepeatGen;
      audioRepeatRemaining = 4; // 4 more after first play = 5 total

      const savedVol = audioEl.volume || 1;
      audioEl.currentTime = 0;
      audioEl.play();

      _audioRepeatHandler = function handleRepeatEnded() {
        if (audioRepeatGen !== gen) {
          audioEl.removeEventListener('ended', _audioRepeatHandler);
          _audioRepeatHandler = null;
          return;
        }
        if (audioRepeatRemaining > 0) {
          audioRepeatRemaining--;
          audioEl.volume = 0;
          audioEl.currentTime = 0;
          audioEl.play();
          fadeAudioElTo(audioEl, savedVol, LOOP_FADE_IN_MS);
        } else {
          audioEl.removeEventListener('ended', _audioRepeatHandler);
          _audioRepeatHandler = null;
        }
      };
      audioEl.addEventListener('ended', _audioRepeatHandler);
    }

    // ── Dropbox integration ────────────────────────────────────────────────
    (function () {
      let dropboxAccessToken = null;
      let dropboxAppKey = '';
      const IS_LOCALHOST = ['localhost', '127.0.0.1'].includes(window.location.hostname);
      const DBX_LAST_PATH_KEY = 'piano-dbx-last-path';

      function generateCodeVerifier() {
        const a = new Uint8Array(64);
        crypto.getRandomValues(a);
        return btoa(String.fromCharCode(...a)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
      }
      async function generateCodeChallenge(v) {
        const digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(v));
        return btoa(String.fromCharCode(...new Uint8Array(digest))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
      }
      async function fetchAppKey() {
        if (IS_LOCALHOST) return localStorage.getItem('dropbox-app-key') || '';
        try { const r = await fetch('/api/dropbox-key'); return (await r.json()).key || ''; } catch { return ''; }
      }

      async function dropboxSignInPopup(onSuccess) {
        let appKey;
        if (IS_LOCALHOST) {
          appKey = localStorage.getItem('dropbox-app-key') || prompt('Enter your Dropbox App Key:');
          if (!appKey) return;
          localStorage.setItem('dropbox-app-key', appKey);
        } else {
          appKey = await fetchAppKey();
          if (!appKey) { alert('Dropbox App Key not configured'); return; }
        }
        dropboxAppKey = appKey;
        const verifier  = generateCodeVerifier();
        const challenge = await generateCodeChallenge(verifier);
        localStorage.setItem('dropbox_code_verifier', verifier);
        const redirectUri = window.location.origin + window.location.pathname;
        const authUrl = 'https://www.dropbox.com/oauth2/authorize'
          + '?client_id=' + appKey + '&response_type=code'
          + '&code_challenge=' + challenge + '&code_challenge_method=S256'
          + '&redirect_uri=' + encodeURIComponent(redirectUri) + '&token_access_type=online';
        const w = 600, h = 700;
        window.open(authUrl, 'dropbox-auth',
          `width=${w},height=${h},left=${Math.round(window.screenX+(window.outerWidth-w)/2)},top=${Math.round(window.screenY+(window.outerHeight-h)/2)}`);
        function handler(e) {
          if (e.origin !== window.location.origin) return;
          if (!e.data || e.data.type !== 'dropbox-token') return;
          dropboxAccessToken = e.data.token;
          window.removeEventListener('message', handler);
          if (onSuccess) onSuccess();
        }
        window.addEventListener('message', handler);
      }

      async function handleOAuthRedirect() {
        const params = new URLSearchParams(window.location.search);
        const code = params.get('code');
        if (!code) return;
        const verifier = sessionStorage.getItem('dropbox_code_verifier') || localStorage.getItem('dropbox_code_verifier');
        const appKey = await fetchAppKey();
        if (!verifier || !appKey) return;
        const redirectUri = window.location.origin + window.location.pathname;
        try {
          const res = await fetch('https://api.dropboxapi.com/oauth2/token', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: new URLSearchParams({ code, grant_type:'authorization_code', client_id:appKey, redirect_uri:redirectUri, code_verifier:verifier }).toString(),
          });
          const data = await res.json();
          if (data.access_token) {
            sessionStorage.removeItem('dropbox_code_verifier');
            localStorage.removeItem('dropbox_code_verifier');
            if (window.opener && !window.opener.closed) {
              window.opener.postMessage({ type:'dropbox-token', token:data.access_token }, window.location.origin);
              window.close(); return;
            }
            dropboxAccessToken = data.access_token;
            window.history.replaceState({}, document.title, window.location.pathname);
          }
        } catch(err) {
          if (window.opener && !window.opener.closed) window.close();
        }
      }
      handleOAuthRedirect();

      window.getDropboxAccessToken = () => dropboxAccessToken;
      window.dropboxSignInPopup    = dropboxSignInPopup;

      // Headers must be ISO-8859-1; escape non-ASCII chars in the JSON value
      function dbxArg(obj) {
        return JSON.stringify(obj).replace(/[^\x00-\x7F]/g, c =>
          '\\u' + c.charCodeAt(0).toString(16).padStart(4, '0')
        );
      }

      window.dropboxDownloadText = async function(path) {
        const res = await fetch('https://content.dropboxapi.com/2/files/download', {
          method: 'POST',
          headers: { Authorization:'Bearer '+dropboxAccessToken, 'Dropbox-API-Arg':dbxArg({path}) },
        });
        if (!res.ok) throw new Error('Download failed ('+res.status+')');
        return res.text();
      };
      window.dropboxDownloadBlob = async function(path) {
        const res = await fetch('https://content.dropboxapi.com/2/files/download', {
          method: 'POST',
          headers: { Authorization:'Bearer '+dropboxAccessToken, 'Dropbox-API-Arg':dbxArg({path}) },
        });
        if (!res.ok) throw new Error('Download failed ('+res.status+')');
        return res.blob();
      };
      window.dropboxListFolder = async function(path) {
        const normPath = (!path || path === '/') ? '' : ('/'+path.replace(/^\/+|\/+$/g,''));
        const res = await fetch('https://api.dropboxapi.com/2/files/list_folder', {
          method: 'POST',
          headers: { Authorization:'Bearer '+dropboxAccessToken, 'Content-Type':'application/json' },
          body: JSON.stringify({path: normPath}),
        });
        if (!res.ok) throw new Error('List folder failed ('+res.status+')');
        return res.json();
      };

      // Modal open/close
      window.openDbxModal = function(startPath) {
        document.getElementById('dbxOverlay').classList.add('open');
        const token = window.getDropboxAccessToken && window.getDropboxAccessToken();
        if (!token) {
          document.getElementById('dbxList').innerHTML =
            '<button class="dbx-signin-btn" onclick="(async()=>{await window.dropboxSignInPopup(()=>dbxBrowse(\'/\'));})()">Sign in with Dropbox</button>';
          document.getElementById('dbxStatus').textContent = 'Not signed in';
          return;
        }
        dbxBrowse(startPath || localStorage.getItem(DBX_LAST_PATH_KEY) || '/');
      };
      window.closeDbxModal = function() {
        document.getElementById('dbxOverlay').classList.remove('open');
      };

      const DBX_IMAGE_EXT = new Set(['.jpg','.jpeg','.png','.gif','.webp','.bmp']);
      const DBX_AUDIO_EXT = new Set(['.mp3','.wav','.m4a','.ogg','.flac','.aac']);
      const DBX_TEXT_EXT  = new Set(['.txt']);

      window.dbxBrowse = async function(path) {
        const token = window.getDropboxAccessToken && window.getDropboxAccessToken();
        if (!token) { window.openDbxModal(); return; }
        const goBtn = document.getElementById('dbxGoBtn');
        goBtn.disabled = true;
        document.getElementById('dbxStatus').textContent = 'Loading…';
        document.getElementById('dbxList').innerHTML = '';
        const normPath = (!path || path === '/') ? '' : ('/'+path.replace(/^\/+|\/+$/g,''));
        document.getElementById('dbxPathInput').value = normPath || '/';
        localStorage.setItem(DBX_LAST_PATH_KEY, normPath || '/');
        try {
          const data = await window.dropboxListFolder(normPath || '');
          const entries = (data.entries || [])
            .map(e => ({ name:e.name, path:e.path_lower||e.path_display, isFolder:e['.tag']==='folder' }))
            .filter(e => {
              if (e.isFolder) return true;
              const ext = e.name.slice(e.name.lastIndexOf('.')).toLowerCase();
              return DBX_IMAGE_EXT.has(ext) || DBX_AUDIO_EXT.has(ext) || DBX_TEXT_EXT.has(ext);
            })
            .sort((a,b) => {
              if (a.isFolder !== b.isFolder) return a.isFolder ? -1 : 1;
              return a.name.localeCompare(b.name, undefined, {numeric:true});
            });
          const nFolders = entries.filter(e=>e.isFolder).length;
          const nFiles   = entries.filter(e=>!e.isFolder).length;
          document.getElementById('dbxStatus').textContent = `${nFolders} folders · ${nFiles} files`;
          dbxRenderBreadcrumb(normPath);
          dbxRenderList(entries);
        } catch(err) {
          document.getElementById('dbxStatus').textContent = 'Error: '+err.message;
        } finally { goBtn.disabled = false; }
      };

      function dbxRenderBreadcrumb(path) {
        const el = document.getElementById('dbxBreadcrumb');
        if (!path) { el.innerHTML = ''; return; }
        const parts = path.replace(/^\//,'').split('/').filter(Boolean);
        let html = '<span style="color:#444">▸</span>';
        parts.forEach((part,i) => {
          const crumbPath = '/'+parts.slice(0,i+1).join('/');
          html += `<span style="color:#444"> / </span><button class="dbx-crumb" onclick="dbxBrowse('${crumbPath}')">${part}</button>`;
        });
        el.innerHTML = html;
      }

      function dbxRenderList(entries) {
        const list = document.getElementById('dbxList');
        if (!entries.length) {
          list.innerHTML = '<div style="color:#555;padding:24px;text-align:center">No image or text files found</div>';
          return;
        }
        list.innerHTML = entries.map(e => {
          if (e.isFolder) {
            const p = e.path.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
            return `<div class="dbx-item" onclick="dbxBrowse('${p}')"><span class="dbx-icon">📁</span><span class="dbx-name">${e.name}</span></div>`;
          }
          const ext = e.name.slice(e.name.lastIndexOf('.')).toLowerCase();
          const isImg   = DBX_IMAGE_EXT.has(ext);
          const isAudio = DBX_AUDIO_EXT.has(ext);
          const icon  = isImg ? '🖼️' : isAudio ? '🎵' : '📄';
          const label = isImg ? 'Image' : isAudio ? 'Audio' : 'Load';
          const fileType = isImg ? 'image' : isAudio ? 'audio' : 'text';
          const p = e.path.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
          const n = e.name.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
          return `<div class="dbx-item">
            <span class="dbx-icon">${icon}</span>
            <span class="dbx-name">${e.name}</span>
            <button class="dbx-action" onclick="dbxLoadFile('${p}','${n}','${fileType}')">${label}</button>
          </div>`;
        }).join('');
      }

      window.dbxLoadFile = async function(path, name, fileType) {
        try {
          if (fileType === 'image') {
            const blob = await window.dropboxDownloadBlob(path);
            const img  = document.getElementById('imagePreview');
            img.src = URL.createObjectURL(blob);
            img.style.maxHeight = '180px';
            imageSizeState = 'small';
            document.getElementById('imagePreviewContainer').style.display = 'block';
            document.getElementById('loadImageBtn').textContent = name;
            window.closeDbxModal();
          } else if (fileType === 'audio') {
            const blob  = await window.dropboxDownloadBlob(path);
            const audio = document.getElementById('audioPlayer');
            audio.src = URL.createObjectURL(blob);
            document.getElementById('audioPlayerContainer').style.display = 'block';
            document.getElementById('loadAudioBtn').textContent = name;
            window.closeDbxModal();
          } else {
            const text = await window.dropboxDownloadText(path);
            document.getElementById('sequenceInput').value = text.trim();
            document.getElementById('dbxStatus').textContent = '✅ '+name+' loaded — pick an image or close';
            closeAudioPlayer();
          }
        } catch(err) {
          document.getElementById('dbxStatus').textContent = 'Error: '+err.message;
        }
      };

      document.getElementById('dbxOverlay').addEventListener('click', e => {
        if (e.target === document.getElementById('dbxOverlay')) window.closeDbxModal();
      });
      document.getElementById('dbxPathInput').addEventListener('keydown', e => {
        if (e.key === 'Enter') window.dbxBrowse(e.target.value);
      });
    })();
  </script>
</body>
