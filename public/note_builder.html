<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Staff Note Builder</title>
<style>
  :root{
    --ink:#1c1c1e;
    --paper:#faf9f6;
    --line:#2b2b2b;
    --accent:#7c3aed;
    --accent-soft:#efe8fd;
    --muted:#8a8a8e;
    --border:#e2e0db;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--paper);
    color:var(--ink);
    padding:20px;
  }
  h1{
    font-size:19px;
    margin:0 0 4px;
  }
  .sub{
    color:var(--muted);
    font-size:13px;
    margin-bottom:16px;
  }
  .app{
    display:grid;
    grid-template-columns:1fr;
    gap:16px;
    max-width:1100px;
    margin:0 auto;
  }
  @media(min-width:860px){
    .app{grid-template-columns:440px 1fr;}
  }
  .panel{
    background:#fff;
    border:1px solid var(--border);
    border-radius:14px;
    padding:16px;
  }
  .panel h2{
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:.04em;
    color:var(--muted);
    margin:0 0 10px;
  }
  .dur-row{
    display:flex;
    gap:6px;
    margin-bottom:10px;
    flex-wrap:wrap;
  }
  .dur-btn{
    flex:1;
    min-width:56px;
    padding:8px 4px;
    border-radius:8px;
    border:1px solid var(--border);
    background:#fff;
    font-size:13px;
    cursor:pointer;
    color:var(--ink);
  }
  .dur-btn.active{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }
  svg{
    width:100%;
    height:auto;
    display:block;
    touch-action:manipulation;
  }
  .row-hit{
    cursor:pointer;
  }
  .row-hit:hover rect{
    fill:var(--accent-soft);
  }
  .pending-bar{
    margin:10px 0;
    font-size:14px;
    min-height:20px;
  }
  .pending-bar b{color:var(--accent);}
  .btn-row{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    margin-top:8px;
  }
  button.action{
    padding:9px 12px;
    border-radius:8px;
    border:1px solid var(--border);
    background:#fff;
    font-size:13px;
    cursor:pointer;
    color:var(--ink);
  }
  button.action:hover{background:#f3f2ee;}
  button.primary{
    background:var(--ink);
    color:#fff;
    border-color:var(--ink);
  }
  button.primary:hover{background:#000;}
  button.danger{
    color:#b3261e;
  }
  #barList{
    font-size:14px;
    line-height:1.9;
    max-height:260px;
    overflow-y:auto;
    padding-right:4px;
  }
  #barList .bar-line{
    padding:4px 0;
    border-bottom:1px dashed var(--border);
  }
  #barList .bar-num{
    color:var(--muted);
    font-weight:600;
    margin-right:6px;
  }
  textarea{
    width:100%;
    min-height:90px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:13px;
    padding:10px;
    border-radius:8px;
    border:1px solid var(--border);
    resize:vertical;
    background:#fbfbfa;
  }
  .copy-row{
    display:flex;
    gap:8px;
    align-items:center;
    margin-top:8px;
  }
  #copyStatus{
    font-size:12px;
    color:var(--accent);
  }
  .hint{
    font-size:12px;
    color:var(--muted);
    margin-top:6px;
  }
</style>
</head>
<body>

<h1>Staff Note Builder</h1>
<div class="sub">Pick Quarter or Half (or press Q / H), then click a note on the staff — it appends instantly. Press Z to undo.</div>

<div class="app">

  <div class="panel">
    <h2>1. Duration</h2>
    <div class="dur-row">
      <button class="dur-btn active" data-dur="4">Quarter <small>(Q)</small></button>
      <button class="dur-btn" data-dur="2">Half <small>(H)</small></button>
      <button class="dur-btn" data-dur="3">Dotted Half <small>(D)</small></button>
    </div>

    <h2>2. Click a note to add it</h2>
    <svg id="staff" viewBox="0 0 500 330" xmlns="http://www.w3.org/2000/svg"></svg>

    <div class="btn-row">
      <button class="action" id="addRestBtn">Add rest (_)</button>
      <button class="action" id="undoBtn">Undo last</button>
      <button class="action danger" id="clearBtn">Clear all</button>
    </div>
  </div>

  <div class="panel">
    <h2>Reference Image</h2>
    <div>
      <button class="action" id="loadImageBtn" onclick="document.getElementById('imageFileInput').click()">Load image</button>
      <input type="file" id="imageFileInput" accept="image/*" style="display:none;">
    </div>
    <div id="imagePreviewContainer" style="display:none; margin-top:10px; position:relative;">
      <img id="imagePreview" style="max-width:100%; max-height:150px; border-radius:8px; cursor:pointer; display:block;" onclick="toggleImageSize()">
      <button onclick="closeImagePreview()" style="position:absolute; top:4px; right:4px; background:rgba(0,0,0,0.6); color:#fff; border:none; border-radius:50%; width:24px; height:24px; cursor:pointer; font-size:16px; line-height:1;">×</button>
    </div>

    <h2 style="margin-top:14px;">Output</h2>
    <textarea id="melodyOut" placeholder="E4:4, G4:4, Bb4:2 ..."></textarea>
    <div class="copy-row">
      <button class="action" id="copyBtn">Copy</button>
      <span id="copyStatus"></span>
    </div>
  </div>

</div>

<script>
const rows = [
  {name:'D6', y:20},
  {name:'C6', y:38},
  {name:'B5', y:56},
  {name:'A5', y:74},
  {name:'G5', y:92},
  {name:'F5', y:110},
  {name:'E5', y:128},
  {name:'D5', y:146},
  {name:'C5', y:164},
  {name:'B4', y:182},
  {name:'A4', y:200},
  {name:'G4', y:218},
  {name:'F4', y:236},
  {name:'E4', y:254},
  {name:'D4', y:272},
  {name:'C4', y:290},
  {name:'B3', y:308},
];
const staffLineNames = ['F5','D5','B4','G4','E4'];
const ledgerNames = ['G5','A5','B5','C6','D6','D4','C4','B3'];

const svgNS = "http://www.w3.org/2000/svg";
const svg = document.getElementById('staff');
const X_LEFT = 75, X_RIGHT = 430, X_NOTE = 190;

function el(tag, attrs){
  const e = document.createElementNS(svgNS, tag);
  for(const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}

function drawStaff(){
  svg.innerHTML = '';
  const clef = el('text', {x:30, y:200, 'font-size':95, 'font-family':'Georgia, serif', fill:'#1c1c1e'});
  clef.textContent = '\uD834\uDD1E';
  svg.appendChild(clef);

  rows.forEach(r=>{
    if(ledgerNames.includes(r.name)){
      svg.appendChild(el('line',{x1:X_NOTE-22,y1:r.y,x2:X_NOTE+22,y2:r.y,stroke:'#c9c7c0',['stroke-width']:1.5}));
    }
    if(staffLineNames.includes(r.name)){
      svg.appendChild(el('line',{x1:X_LEFT,y1:r.y,x2:X_RIGHT,y2:r.y,stroke:'#2b2b2b',['stroke-width']:1.6}));
    }
    const label = el('text',{x:X_LEFT-45,y:r.y+4,'font-size':12,fill:'#8a8a8e','font-family':'monospace'});
    label.textContent = r.name;
    svg.appendChild(label);

    const g = el('g',{class:'row-hit'});
    const hit = el('rect',{x:X_LEFT-2,y:r.y-8,width:X_RIGHT-X_LEFT+4,height:16,fill:'transparent'});
    g.appendChild(hit);
    g.addEventListener('click', ()=>addNote(r.name));
    svg.appendChild(g);
  });
}

let duration = '4';

// Duration buttons
document.querySelectorAll('.dur-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.dur-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    duration = btn.dataset.dur;
  });
});

// Keyboard shortcuts Q = quarter, H = half, D = dotted half
document.addEventListener('keydown', e=>{
  if(e.target.tagName === 'TEXTAREA') return;
  if(e.key === 'q' || e.key === 'Q'){
    document.querySelector('[data-dur="4"]').click();
  } else if(e.key === 'h' || e.key === 'H'){
    document.querySelector('[data-dur="2"]').click();
  } else if(e.key === 'd' || e.key === 'D'){
    document.querySelector('[data-dur="3"]').click();
  } else if(e.key === 'z' || e.key === 'Z'){
    document.getElementById('undoBtn').click();
  }
});

function appendToTextarea(token){
  const ta = document.getElementById('melodyOut');
  ta.value = ta.value ? ta.value + ', ' + token : token;
}

function addNote(name){
  appendToTextarea(name + ':' + duration);
}

document.getElementById('addRestBtn').addEventListener('click', ()=>{
  appendToTextarea('_:' + duration);
});

document.getElementById('undoBtn').addEventListener('click', ()=>{
  const ta = document.getElementById('melodyOut');
  const parts = ta.value.split(',').map(s=>s.trim()).filter(Boolean);
  parts.pop();
  ta.value = parts.join(', ');
});

document.getElementById('clearBtn').addEventListener('click', ()=>{
  document.getElementById('melodyOut').value = '';
});

document.getElementById('copyBtn').addEventListener('click', ()=>{
  const ta = document.getElementById('melodyOut');
  const status = document.getElementById('copyStatus');
  navigator.clipboard.writeText(ta.value).then(()=>{
    status.textContent = 'Copied!';
    setTimeout(()=>status.textContent='',1500);
  }).catch(()=>{
    try{ ta.select(); document.execCommand('copy'); status.textContent='Copied!'; }
    catch(e){ status.textContent='Select text and press Cmd+C'; }
    setTimeout(()=>status.textContent='',2000);
  });
});

// Image picker
let imageSizeState = 'small';
const imageSizes = { small: '150px', regular: '350px', large: '700px' };

document.getElementById('imageFileInput').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file || !file.type.startsWith('image/')) return;
  const img = document.getElementById('imagePreview');
  img.src = URL.createObjectURL(file);
  img.style.maxHeight = imageSizes.small;
  imageSizeState = 'small';
  document.getElementById('imagePreviewContainer').style.display = 'block';
  document.getElementById('loadImageBtn').textContent = file.name;
});

function toggleImageSize() {
  const img = document.getElementById('imagePreview');
  imageSizeState = imageSizeState === 'small' ? 'regular' : imageSizeState === 'regular' ? 'large' : 'small';
  img.style.maxHeight = imageSizes[imageSizeState];
}

function closeImagePreview() {
  document.getElementById('imagePreviewContainer').style.display = 'none';
  document.getElementById('loadImageBtn').textContent = 'Load image';
  document.getElementById('imageFileInput').value = '';
}

drawStaff();
</script>

</body>
</html>
